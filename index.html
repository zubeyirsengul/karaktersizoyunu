    ctx.restore();
}

// Ekranın üstünde canavarın can barı
function drawBossBar(ctx, b) {
    const w = Math.min(500, width - 40), x = (width - w) / 2, y = 95;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(x - 4, y - 4, w + 8, 26);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(x, y, w * b.hp / b.T.hp, 18);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t(b.T.nameKey) + "  " + b.hp + " / " + b.T.hp, width / 2, y + 9);
    ctx.textBaseline = "alphabetic";
}

// --- ARKA PLAN: bölüme göre paralaks katmanlar ---
// 1: gündüz, yeşil tepeler ve ağaçlar · 2: bozkırda gün batımı, yurtlar · 3: gece şehri, projektörler
const THEMES = {
    1: { sky: ["#38bdf8", "#7dd3fc", "#e0f2fe", "#fef9c3"], sun: { x: 0.8, y: 0.17, r: 44, c: "#fde68a", glow: "rgba(253,224,71,0.35)" },
         clouds: "rgba(255,255,255,0.92)",
         ground: ["#7a4a24", "#3b2412"], grass: "#4caf2f", grassDark: "#2e6b1c" },
    2: { sky: ["#1e1b4b", "#831843", "#ea580c", "#fcd34d"], sun: { x: 0.3, y: 0.6, r: 70, c: "#fdba74", glow: "rgba(251,146,60,0.45)" },
         clouds: "rgba(253,186,116,0.5)",
         ground: ["#8a5a2b", "#4a2f15"], grass: "#b5a642", grassDark: "#7c6f2a" },
    3: { sky: ["#020617", "#0f172a", "#1e3a8a"], moon: { x: 0.82, y: 0.15, r: 32 }, stars: true,
         ground: ["#3f3f46", "#18181b"], grass: "#9ca3af", grassDark: "#4b5563", curb: true }
};
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
// Yumuşak tepe profili (-1..1): farklı frekanslı sinüslerin toplamı
const ridge = (x, seed) => 0.5 * Math.sin(x * 0.0021 + seed) + 0.3 * Math.sin(x * 0.0053 + seed * 2.3) + 0.2 * Math.sin(x * 0.013 + seed * 4.1);
const hillY = (sx, par, base, amp, seed) => base - amp * (1 + ridge(sx + camX * par, seed));
let skyCache = null;

function hillLayer(par, base, amp, seed, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, height);
    for (let sx = 0; sx <= width + 12; sx += 12) ctx.lineTo(sx, hillY(sx, par, base, amp, seed));
    ctx.lineTo(width, height);
    ctx.closePath();
    ctx.fill();
}

// Katman üzerinde aralıklı nesneler (ağaç, yurt): her biri dünyada sabit yerde durur
function layerProps(par, spacing, chance, seed, fn) {
    const off = camX * par;
    for (let i = Math.floor(off / spacing) - 1; i <= Math.ceil((off + width) / spacing) + 1; i++) {
        if (hash(i * 1.31 + seed) > chance) continue;
        fn(i * spacing + hash(i * 2.7 + seed) * spacing * 0.6 - off, i);
    }
}

function cloud(x, y, s) {
    ctx.beginPath();
    [[0, 0, 30], [35, -16, 38], [76, 0, 30], [38, 8, 32]].forEach(([dx, dy, r]) => {
        ctx.moveTo(x + dx * s + r * s, y + dy * s);
        ctx.arc(x + dx * s, y + dy * s, r * s, 0, Math.PI * 2);
    });
    ctx.fill();
}

function skyline(par, base, minH, maxH, color, windowColor, seed) {
    const step = 70, off = camX * par;
    for (let i = Math.floor(off / step) - 2; i <= Math.ceil((off + width) / step) + 1; i++) {
        const bw = 50 + hash(i * 2.11 + seed) * 60, bh = minH + hash(i * 1.37 + seed) * (maxH - minH);
        const sx = i * step - off + (hash(i * 3.3 + seed) - 0.5) * 20, top = base - bh;
        ctx.fillStyle = color;
        ctx.fillRect(sx, top, bw, height - top);
        if (hash(i * 4.1 + seed) > 0.7) ctx.fillRect(sx + bw / 2 - 1, top - 18, 2, 18);   // anten
        if (!windowColor) continue;
        ctx.fillStyle = windowColor;
        const cols = Math.floor((bw - 14) / 13), rows = Math.floor((bh - 16) / 16);
        for (let r = 0; r < rows; r++)
            for (let c = 0; c < cols; c++)
                if (hash(i * 91.7 + r * 7.3 + c * 3.1 + seed) > 0.62) ctx.fillRect(sx + 8 + c * 13, top + 10 + r * 16, 6, 9);
    }
}

function drawBackground() {
    const th = THEMES[currentLevel], time = performance.now() / 1000;
    if (!skyCache || skyCache.h !== height || skyCache.lvl !== currentLevel) {
        const g = ctx.createLinearGradient(0, 0, 0, height);
        th.sky.forEach((c, i) => g.addColorStop(i / (th.sky.length - 1), c));
        skyCache = { g, h: height, lvl: currentLevel };
    }
    ctx.fillStyle = skyCache.g;
    ctx.fillRect(0, 0, width, height);

    // Yıldızlar (yanıp söner)
    if (th.stars) {
        ctx.fillStyle = "#fff";
        for (let i = 0; i < 160; i++) {
            const x = ((hash(i) * 3000 - camX * 0.02) % 3000 + 3000) % 3000;
            if (x > width) continue;
            ctx.globalAlpha = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(time * (1 + hash(i + 0.2) * 3) + i));
            const s = hash(i + 0.9) > 0.85 ? 2.5 : 1.5;
            ctx.fillRect(x, hash(i + 0.5) * height * 0.6, s, s);
        }
        ctx.globalAlpha = 1;
    }

    // Güneş / ay, etrafında hale
    const orb = th.sun || th.moon;
    const ox = width * orb.x, oy = height * orb.y;
    const glow = ctx.createRadialGradient(ox, oy, orb.r * 0.5, ox, oy, orb.r * 4);
    glow.addColorStop(0, th.sun ? orb.glow : "rgba(226,232,240,0.25)");
    glow.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = glow;
    ctx.fillRect(ox - orb.r * 4, oy - orb.r * 4, orb.r * 8, orb.r * 8);
    ctx.fillStyle = th.sun ? orb.c : "#f1f5f9";
    ctx.beginPath(); ctx.arc(ox, oy, orb.r, 0, Math.PI * 2); ctx.fill();
    if (th.moon) {
        ctx.fillStyle = "rgba(148,163,184,0.45)";
        [[-10, -6, 7], [9, 8, 5], [6, -12, 4]].forEach(([dx, dy, r]) => { ctx.beginPath(); ctx.arc(ox + dx, oy + dy, r, 0, Math.PI * 2); ctx.fill(); });
    }

    // Bulutlar: rüzgârla yavaşça kayar
    if (th.clouds) {
        ctx.fillStyle = th.clouds;
        const P = Math.max(4200, width + 800);
        for (let i = 0; i < 9; i++) {
            const x = (((hash(i * 3.1) * P + time * (6 + hash(i) * 8) - camX * 0.12) % P) + P) % P - 300;
            if (x > width + 50) continue;
            cloud(x, height * (0.08 + hash(i * 7.7) * 0.28), 0.7 + hash(i * 5.3) * 0.8);
        }
    }

    if (currentLevel === 1) {
        hillLayer(0.08, height * 0.6, 80, 1.3, "#93a8c8");          // uzak dağlar (soluk mavi)
        hillLayer(0.22, height * 0.74, 42, 4.2, "#6a9a4c");         // orta tepeler
        const nb = height * 0.85;
        hillLayer(0.45, nb, 24, 7.9, "#3f7a33");                    // yakın tepeler + ağaçlar
        layerProps(0.45, 150, 0.55, 2, (sx, i) => {
            const y = hillY(sx, 0.45, nb, 24, 7.9) + 4, s = 0.8 + hash(i * 9.1) * 0.6;
            ctx.fillStyle = "#4a2e16"; ctx.fillRect(sx - 3 * s, y - 22 * s, 6 * s, 22 * s);
            ctx.fillStyle = "#2f6b2a";
            ctx.beginPath(); ctx.arc(sx, y - 34 * s, 18 * s, 0, Math.PI * 2); ctx.arc(sx - 12 * s, y - 24 * s, 12 * s, 0, Math.PI * 2); ctx.arc(sx + 12 * s, y - 24 * s, 12 * s, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = "rgba(255,255,255,0.12)";
            ctx.beginPath(); ctx.arc(sx - 5 * s, y - 40 * s, 8 * s, 0, Math.PI * 2); ctx.fill();
        });
    } else if (currentLevel === 2) {
        hillLayer(0.08, height * 0.62, 85, 2.1, "#6b2f5f");         // güneşin battığı mor dağlar
        const mb = height * 0.76;
        hillLayer(0.22, mb, 28, 5.5, "#8a4a2a");                    // bozkır
        layerProps(0.22, 650, 0.5, 5, sx => {                       // yurtlar
            const y = hillY(sx, 0.22, mb, 28, 5.5) + 6;
            ctx.fillStyle = "#f3e3c3"; ctx.fillRect(sx - 30, y - 26, 60, 26);
            ctx.beginPath(); ctx.ellipse(sx, y - 26, 32, 18, 0, Math.PI, 0); ctx.fill();
            ctx.fillStyle = "#b91c1c"; ctx.fillRect(sx - 30, y - 22, 60, 5);
            ctx.fillStyle = "#3f1d0b"; ctx.fillRect(sx - 7, y - 16, 14, 16);
            ctx.fillStyle = "#7c2d12"; ctx.fillRect(sx - 2, y - 48, 4, 6);
        });
        hillLayer(0.45, height * 0.87, 16, 8.4, "#5a3317");
        // Kartallar süzülür
        ctx.strokeStyle = "#1e1b4b"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
        for (let i = 0; i < 4; i++) {
            const x = (((time * (30 + i * 7) + i * 420 - camX * 0.05) % (width + 300)) + width + 300) % (width + 300) - 150;
            const y = height * (0.2 + 0.08 * i) + Math.sin(time * 0.8 + i) * 12, f = Math.sin(time * 4 + i) * 6;
            ctx.beginPath(); ctx.moveTo(x - 14, y - 4 - f); ctx.quadraticCurveTo(x - 6, y - 8, x, y); ctx.quadraticCurveTo(x + 6, y - 8, x + 14, y - 4 - f); ctx.stroke();
        }
    } else {
        // Projektörler gökyüzünü tarar (mavi ve kırmızı: 17/25 gecesi)
        [[0.25, "rgba(147,197,253,0.16)", 0], [0.7, "rgba(252,165,165,0.12)", 2]].forEach(([fx, col, ph]) => {
            const x = width * fx, y = height * 0.85, a = Math.sin(time * 0.6 + ph) * 0.5, L = height * 1.3;
            const g = ctx.createLinearGradient(x, y, x + Math.sin(a) * L, y - Math.cos(a) * L);
            g.addColorStop(0, col); g.addColorStop(1, "rgba(255,255,255,0)");
            ctx.fillStyle = g;
            ctx.beginPath(); ctx.moveTo(x - 6, y);
            ctx.lineTo(x + Math.sin(a - 0.07) * L, y - Math.cos(a - 0.07) * L);
            ctx.lineTo(x + Math.sin(a + 0.07) * L, y - Math.cos(a + 0.07) * L);
            ctx.lineTo(x + 6, y); ctx.closePath(); ctx.fill();
        });
        skyline(0.15, height * 0.74, 60, 210, "#1e293b", "rgba(253,230,138,0.35)", 1);
        skyline(0.35, height * 0.88, 80, 260, "#0b1222", "rgba(253,224,71,0.8)", 7);
    }
}

// Zemin ve platformlar: toprak katmanı + çimen (3. bölümde kaldırım)
function drawPlatform(ctx, p) {
    const th = THEMES[currentLevel];
    const x0 = Math.max(p.x, camX - 40), x1 = Math.min(p.x + p.w, camX + width + 40);
    if (x1 <= x0) return;
    const g = ctx.createLinearGradient(0, p.y, 0, p.y + Math.min(p.h, 220));
    g.addColorStop(0, th.ground[0]); g.addColorStop(1, th.ground[1]);
    ctx.fillStyle = g;
    ctx.fillRect(x0, p.y, x1 - x0, p.h);
    // Toprakta taşlar
    ctx.fillStyle = "rgba(0,0,0,0.2)";
    const depth = Math.min(p.h, 140);
    for (let x = Math.floor(x0 / 40) * 40; x < x1; x += 40)
        for (let r = 0; r < 3; r++) {
            const hh = hash(x * 0.37 + r * 11 + p.y * 0.01);
            const sy = p.y + 24 + r * (depth - 30) / 3 + hh * 8;
            if (hh > 0.5 && sy < p.y + p.h - 6) ctx.fillRect(x + hh * 30, sy, 7, 4);
        }
    ctx.fillStyle = th.grass; ctx.fillRect(x0, p.y, x1 - x0, 14);
    ctx.fillStyle = th.grassDark; ctx.fillRect(x0, p.y + 14, x1 - x0, 4);
    if (th.curb) {
        ctx.fillStyle = "rgba(0,0,0,0.35)";
        for (let x = Math.ceil(x0 / 60) * 60; x < x1; x += 60) ctx.fillRect(x, p.y, 3, 14);
    } else {
        ctx.fillStyle = th.grass;
        for (let x = Math.ceil(x0 / 18) * 18; x < x1; x += 18) {
            const hh = hash(x * 0.11);
            ctx.beginPath(); ctx.moveTo(x - 4, p.y + 1); ctx.lineTo(x + (hh - 0.5) * 6, p.y - 5 - hh * 9); ctx.lineTo(x + 4, p.y + 1); ctx.fill();
        }
    }
}

// FETÖ'nün savurduğu 1 dolar: kırmızı parıltılı (tehlikeli olduğu belli olsun)
function drawOneDollar(ctx, x, y, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 10;
    ctx.fillStyle = "#4d7c0f"; ctx.fillRect(-22, -11, 44, 22);
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#a3e635"; ctx.fillRect(-19, -8, 38, 16);
    ctx.fillStyle = "#4d7c0f";
    ctx.beginPath(); ctx.ellipse(0, 0, 7, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.font = "bold 9px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText("1", -13, 0); ctx.fillText("1", 13, 0);
    ctx.fillStyle = "#a3e635"; ctx.fillText("$", 0, 0.5);
    ctx.restore();
}

// FETÖ: bastonlu, kambur yaşlı adam. Koyu palto, kravat, dazlak kafa, beyaz yan saçlar ve gür beyaz kaşlar.
// Bir elinde baston, öbür eliyle 1 dolar savurur. Oyuncuya döner (ayna).
function drawFeto(ctx, b) {
    const W = b.T.dw, H = b.T.dh;   // tasarım boyutu (bossBaseTransform küçültür)
    const slam = b.state === 'crouch' && b.next === 'slam' ? 1 - b.stateT / 34 : 0;    // baston havaya kalkar
    const toss = b.state === 'crouch' && b.next === 'volley' ? 1 - b.stateT / 30 : 0;   // el geriye gider
    const hit = b.recover > 0 ? b.recover / 18 : 0;                                    // bastonu yere vurdu
    const talk = b.talk > 0 ? Math.abs(Math.sin(b.anim * 0.45)) : 0;   // konuşma
    const angry = slam > 0 || toss > 0 || talk > 0.3;
    const walk = Math.sin(b.run);
    ctx.save();
    bossBaseTransform(ctx, b);
    ctx.scale(b.look, 1);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const hunch = 16, hipY = -H * 0.38, shY = -H * 0.66 + hit * 8;

    // Bacaklar (pantolon) ve ayakkabılar
    [-1, 1].forEach(k => {
        const fx = k * 12 + walk * k * 14, kx = k * 10 + walk * k * 8 + 8, ky = hipY * 0.5;
        ctx.strokeStyle = k < 0 ? "#1f2430" : "#2a303c"; ctx.lineWidth = 24;
        ctx.beginPath(); ctx.moveTo(k * 12, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, -12); ctx.stroke();
        ctx.fillStyle = "#0b0b0b";
        ctx.beginPath(); ctx.ellipse(fx + 9, -7, 21, 9, 0, 0, Math.PI * 2); ctx.fill();
    });

    // Para atan kol (arkada)
    const backArm = () => {
        const sx = hunch - 22, sy = shY + 12;
        const a = 0.15 - toss * 2.4;                           // negatif: geriye/yukarı
        const ex = sx + Math.sin(a) * 52, ey = sy + Math.cos(a) * 52;
        const a2 = a + 0.4 * (1 - toss);
        const hx = ex + Math.sin(a2) * 48, hy = ey + Math.cos(a2) * 48;
        ctx.strokeStyle = "#2b2f36"; ctx.lineWidth = 22;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.fillStyle = "#e8c4a0"; ctx.beginPath(); ctx.arc(hx, hy, 10, 0, Math.PI * 2); ctx.fill();
        if (toss > 0.25) for (let i = 0; i < 3; i++) drawOneDollar(ctx, hx + i * 4, hy - 8 - i * 5, -0.4 + i * 0.3);
    };
    backArm();

    // Palto: omuzlardan dizlere, kambur
    ctx.fillStyle = "#3b3f46";
    ctx.beginPath();
    ctx.moveTo(hunch - 36, shY);
    ctx.quadraticCurveTo(hunch, shY - 16, hunch + 38, shY + 2);
    ctx.lineTo(48, hipY * 0.42);
    ctx.lineTo(-42, hipY * 0.42);
    ctx.quadraticCurveTo(-46, (shY + hipY) / 2, hunch - 36, shY);
    ctx.closePath(); ctx.fill();
    // Gömlek, kravat, yakalar, düğmeler
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath(); ctx.moveTo(hunch + 2, shY - 2); ctx.lineTo(hunch + 30, shY + 2); ctx.lineTo(hunch + 18, shY + 52); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath(); ctx.moveTo(hunch + 14, shY + 4); ctx.lineTo(hunch + 21, shY + 4); ctx.lineTo(hunch + 22, shY + 40); ctx.lineTo(hunch + 17, shY + 48); ctx.lineTo(hunch + 13, shY + 40); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#4b5563";
    ctx.beginPath(); ctx.moveTo(hunch + 2, shY - 4); ctx.lineTo(hunch + 14, shY + 56); ctx.lineTo(hunch - 6, shY + 20); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(hunch + 32, shY); ctx.lineTo(hunch + 20, shY + 56); ctx.lineTo(hunch + 40, shY + 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#111827";
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(hunch + 16 - i * 6, shY + 70 + i * 22, 3.5, 0, Math.PI * 2); ctx.fill(); }

    // Boyun + kafa: önden bakan, simetrik yaşlı adam yüzü
    const hx = hunch + 22, hy = shY - 44;
    ctx.fillStyle = "#d9ae86"; ctx.fillRect(hx - 13, hy + 30, 26, 20);
    ctx.save();
    ctx.translate(hx, hy);
    const SKIN = "#e8c4a0", LINE = "#b08968";
    // Kulaklar
    [-1, 1].forEach(s => {
        ctx.fillStyle = SKIN; ctx.beginPath(); ctx.ellipse(s * 38, 4, 8, 14, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = LINE; ctx.lineWidth = 2; ctx.beginPath(); ctx.ellipse(s * 38, 4, 4, 8, 0, 0, Math.PI * 2); ctx.stroke();
    });
    // Kafa (dazlak) ve parlaması
    ctx.fillStyle = SKIN; ctx.beginPath(); ctx.ellipse(0, 0, 36, 46, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.beginPath(); ctx.ellipse(-8, -32, 13, 6, -0.3, 0, Math.PI * 2); ctx.fill();
    // Kulakların üstünde beyaz saçlar
    ctx.fillStyle = "#e5e7eb";
    [-1, 1].forEach(s => [[34, -16, 8], [38, -5, 8], [36, 8, 6]].forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(s * x, y, r, 0, Math.PI * 2); ctx.fill(); }));
    // Alın kırışıkları
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.moveTo(-16, -30 + i * 6); ctx.quadraticCurveTo(0, -34 + i * 6, 16, -30 + i * 6); ctx.stroke(); }
    // Gür beyaz kaşlar: normalde dış uçları sarkık, kızınca iç uçları çatılır
    [-1, 1].forEach(s => {
        ctx.save(); ctx.translate(s * 15, -13); ctx.rotate(s * (angry ? 0.3 : -0.15));
        ctx.fillStyle = "#f3f4f6"; ctx.strokeStyle = "#9ca3af"; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.ellipse(0, 0, 12, 4.5, 0, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.strokeStyle = "#d1d5db";
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(k * 4, -2); ctx.lineTo(k * 4 + s * 2, -7); ctx.stroke(); }
        ctx.restore();
    });
    // Gözler: göz kapakları sarkık, altında torbalar; bakış oyuncuya
    [-1, 1].forEach(s => {
        const x = s * 15, y = -2;
        ctx.fillStyle = "#fff"; ctx.beginPath(); ctx.ellipse(x, y, 6.5, 4.2, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1c1917"; ctx.beginPath(); ctx.arc(x + 1.5, y + 0.5, 2.7, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#d9ae86"; ctx.fillRect(x - 7, y - 5, 14, angry ? 1.5 : 3.5);
        ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
        ctx.beginPath(); ctx.arc(x, y + 4, 6, 0.35, Math.PI - 0.35); ctx.stroke();
    });
    // Burun: yüzün ortasında, iri
    ctx.fillStyle = "#e0b48f"; ctx.strokeStyle = "#a47552"; ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(-4, 0); ctx.quadraticCurveTo(-10, 13, -8, 17); ctx.quadraticCurveTo(0, 22, 8, 17); ctx.quadraticCurveTo(10, 13, 4, 0);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#8a5a3c";
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(s * 4, 17.5, 2.2, 1.4, 0, 0, Math.PI * 2); ctx.fill(); });
    // Yanak çizgileri (yaşlılık) ve ağız
    ctx.strokeStyle = LINE; ctx.lineWidth = 2;
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.moveTo(s * 11, 16); ctx.quadraticCurveTo(s * 17, 28, s * 14, 40); ctx.stroke(); });
    if (angry) {
        ctx.fillStyle = "#4a1d0f";
        ctx.beginPath(); ctx.ellipse(0, 30, 9, 3 + Math.max(slam, toss, talk) * 7, 0, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.strokeStyle = "#8a5a3c"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-10, 32); ctx.quadraticCurveTo(0, 27, 10, 32); ctx.stroke();
    }
    ctx.strokeStyle = LINE; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(0, 44, 7, 0.4, Math.PI - 0.4); ctx.stroke();   // çene kıvrımı
    ctx.restore();

    // Bastonlu kol (önde): baston normalde yere dayalı, saldırıda havaya kalkar, sonra yere iner
    const sx = hunch + 30, sy = shY + 14;
    const a = 0.55 + slam * 2.4;
    const ex = sx + Math.sin(a) * 50, ey = sy + Math.cos(a) * 50;
    const a2 = a - 0.25;
    const hx2 = ex + Math.sin(a2) * 46, hy2 = ey + Math.cos(a2) * 46;
    ctx.strokeStyle = "#353a42"; ctx.lineWidth = 22;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx2, hy2); ctx.stroke();
    const ca = slam > 0 ? a2 * slam + 0.05 * (1 - slam) : 0.05;      // bastonun açısı (0: dik aşağı)
    const caneLen = slam > 0 ? 100 : -hy2 - 2;
    const tx = hx2 + Math.sin(ca) * caneLen, ty = hy2 + Math.cos(ca) * caneLen;
    ctx.strokeStyle = "#6b3f1d"; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(hx2, hy2); ctx.lineTo(tx, ty); ctx.stroke();
    ctx.beginPath(); ctx.arc(hx2 - 10 * Math.cos(ca), hy2 + 10 * Math.sin(ca) - 2, 10, Math.PI, 0); ctx.stroke();  // sap
    ctx.fillStyle = "#e8c4a0"; ctx.beginPath(); ctx.arc(hx2, hy2, 10, 0, Math.PI * 2); ctx.fill();
    if (hit > 0) {                                                     // yere vuruş: çatlak ve toz
        ctx.strokeStyle = `rgba(253,224,71,${hit})`; ctx.lineWidth = 3;
        for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx + k * 16, ty - 10 - Math.abs(k) * 4); ctx.stroke(); }
    }
    ctx.restore();
}


function draw() {
    ctx.clearRect(0,0,width,height);
    drawBackground();
    ctx.save();
    ctx.translate(-camX, 0);

    platforms.forEach(p => drawPlatform(ctx, p));
    if(gate) drawGate(ctx, gate);

    items.forEach(it => { if(!it.collected) drawKulHakkiBag(ctx, it.x, it.y, 80); });
    enemies.forEach(en => {
        if(en.dead && en.deathT >= DEATH_FRAMES) return;
        ctx.save();
        if(en.dead) applyDeathPose(ctx, en);
        drawPolice(ctx, en);
        ctx.restore();
    });
    if(boss) drawBoss(ctx, boss);
    grannies.forEach(g => drawGranny(ctx, g));

    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.globalAlpha = player.opacity * (player.invuln > 0 && Math.floor(player.invuln / 5) % 2 ? 0.3 : 1);
    if(player.isDying) ctx.rotate(player.deathAngle);
    if(player.dir === -1 && !player.isDying) ctx.scale(-1, 1);

    const playerMoving = player.grounded && Math.abs(player.vx) > 1;
    ctx.translate(0, player.h / 2);   // çizim orijini: ayakların ortası
    drawRecep(ctx, { h: player.h, phase: player.legCycle, moving: playerMoving, airborne: !player.grounded,
                     mouthOpen: player.mouthOpen, hammerAngle: hammerAngle(), shield: player.shield,
                     dir: player.dir === -1 && !player.isDying ? -1 : 1 });
    ctx.restore();

    playerProjectiles.forEach(p => {
        drawDollarBill(ctx, p.x, p.y, 20, p.angle);
    });
    
    projectiles.forEach(p => {
        if(p.type === 'fire') drawFire(ctx, p);
        else if(p.type === 'wave') drawWave(ctx, p);
        else if(p.type === 'dollar1') drawOneDollar(ctx, p.x, p.y, p.angle);
        else if(p.type === 'bullet') drawBullet(ctx, p);
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life / (p.maxLife || 1);
        if(p.text) {
            ctx.fillStyle = p.color;
            ctx.font = "bold 40px Arial";
            ctx.textAlign = "center";
            ctx.lineWidth = 5; ctx.strokeStyle = "rgba(0,0,0,0.6)";   // açık gökyüzünde de okunsun
            ctx.strokeText(p.text, p.x, p.y);
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    });

    ctx.restore();
    ctx.globalAlpha = 1;
    if(boss && !boss.dying) drawBossBar(ctx, boss);
    drawGateHint(ctx);
    if(userPaused) {
        ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 0, width, height);
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillStyle = "#fbbf24"; ctx.font = "bold 56px Arial"; ctx.fillText(t("pausedTitle"), width / 2, height / 2 - 20);
        ctx.fillStyle = "#fff"; ctx.font = "20px Arial"; ctx.fillText(t("pausedHint"), width / 2, height / 2 + 30);
        ctx.textBaseline = "alphabetic";
    }
    if(screenFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${screenFlash})`; ctx.fillRect(0, 0, width, height); }
}

// Sabit adımlı döngü: oyun mantığı her ekranda saniyede 60 kez çalışır
// (120 Hz ekranlarda oyun hızlanmaz, 30 Hz'de yavaşlamaz)
const STEP = 1000 / 60;
let lastTime = null, accumulator = 0;
function loop(now) {
    if(lastTime === null) lastTime = now;
    // Sekme arka plandayken biriken süreyi sınırla (geri dönünce ışınlanma olmasın)
    accumulator += Math.min(now - lastTime, 250);
    lastTime = now;
    while(accumulator >= STEP) { update(); accumulator -= STEP; }
    draw();
    requestAnimationFrame(loop);
}

// --- DURAKLATMA ---
function setUserPause(on) {
    if(!gameStarted || paused || levelCompleted) on = false;   // bölüm sonu ekranındayken duraklatma yok
    if(userPaused === on) return;
    userPaused = on;
    keys.a = keys.d = keys.s = false; shieldHeld = false;
    const m = $('bg-music');
    if(on) m.pause(); else m.play().catch(()=>{});
    $('pause-btn').textContent = on ? '▶' : '⏸';
}
$('pause-btn').addEventListener('click', () => setUserPause(!userPaused));
// Başka sekmeye geçince oyun kendiliğinden durur
document.addEventListener('visibilitychange', () => { if(document.hidden) setUserPause(true); });

window.onkeydown = e => {
    let k = e.key.toLowerCase();
    if(e.key === 'Escape' || k === 'p') { setUserPause(!userPaused); return; }
    if(userPaused) return;
    if(k==='a') keys.a=true; if(k==='d') keys.d=true; if(k==='s' || e.key==='ArrowDown') keys.s=true;
    if(e.key===' ') jump(); if(e.key==='Enter') shoot(); if(k==='f' && !e.repeat) hammer(); 
};
window.onkeyup = e => { 
    let k = e.key.toLowerCase();
    if(k==='a') keys.a=false; if(k==='d') keys.d=false; if(k==='s' || e.key==='ArrowDown') keys.s=false;
};

// --- AÇILIŞ SAHNESİ (kodla çizilir; YouTube'a ya da video dosyasına bağlanmaz) ---
// Ankara'da alacakaranlık: tepede ışıl ışıl Kaçak Saray, kul hakkı torbaları saraya uçar, gökten dolar yağar.
// Önde balyozlu, kalkanlı Recep yürür, peşinde 17/25 polisleri; ters yönden polisler ve bastonlu FETÖ geçer.
// Tarayıcılar sesli otomatik oynatmaya izin vermez: müzik açılış ekranına ilk dokunuşta ya da SESİ AÇ ile başlar.
const introCanvas = $('intro-canvas'), ictx = introCanvas.getContext('2d');
let introW = 0, introH = 0, introRAF = null, introSky = null;
const introT0 = performance.now();

function resizeIntro() {
    const dpr = window.devicePixelRatio || 1;
    introW = window.innerWidth; introH = window.innerHeight;
    introCanvas.width = Math.round(introW * dpr); introCanvas.height = Math.round(introH * dpr);
    ictx.setTransform(dpr, 0, 0, dpr, 0, 0);
    introSky = null;
}

function drawTurkishFlag(c, x, y, s, time) {
    c.strokeStyle = "#e5e7eb"; c.lineWidth = 2.5 * s;
    c.beginPath(); c.moveTo(x, y); c.lineTo(x, y - 70 * s); c.stroke();
    const fw = 46 * s, fh = 30 * s, top = y - 70 * s, wave = i => Math.sin(time * 4 - i * 0.35) * 3 * s * (i / 10);
    c.fillStyle = "#e30a17";
    c.beginPath(); c.moveTo(x, top);
    for (let i = 0; i <= 10; i++) c.lineTo(x + fw * i / 10, top + wave(i));
    for (let i = 10; i >= 0; i--) c.lineTo(x + fw * i / 10, top + fh + wave(i));
    c.closePath(); c.fill();
    const mx = x + fw * 0.36, my = top + fh / 2 + wave(4);
    c.fillStyle = "#fff"; c.beginPath(); c.arc(mx, my, fh * 0.25, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#e30a17"; c.beginPath(); c.arc(mx + fh * 0.07, my, fh * 0.2, 0, Math.PI * 2); c.fill();
    c.fillStyle = "#fff"; c.beginPath();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? fh * 0.05 : fh * 0.12, a = i * Math.PI / 5; c.lineTo(mx + fh * 0.3 + Math.cos(a) * r, my + Math.sin(a) * r); }
    c.closePath(); c.fill();
}

// Kaçak Saray (Beştepe): uzun kanatlar, sütunlu bloklar, ortada sivri kemerli büyük giriş, bayraklar
function drawPalace(c, cx, by, s, time) {
    const stone = "#efe4cc", shade = "#cdbb96", gap = "#5b4636";
    const glow = c.createRadialGradient(cx, by - 90 * s, 20 * s, cx, by - 90 * s, 560 * s);
    glow.addColorStop(0, "rgba(253,186,116,0.4)"); glow.addColorStop(1, "rgba(253,186,116,0)");
    c.fillStyle = glow; c.fillRect(cx - 560 * s, by - 650 * s, 1120 * s, 760 * s);
    const lit = (i, j) => hash(i * 13.7 + j * 3.1) > 0.35 + 0.15 * Math.sin(time * 0.5 + i);

    // Yan kanatlar: iki katlı, sıra sıra pencereler
    [-1, 1].forEach(side => {
        const w = 400 * s, left = side < 0 ? cx - 130 * s - w : cx + 130 * s;
        c.fillStyle = stone; c.fillRect(left, by - 84 * s, w, 64 * s);
        c.fillStyle = shade; c.fillRect(left - 4 * s, by - 92 * s, w + 8 * s, 8 * s);
        for (let r = 0; r < 2; r++)
            for (let k = 0; k < 17; k++) {
                c.fillStyle = lit(k * side, r) ? "rgba(253,224,71,0.9)" : "#6b5a48";
                c.fillRect(left + 10 * s + k * 23 * s, by - 74 * s + r * 26 * s, 11 * s, 16 * s);
            }
    });
    // Sütunlu orta bloklar
    [-1, 1].forEach(side => {
        const w = 180 * s, left = side < 0 ? cx - 250 * s : cx + 70 * s;
        c.fillStyle = gap; c.fillRect(left, by - 160 * s, w, 140 * s);
        c.fillStyle = "rgba(253,224,71,0.45)"; c.fillRect(left, by - 150 * s, w, 128 * s);
        c.fillStyle = stone;
        for (let k = 0; k <= 9; k++) c.fillRect(left + k * 20 * s - 3 * s, by - 160 * s, 10 * s, 140 * s);
        c.fillStyle = shade; c.fillRect(left - 6 * s, by - 172 * s, w + 12 * s, 14 * s);
        c.fillStyle = stone; c.fillRect(left - 6 * s, by - 176 * s, w + 12 * s, 5 * s);
    });
    // Orta giriş bloğu: en yüksek, sivri kemerli altın giriş
    c.fillStyle = stone; c.fillRect(cx - 72 * s, by - 236 * s, 144 * s, 216 * s);
    c.fillStyle = shade; c.fillRect(cx - 80 * s, by - 248 * s, 160 * s, 14 * s);
    const arch = c.createLinearGradient(0, by - 210 * s, 0, by - 20 * s);
    arch.addColorStop(0, "#fde68a"); arch.addColorStop(0.5, "#d97706"); arch.addColorStop(1, "#78350f");
    c.fillStyle = arch;
    c.beginPath();
    c.moveTo(cx - 44 * s, by - 20 * s); c.lineTo(cx - 44 * s, by - 150 * s);
    c.quadraticCurveTo(cx - 44 * s, by - 192 * s, cx, by - 212 * s);
    c.quadraticCurveTo(cx + 44 * s, by - 192 * s, cx + 44 * s, by - 150 * s);
    c.lineTo(cx + 44 * s, by - 20 * s); c.closePath(); c.fill();
    c.strokeStyle = "rgba(120,53,15,0.6)"; c.lineWidth = 1.5 * s;      // mukarnas süslemesi
    for (let r = 0; r < 4; r++)
        for (let k = -2 + (r % 2) * 0.5; k <= 2; k++) { c.beginPath(); c.arc(cx + k * 16 * s, by - 168 * s + r * 12 * s, 7 * s, Math.PI, 0); c.stroke(); }
    c.fillStyle = "#1c1208"; c.fillRect(cx - 20 * s, by - 80 * s, 40 * s, 60 * s);   // kapı
    c.fillStyle = "rgba(253,224,71,0.8)"; c.fillRect(cx - 16 * s, by - 76 * s, 32 * s, 56 * s);
    // Teras, merdivenler, isim tabelası
    c.fillStyle = shade; c.fillRect(cx - 560 * s, by - 20 * s, 1120 * s, 10 * s);
    c.fillStyle = stone;
    for (let k = 0; k < 4; k++) c.fillRect(cx - (60 + k * 16) * s, by - 10 * s + k * 6 * s, (120 + k * 32) * s, 6 * s);
    c.font = `bold ${Math.max(10, 16 * s)}px Arial`; c.textAlign = "center"; c.textBaseline = "middle";
    c.fillStyle = "#fde68a"; c.fillText("KAÇAK SARAY", cx, by + 30 * s);
    // Bayraklar
    drawTurkishFlag(c, cx, by - 248 * s, s, time);
    drawTurkishFlag(c, cx - 250 * s, by - 176 * s, s * 0.8, time + 1);
    drawTurkishFlag(c, cx + 250 * s, by - 176 * s, s * 0.8, time + 2);
}

function drawIntro(now) {
    const c = ictx, W = introW, H = introH, time = (now - introT0) / 1000;
    if (!introSky) {
        introSky = c.createLinearGradient(0, 0, 0, H);
        [["#0b1026", 0], ["#3b1d6e", 0.4], ["#9d1d5a", 0.62], ["#f97316", 0.8]].forEach(([col, p]) => introSky.addColorStop(p, col));
    }
    c.fillStyle = introSky; c.fillRect(0, 0, W, H);
    c.fillStyle = "#fff";                                               // yıldızlar
    for (let i = 0; i < 90; i++) {
        c.globalAlpha = 0.3 + 0.7 * (0.5 + 0.5 * Math.sin(time * (1 + hash(i) * 2) + i));
        c.fillRect(hash(i + 0.3) * W, hash(i + 0.7) * H * 0.45, 1.6, 1.6);
    }
    c.globalAlpha = 1;
    const mx = W * 0.14, my = H * 0.16, mr = Math.min(W, H) * 0.05;     // hilal
    c.fillStyle = "#fef3c7"; c.beginPath(); c.arc(mx, my, mr, 0, Math.PI * 2); c.fill();
    c.fillStyle = introSky; c.beginPath(); c.arc(mx + mr * 0.35, my - mr * 0.1, mr * 0.85, 0, Math.PI * 2); c.fill();

    // Uzak Ankara tepeleri ve şehir ışıkları
    const hillY = x => H * 0.6 - 40 * (1 + ridge(x * 1.6, 3.3));
    c.fillStyle = "#24163a"; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) c.lineTo(x, hillY(x));
    c.lineTo(W, H); c.closePath(); c.fill();
    for (let i = 0; i < 160; i++) {
        const x = hash(i * 2.3) * W, y = hillY(x) + 6 + hash(i * 5.1) * H * 0.12;
        c.fillStyle = hash(i) > 0.5 ? "rgba(253,224,71,0.8)" : "rgba(255,237,213,0.6)";
        c.fillRect(x, y, 2, 2);
    }
    // Beştepe ve saray
    const s = Math.min(W / 1250, H / 720), px = W * 0.5, py = H * 0.66;
    c.fillStyle = "#1a1030";
    c.beginPath(); c.moveTo(px - 700 * s, H); c.quadraticCurveTo(px - 520 * s, py - 30 * s, px, py - 24 * s); c.quadraticCurveTo(px + 520 * s, py - 30 * s, px + 700 * s, H); c.closePath(); c.fill();
    drawPalace(c, px, py, s, time);

    // Gökten dolar yağar
    c.globalAlpha = 0.85;
    for (let i = 0; i < 14; i++) {
        const sp = 35 + hash(i + 1.1) * 45, y = ((time * sp + hash(i + 2.2) * H) % (H * 0.95)) - 30;
        drawDollarBill(c, hash(i + 3.3) * W + Math.sin(time + i) * 20, y, 12 + hash(i) * 8, Math.sin(time * 2 + i));
    }
    c.globalAlpha = 1;

    // Ön plan: yol
    const gy = H * 0.94, cs = H / 950;
    c.fillStyle = "#1f1a24"; c.fillRect(0, gy, W, H - gy);
    c.fillStyle = "#3f3a46"; c.fillRect(0, gy, W, 5);

    // Kul hakkı torbaları yoldan saraya uçar
    for (let i = 0; i < 6; i++) {
        const k = ((time / 3.6 + i / 6) % 1);
        const sx = hash(i * 7.7 + Math.floor(time / 3.6 + i / 6)) * W, sy = gy - 30;
        const ex = px, ey = py - 50 * s, cx = (sx + ex) / 2, cy = py - 330 * s;
        const x = (1 - k) * (1 - k) * sx + 2 * (1 - k) * k * cx + k * k * ex;
        const y = (1 - k) * (1 - k) * sy + 2 * (1 - k) * k * cy + k * k * ey;
        c.globalAlpha = k > 0.9 ? (1 - k) * 10 : 1;
        drawKulHakkiBag(c, x, y, (46 - 32 * k) * cs * 1.3, Math.sin(time * 3 + i) * 0.4);
    }
    c.globalAlpha = 1;

    // Yürüyen karakterler (birimler: zemin y=0, ölçek cs)
    c.save(); c.translate(0, gy); c.scale(cs, cs);
    const span = W / cs + 900, pos = (sp, off) => ((time * sp + off) % span + span) % span - 450;
    const rx = pos(130, 950);   // sayfa açılınca Recep ve polisler ekranda başlasın
    c.save(); c.translate(rx, 0);
    drawRecep(c, { h: 180, phase: rx * 0.06, moving: true, airborne: false, mouthOpen: 0, hammerAngle: HAMMER_IDLE, shield: false, dir: 1 });
    c.restore();
    [[rx - 280, 1.7], [rx - 450, 0.4]].forEach(([x, ph]) =>
        drawPolice(c, { x: x - 60, y: -200, w: 120, h: 200, dir: 1, walkCycle: x * 0.05 + ph, lastSpeed: 1 }));
    [[700, 0], [1050, 2]].forEach(([off, ph]) => {
        const x = span - 900 - pos(70, off);
        drawPolice(c, { x: x - 60, y: -200, w: 120, h: 200, dir: -1, walkCycle: time * 4 + ph, lastSpeed: 1 });
    });
    const fx = span - 900 - pos(45, 1500);
    const FT = BOSS_TYPES.feto;
    drawFeto(c, { T: FT, x: fx - FT.w / 2, y: -FT.h, w: FT.w, h: FT.h, look: -1, run: fx * 0.03, state: 'walk', stateT: 0, recover: 0, hurt: 0, dying: false, deathT: 0 });
    c.restore();
}

function introLoop(now) {
    drawIntro(now);
    introRAF = requestAnimationFrame(introLoop);
}
resizeIntro();
window.addEventListener('resize', () => { if (introRAF) resizeIntro(); });
introRAF = requestAnimationFrame(introLoop);

function updateSoundBtn() {
    const b = document.getElementById('sound-btn');
    if (b) b.textContent = t(b.dataset.on ? 'soundOff' : 'soundOn');
}
function setIntroSound(on) {
    const b = $('sound-btn');
    if (!b) return;
    b.dataset.on = on ? '1' : '';
    updateSoundBtn();
    const m = $('intro-music');
    m.volume = 0.35;
    if (on) m.play().catch(() => {}); else m.pause();
}
function removeIntro() {
    if (introRAF) cancelAnimationFrame(introRAF);
    introRAF = null;
    $('intro-music').pause();
    ['intro-video', 'sound-btn'].forEach(id => { const el = $(id); if (el) el.remove(); });
}
$('sound-btn').addEventListener('click', () => setIntroSound(!$('sound-btn').dataset.on));
$('overlay-screen').addEventListener('pointerdown', e => {
    const b = $('sound-btn');
    if (!b || b.dataset.touched || e.target === b) return;
    b.dataset.touched = '1';
    setIntroSound(true);
});

$('start-button').onclick = () => {
    initAudio();   // tarayıcılar sesi ancak bir tıklamayla başlatmaya izin verir
    removeIntro();
    $('overlay-screen').style.display = 'none';
    gameStarted = true;
    $('pause-btn').style.display = 'block';
    resizeCanvas();
    createLevel();
    requestAnimationFrame(loop);
    const bgMusic = $('bg-music');
    bgMusic.volume = 0.1; bgMusic.play().catch(()=>{});
};

// --- JOYSTICK ---
let joyDir = 0, joyPointer = null;
const joyWrap = $('joystick-wrapper'), joyStick = $('joystick-stick');
const JOY_MAX = 35, JOY_DEADZONE = 10;

function joyMove(e) {
    const r = joyWrap.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_MAX) { dx = dx / dist * JOY_MAX; dy = dy / dist * JOY_MAX; }
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyDir = Math.abs(dx) < JOY_DEADZONE ? 0 : Math.sign(dx);
}
function joyEnd(e) {
    if (e.pointerId !== joyPointer) return;
    joyPointer = null; joyDir = 0;
    joyStick.style.transform = '';
}
joyWrap.addEventListener('pointerdown', e => {
    e.preventDefault();
    joyPointer = e.pointerId;
    joyWrap.setPointerCapture(e.pointerId);
    joyMove(e);
});
joyWrap.addEventListener('pointermove', e => { if (e.pointerId === joyPointer) joyMove(e); });
joyWrap.addEventListener('pointerup', joyEnd);
joyWrap.addEventListener('pointercancel', joyEnd);

$('jump-btn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('shoot-btn').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); });
$('hammer-btn').addEventListener('pointerdown', e => { e.preventDefault(); hammer(); });
// Kalkan: buton basılı tutulduğu sürece kalkık kalır
$('shield-btn').addEventListener('pointerdown', e => { e.preventDefault(); shieldHeld = true; $('shield-btn').setPointerCapture(e.pointerId); });
['pointerup', 'pointercancel'].forEach(ev => $('shield-btn').addEventListener(ev, () => { shieldHeld = false; }));
// Canvas'ı ekranın gerçek piksel yoğunluğuna göre boyutlandır (Retina/telefonlarda net görüntü).
// Oyun kodu CSS pikseliyle çalışmaya devam eder; ölçekleme setTransform ile yapılır.
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.onresize = () => {
    const oldHeight = height;
    resizeCanvas();
    if(!gameStarted || oldHeight === undefined) return;
    // Dünya ekranın altına hizalı; yükseklik değişince her şeyi aynı miktarda kaydır
    const dy = height - oldHeight;
    if(dy === 0) return;
    [platforms, items, enemies, projectiles, playerProjectiles, particles].forEach(list => list.forEach(o => o.y += dy));
    player.y += dy;
    if(boss) boss.y += dy;
};
