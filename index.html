        :root { --bg: #064e3b; --gold: #fbbf24; --dollar: #22c55e; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        canvas { 
            display: block; 
            background: linear-gradient(to bottom, #143611, #064e3b); 
            z-index: 1; 
        }
        
        .ui { position: absolute; pointer-events: none; z-index: 20; color: white; }
        #status { top: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #level-display { top: 20px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; color: var(--gold); }
        #kill-count { top: 60px; left: 20px; font-size: 18px; color: #ff4d4d; font-weight: bold; }
        
        #ui-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
        #joystick-wrapper { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        #joystick-stick { width: 50px; height: 50px; background: var(--gold); border-radius: 50%; }
        
        .action-buttons { position: absolute; bottom: 50px; right: 50px; display: flex; gap: 20px; pointer-events: auto; }
        .btn { width: 100px; height: 100px; background: rgba(251,191,36,0.6); border: 4px solid var(--gold); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; color: white; text-shadow: 1px 1px 2px black; }
        .shoot-btn { background: rgba(34,197,94,0.6); border-color: #22c55e; }
        /* Dokunmatik cihazlarda klavye ipuçlarını gizle */
        @media (hover: none) and (pointer: coarse) { .key-hint { display: none; } }
        
        #overlay-screen { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            text-align: center; 
            color: white; 
        }
        #overlay-screen h1 { font-size: clamp(36px, 9vw, 80px); padding: 0 16px; margin: 0; color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,0.8); }
        .story-note { background: rgba(251,191,36,0.1); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 10px; font-style: italic; margin: 20px 0; max-width: 80%; font-size: 20px; color: #fbbf24; }
        .primary-btn { background: var(--gold); border: none; padding: 20px 60px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; pointer-events: auto; color: #000; transition: transform 0.2s; }
        #lang-picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .lang-btn { background: transparent; color: var(--gold); border: 2px solid var(--gold); border-radius: 8px; padding: 8px 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--gold); color: #000; }
        .shake { animation: shake 0.5s both; }
        @keyframes shake { 10%, 90% { transform: translate3d(-2px,0,0); } 30%, 70% { transform: translate3d(-8px,0,0); } 50% { transform: translate3d(8px,0,0); } }
    </style>
</head>

function detectLang() {
    try { const saved = localStorage.getItem('lang'); if (LANGS[saved]) return saved; } catch (e) {}
    const nav = (navigator.language || 'tr').slice(0, 2).toLowerCase();
    return LANGS[nav] ? nav : 'tr';
}
let lang = detectLang();
const t = key => LANGS[lang][key];

function applyLang(newLang) {
    lang = newLang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
}
document.querySelectorAll('.lang-btn').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

// Dosya bilgisayardan (file://) açıldığında tarayıcı piksel okumaya izin vermeyebilir: o zaman resmin tamamı kullanılır.
function opaqueBounds(img) {
    const full = { sx: 0, sy: 0, sw: img.naturalWidth, sh: img.naturalHeight };
    try {
        const c = document.createElement('canvas');
        c.width = full.sw; c.height = full.sh;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height).data;
        let top = -1, bot = -1, left = c.width, right = -1;
        for (let y = 0; y < c.height; y++) {
            for (let X = 0; X < c.width; X++) {
                if (d[(y * c.width + X) * 4 + 3] > 40) {
                    if (top < 0) top = y;
                    bot = y;
                    if (X < left) left = X;
                    if (X > right) right = X;
                }
            }
        }
        return top < 0 ? full : { sx: left, sy: top, sw: right - left + 1, sh: bot - top + 1 };
    } catch (e) {
        return full;
    }
}
let enemyCrop = null;

// TTS exponential backoff implementation
// Aynı anda tek konuşma; geç gelen ses anlamsız olacağı için en fazla 1 kısa tekrar
let speaking = false;
async function speak(text, voice = "Kore") {
    if (!apiKey || speaking) return;
    speaking = true;
    try {
        for (let attempt = 0; attempt < 2; attempt++) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                })
            });
            if (response.ok) {
                const result = await response.json();
                const pcmData = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (pcmData) {
                    const url = URL.createObjectURL(pcmToWav(pcmData, 24000));
                    const audio = new Audio(url);
                    audio.onended = () => URL.revokeObjectURL(url);
                    audio.play().catch(() => {});
                }
                return;
            }
            // Sadece geçici hatalarda (çok istek / sunucu) tekrar dene
            if (response.status !== 429 && response.status < 500) return;
            await new Promise(res => setTimeout(res, 1000));
        }
    } catch (e) {
        // Ağ hatası: sessizce geç
    } finally {
        speaking = false;
    }
}

function pcmToWav(b64, rate) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const head = new ArrayBuffer(44), v = new DataView(head);
    v.setUint32(0, 0x52494646, false); v.setUint32(4, 36+bin.length, true); v.setUint32(8, 0x57415645, false);
    v.setUint32(12, 0x666d7420, false); v.setUint16(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate*2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); v.setUint32(36, 0x64617461, false); v.setUint32(40, bin.length, true);
    return new Blob([head, bytes], { type: 'audio/wav' });
}

function drawKulHakkiBag(ctx, x, y, size, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#d4b483"; 
    ctx.beginPath();
    ctx.moveTo(-size/2, size/2);
    ctx.quadraticCurveTo(-size/1.5, -size/2, 0, -size/1.8);
    ctx.quadraticCurveTo(size/1.5, -size/2, size/2, size/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#c2a373";
    ctx.fillRect(-size/6, -size/1.6, size/3, size/10);
    ctx.fillStyle = "#4a2c00";
    ctx.font = `bold ${size/6}px Arial`;
    ctx.textAlign = "center";
    ctx.fillText(t("bag")[0], 0, -5, size * 0.8);
    ctx.fillText(t("bag")[1], 0, 10, size * 0.8);
    ctx.strokeStyle = "rgba(0,0,0,0.3)";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.restore();
}

function drawLuxuryHandbag(ctx, x, y, size, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    
    // Çanta gövdesi
    ctx.fillStyle = "#3d0a0a"; 
    ctx.beginPath();
    ctx.roundRect(-size/2, -size/3, size, size*0.8, 5);
    ctx.fill();
    
    // Altın detay
    ctx.fillStyle = "#fbbf24";
    ctx.beginPath();
    ctx.arc(0, 0, size/6, 0, Math.PI * 2);
    ctx.fill();
    
    // Sap
    ctx.strokeStyle = "#2d0707";
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.arc(0, -size/3, size/3, Math.PI, 0);
    ctx.stroke();
    
    ctx.restore();
}

function drawDollarBill(ctx, x, y, size, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#22c55e"; 
    ctx.fillRect(-size, -size/2, size*2, size);
    ctx.strokeStyle = "#14532d";
    ctx.lineWidth = 1;
    ctx.strokeRect(-size, -size/2, size*2, size);
    ctx.fillStyle = "#f0fdf4";
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.6, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#166534";
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 0);
    ctx.restore();
}

function createParticle(x, y, text = null, color = "white", duration = 1.0) {
    particles.push({
        x: x, y: y,
        vx: (Math.random() - 0.5) * 4,
        vy: text ? -2 : -Math.random() * 5,
        life: duration,
        maxLife: duration,
        size: Math.random() * 10 + 5,
        text: text,
        color: color
    });
}

function jump() { 
    if(player.grounded && !player.isDying && !paused && !levelCompleted) { 
        player.vy = player.jumpPower; 
        player.grounded = false; 
    } 
}

function shoot() {
    if(!gameStarted || player.isDying || paused || levelCompleted) return;
    playerProjectiles.push({ 
        x: player.x + (player.dir === 1 ? player.w : 0), 
        y: player.y + player.h / 2, 
        vx: player.dir * 14,
        vy: -5, angle: 0, life: 150, active: true 
    });
}

async function die() {
    // Hedef tamamlandıysa (bitiş ekranı gelmek üzere) artık ölünmez
    if(player.isDying || levelCompleted || killedEnemies >= targetKills) return;
    player.isDying = true;
    $('game-container').classList.add('shake');
    $('sfx-explosion').currentTime = 0; $('sfx-explosion').play().catch(()=>{});
    
    // Emine başarılı vuruş yaptığında GEBER yazısı çıkar
    createParticle(player.x + player.w/2, player.y + player.h/2, t("die"), "red", 2.0);
    
    speak(t("ouch"), "Kore");
    // Sayfayı yenilemek yerine bulunulan bölümü baştan başlat
    setTimeout(restartLevel, 2500);
}

function restartLevel() {
    score = levelStartScore;
    $('score').innerText = score;
    createLevel();
}

function completeLevel() {
    if(levelCompleted) return;
    levelCompleted = true;
    $('lang-picker').hidden = true; // Dil sadece başlangıç ekranında seçilir
    paused = true;
    
    if (currentLevel === 1) {
        $('overlay-title').innerText = t("l1Title");
        $('overlay-note').innerText = t("l1Note");
        $('start-button').innerText = t("l1Btn");
        $('start-button').onclick = () => {
            currentLevel = 2; targetKills = 6;
            $('current-level').innerText = "2"; $('target-kills').innerText = "6";
            $('overlay-screen').style.display = 'none'; paused = false;
            createLevel();
        };
    } else {
        $('overlay-title').innerText = t("winTitle");
        $('overlay-note').innerText = t("winNote");
        $('start-button').innerText = t("winBtn");
        $('start-button').onclick = () => location.reload();
    }
    $('overlay-screen').style.display = 'flex';
}

function createLevel() {
    items = []; enemies = []; projectiles = []; playerProjectiles = []; particles = [];
    killedEnemies = 0; levelCompleted = false;
    levelStartScore = score;
    player.x = 100; player.y = 0; player.vx = 0; player.vy = 0; camX = 0;
    player.isDying = false; player.deathAngle = 0; player.opacity = 1; player.mouthOpen = 0; player.dir = 1;
    $('game-container').classList.remove('shake');
    $('kills').innerText = "0";

    if (currentLevel === 1) {
        platforms = [
            {x: 0, y: height-60, w: 40000, h: 500},
            {x: 600, y: height-180, w: 200, h: 120},
            {x: 1200, y: height-250, w: 300, h: 50}, 
            {x: 1800, y: height-150, w: 150, h: 100},
            {x: 2300, y: height-350, w: 400, h: 50}
        ];
    } else {
        platforms = [
            {x: 0, y: height-60, w: 40000, h: 500},
            {x: 400, y: height-150, w: 150, h: 40},
            {x: 800, y: height-300, w: 150, h: 40},
            {x: 1200, y: height-450, w: 200, h: 40},
            {x: 1600, y: height-300, w: 300, h: 40}
        ];
    }

    for(let i=0; i<40; i++) {
        items.push({ x: 800 + i * 700, y: height - 150 - (Math.random() * 250), collected: false });
    }

    for(let i=0; i<20; i++) {
        const homeX = 1500 + i * 1500;
        enemies.push({
            x: homeX, y: height - 60 - 210, w: 160, h: 210,   // alt kenar zeminde
            timer: 0, interval: 200, dead: false,
            homeX: homeX,                          // Devriye merkezi
            dir: Math.random() < 0.5 ? -1 : 1,     // Yürüme yönü
            speed: currentLevel === 1 ? 1.5 : 2.5, // 2. bölümde daha hızlı
            walkCycle: Math.random() * Math.PI * 2
        });
    }
}

function update() {
    if(!gameStarted || paused) return;

    if(!player.isDying) {
        let moveDir = (keys.a ? -1 : (keys.d ? 1 : joyDir));
        player.vx = moveDir ? moveDir * player.speed : player.vx * 0.85;
        if(moveDir) player.dir = moveDir;
        // Adım hızı yürüme hızına bağlı: ayaklar yerde kaymaz
        if(player.grounded) player.legCycle += Math.abs(player.vx) * 0.06;

        player.vy += GRAVITY; 
        player.x += player.vx;
        player.y += player.vy;

        // Harita sınırları: zeminin dışına çıkılmasın
        player.x = Math.max(0, Math.min(player.x, WORLD_WIDTH - player.w));
        // Bir şekilde aşağı düşülürse öl
        if(player.y > height + 200) die();

        if(player.mouthOpen > 0) player.mouthOpen -= 0.05;

        player.grounded = false;
        for(let p of platforms) {
            if (player.x + player.w * 0.2 < p.x + p.w && player.x + player.w * 0.8 > p.x &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy + 10 && player.vy >= 0) {
                player.y = p.y - player.h; player.vy = 0; player.grounded = true;
            }
        }
    } else {
        player.y += 2; player.deathAngle += 0.05; player.opacity -= 0.01;
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= (1/60); });
    particles = particles.filter(p => p.life > 0);
    camX = player.x - width/2;

    items.forEach(it => {
        if(!it.collected && Math.hypot(player.x + player.w/2 - it.x, player.y + player.h/2 - it.y) < 100) {
            it.collected = true; 
            score += 5000; 
            $('score').innerText = score;
            $('sfx-pickup').currentTime = 0; $('sfx-pickup').play();
            player.mouthOpen = 1.0; 
            speak(t("voices")[Math.floor(Math.random()*t("voices").length)], "Kore");
            createParticle(it.x, it.y, t("pickup"), "#22c55e", 0.8);
        }
    });

    enemies.forEach(en => {
        if(en.dead) return;

        // --- Düşman hareketi ---
        const PATROL_RANGE = 250, CHASE_RANGE = 400, CHASE_DIST = 700;
        const enCenter = en.x + en.w / 2, plCenter = player.x + player.w / 2;
        const distToPlayer = plCenter - enCenter;
        let speed = en.speed;
        if(!player.isDying && Math.abs(distToPlayer) < CHASE_DIST) {
            // Oyuncu yakında: ona doğru yürü (ama bölgesinden fazla uzaklaşma)
            en.dir = Math.sign(distToPlayer) || en.dir;
            speed *= 1.4;
            if(Math.abs(en.x + en.dir * speed - en.homeX) > CHASE_RANGE) speed = 0;
            if(Math.abs(distToPlayer) < 20) speed = 0; // Tam üstündeyken titreme olmasın
        } else {
            // Devriye: bölge sınırına gelince geri dön
            if(en.x - en.homeX > PATROL_RANGE) en.dir = -1;
            else if(en.x - en.homeX < -PATROL_RANGE) en.dir = 1;
        }
        en.x += en.dir * speed;
        en.x = Math.max(0, Math.min(en.x, WORLD_WIDTH - en.w));
        en.walkCycle += speed * 0.08;   // Adım hızı yürüme hızına bağlı
        en.lastSpeed = speed;           // Çizimde "yürüyor mu / duruyor mu" için

        if(Math.abs(en.x - player.x) < 1200 && ++en.timer > en.interval) {
            en.timer = 0;
            // Çantaların menzili (life) kahramanın mermisinin (150) iki katı: 300
            projectiles.push({ 
                x: en.x, 
                y: en.y + 60, 
                vx: (player.x < en.x ? -10 : 10), 
                vy: -12, // Başlangıç yukarı hızı (yer çekimi etkisi için)
                active: true, 
                life: 300, 
                angle: 0 
            });
        }
        if(!player.isDying && player.x + 40 < en.x + en.w - 40 && player.x + player.w - 40 > en.x && player.y + player.h > en.y && player.y < en.y + en.h) {
            if(player.vy > 0 && player.y + player.h < en.y + 60) {
                en.dead = true; 
                player.vy = -18; 
                killedEnemies++;
                // Kahraman Emine'yi öldürürse "aaah" yazısı çıkar
                createParticle(en.x + en.w/2, en.y, t("hit"), "white", 1.0);
                speak(t("enemyCry"), "Aoede");
                $('score').innerText = score += 2000; $('kills').innerText = killedEnemies;
                if(killedEnemies >= targetKills) setTimeout(completeLevel, 500);
            } else die();
        }
    });

    playerProjectiles.forEach(p => {
        p.x += p.vx; p.vy += GRAVITY * 0.4; p.y += p.vy; p.angle += 0.2; p.life--;
        enemies.forEach(en => {
            if(!en.dead && p.active && p.x > en.x && p.x < en.x + en.w && p.y > en.y && p.y < en.y + en.h) {
                en.dead = true; 
                p.active = false; 
                killedEnemies++;
                // Kahraman vuruşla öldürürse "aaah" yazısı çıkar
                createParticle(en.x + en.w/2, en.y, t("hit"), "white", 1.0);
                speak(t("enemyCry"), "Aoede");
                $('score').innerText = score += 2000; $('kills').innerText = killedEnemies;
                if(killedEnemies >= targetKills) setTimeout(completeLevel, 500);
            }
        });
    });
    playerProjectiles = playerProjectiles.filter(p => p.active && p.life > 0);

    projectiles.forEach(p => {
        p.x += p.vx; 
        p.vy += 0.25; // Çantaya eklenen yer çekimi (gravity)
        p.y += p.vy; 
        p.angle += 0.1;
        p.life--;
        if(!player.isDying && p.active && Math.hypot(p.x - (player.x + player.w/2), p.y - (player.h/2 + player.y)) < 80) {
            p.active = false;
            die();
        }
    });
    projectiles = projectiles.filter(p => p.active && p.life > 0);
}

// --- BACAK ANİMASYONU (Recep) ---
// Her bacak iki parçalı: kalça → diz → ayak bileği, ucunda ayakkabı.
// photoW/photoH: fotoğrafın asıl en-boyu (oran korunur); ratio: bacak boyu / kutu yüksekliği
const PLAYER_LEGS = {
    photoW: 100, photoH: 140,
    ratio: 0.27, width: 14, swing: 0.65,          // bacak boyu, kalınlık, adım açısı
    front: "#475569", back: "#334155",            // füme takım pantolon (arka bacak daha koyu)
    shoe: "#111111"
};

// Faza göre bir bacağın açıları: a = uyluk açısı (0 = dik, + = ileri), bend = diz bükümü
function legPose(phase, moving, airborne, swing) {
    if (airborne) return [{ a: 0.75, bend: 1.4 }, { a: -0.3, bend: 0.6 }];  // havada: bacaklar kırık
    if (!moving)  return [{ a: 0.08, bend: 0.06 }, { a: -0.08, bend: 0.06 }]; // ayakta duruş
    return [0, Math.PI].map(off => {
        const p = phase + off;
        // Öne doğru savrulurken (cos > 0) diz bükülür ve ayak yerden kalkar
        return { a: swing * Math.sin(p), bend: 0.12 + 1.1 * Math.max(0, Math.cos(p)) };
    });
}

function legJoints(hipX, hipY, len, leg) {
    const half = len / 2;
    const kx = hipX + Math.sin(leg.a) * half, ky = hipY + Math.cos(leg.a) * half;
    const s = leg.a - leg.bend;  // baldır uyluktan geriye kırılır (diz öne bakar)
    return { kx, ky, fx: kx + Math.sin(s) * half, fy: ky + Math.cos(s) * half, toe: Math.max(-0.5, Math.min(0.4, -s * 0.5)) };
}

function drawLeg(ctx, hipX, hipY, j, width, color, shoe) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(j.kx, j.ky);
    ctx.lineTo(j.fx, j.fy);
    ctx.stroke();
    // Ayakkabı: öne uzanan yuvarlak burun, kalkan ayakta hafif eğik
    ctx.save();
    ctx.translate(j.fx, j.fy);
    ctx.rotate(j.toe);
    ctx.fillStyle = shoe;
    ctx.beginPath();
    ctx.ellipse(width * 0.45, width * 0.2, width * 1.0, width * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Kutunun (top-center = cx, topY; yükseklik h) alt kısmına bacakları çizer.
// Dönüş: { k: fotoğrafın asıl boyutuna göre ölçeği, drop: gövdenin adımlarla inip kalkma miktarı }
function drawLegs(ctx, cx, topY, h, dir, phase, moving, airborne, style) {
    const legSpace = h * style.ratio;
    const k = (h - legSpace) / style.photoH;        // fotoğraf kalan alana orantılı sığar
    const hipY = h - legSpace - style.width * 0.6;  // kalça fotoğrafın alt kenarının hemen arkasında
    const len = h - style.width * 0.7 - hipY;       // ayakkabı tabanı tam zemine değsin
    const pose = legPose(phase, moving, airborne, style.swing);
    const hips = [3, -3];
    const joints = pose.map((leg, i) => legJoints(hips[i], hipY, len, leg));

    // Yerdeyken en alttaki ayak zemine bassın: gövde buna göre iner (doğal sallanma)
    const drop = airborne ? 0 : (hipY + len) - Math.max(joints[0].fy, joints[1].fy);

    ctx.save();
    ctx.translate(cx, topY + drop);
    ctx.scale(dir, 1);
    drawLeg(ctx, hips[1], hipY, joints[1], style.width, style.back, style.shoe);   // arka bacak önce
    drawLeg(ctx, hips[0], hipY, joints[0], style.width, style.front, style.shoe);
    ctx.restore();
    return { k, drop };
}

function draw() {
    ctx.clearRect(0,0,width,height);
    ctx.save();
    ctx.translate(-camX, 0);

    platforms.forEach(p => {
        ctx.fillStyle = "#2d1b0d"; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#1e4d16"; ctx.fillRect(p.x, p.y, p.w, 15);
    });

    items.forEach(it => { if(!it.collected) drawKulHakkiBag(ctx, it.x, it.y, 80); });
    enemies.forEach(en => {
        if(en.dead) return;
        // Emine'nin fotoğrafı boydan (kendi ayakları var), o yüzden ek bacak yok:
        // yürürken ayakların üstünde sağa-sola salınır, her adımda hafif yükselir.
        const moving = en.lastSpeed > 0;
        const p = en.walkCycle;
        const sway = moving ? Math.sin(p) * 0.07 + en.dir * 0.03 : 0;  // salınım + yürüme yönüne hafif eğilme
        const bob  = moving ? -Math.abs(Math.cos(p)) * 6 : 0;          // adım ortasında yükselme
        // Kırpılmış fotoğraf kutu yüksekliğine oranını koruyarak sığar, ayaklar zeminde
        const c = enemyCrop || { sx: 0, sy: 0, sw: imgEnemy.naturalWidth || en.w, sh: imgEnemy.naturalHeight || en.h };
        const dh = en.h, dw = Math.min(en.w, dh * c.sw / c.sh);
        ctx.save();
        ctx.translate(en.x + en.w / 2, en.y + en.h);   // dönme noktası: ayakların ortası
        ctx.rotate(sway);
        ctx.drawImage(imgEnemy, c.sx, c.sy, c.sw, c.sh, -dw / 2, -dh + bob, dw, dh);
        ctx.restore();
    });

    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.globalAlpha = player.opacity;
    if(player.isDying) ctx.rotate(player.deathAngle);
    if(player.dir === -1 && !player.isDying) ctx.scale(-1, 1);

    const playerMoving = player.grounded && Math.abs(player.vx) > 1;
    const body = drawLegs(ctx, 0, -player.h/2, player.h, 1, player.legCycle, playerMoving, !player.grounded, PLAYER_LEGS);

    // Fotoğraf ve ağız, asıl 100x140 koordinatlarında çizilir; ölçek/kaydırma burada yapılır
    const PW = PLAYER_LEGS.photoW, PH = PLAYER_LEGS.photoH;
    ctx.translate(0, -player.h/2 + body.drop);
    ctx.scale(body.k, body.k);
    ctx.translate(0, PH/2);

    ctx.drawImage(imgPlayer, -PW/2, -PH/2, PW, PH);

    if(player.mouthOpen > 0.1) {
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.ellipse(0, 30, 35 * player.mouthOpen, 45 * player.mouthOpen, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.fillRect(-10, 30 - 30 * player.mouthOpen, 20, 10 * player.mouthOpen);
    }
    ctx.restore();

    playerProjectiles.forEach(p => {
        drawDollarBill(ctx, p.x, p.y, 20, p.angle);
    });
    
    projectiles.forEach(p => {
        drawLuxuryHandbag(ctx, p.x, p.y, 55, p.angle);
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life / (p.maxLife || 1);
        if(p.text) {
            ctx.fillStyle = p.color;
            ctx.font = "bold 40px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    });

    ctx.restore();
}

// Sabit adımlı döngü: oyun mantığı her ekranda saniyede 60 kez çalışır
// (120 Hz ekranlarda oyun hızlanmaz, 30 Hz'de yavaşlamaz)
const STEP = 1000 / 60;
let lastTime = null, accumulator = 0;
function loop(now) {
    if(lastTime === null) lastTime = now;
    // Sekme arka plandayken biriken süreyi sınırla (geri dönünce ışınlanma olmasın)
    accumulator += Math.min(now - lastTime, 250);
    lastTime = now;
    while(accumulator >= STEP) { update(); accumulator -= STEP; }
    draw();
    requestAnimationFrame(loop);
}

window.onkeydown = e => { 
    let k = e.key.toLowerCase();
    if(k==='a') keys.a=true; if(k==='d') keys.d=true; 
    if(e.key===' ') jump(); if(e.key==='Enter') shoot(); 
};
window.onkeyup = e => { 
    let k = e.key.toLowerCase();
    if(k==='a') keys.a=false; if(k==='d') keys.d=false; 
};

$('start-button').onclick = () => {
    $('overlay-screen').style.display = 'none';
    gameStarted = true;
    resizeCanvas();
    createLevel();
    requestAnimationFrame(loop);
    const bgMusic = $('bg-music');
    bgMusic.volume = 0.1; bgMusic.play().catch(()=>{});
};

// --- JOYSTICK ---
let joyDir = 0, joyPointer = null;
const joyWrap = $('joystick-wrapper'), joyStick = $('joystick-stick');
const JOY_MAX = 35, JOY_DEADZONE = 10;

function joyMove(e) {
    const r = joyWrap.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_MAX) { dx = dx / dist * JOY_MAX; dy = dy / dist * JOY_MAX; }
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyDir = Math.abs(dx) < JOY_DEADZONE ? 0 : Math.sign(dx);
}
function joyEnd(e) {
    if (e.pointerId !== joyPointer) return;
    joyPointer = null; joyDir = 0;
    joyStick.style.transform = '';
}
joyWrap.addEventListener('pointerdown', e => {
    e.preventDefault();
    joyPointer = e.pointerId;
    joyWrap.setPointerCapture(e.pointerId);
    joyMove(e);
});
joyWrap.addEventListener('pointermove', e => { if (e.pointerId === joyPointer) joyMove(e); });
joyWrap.addEventListener('pointerup', joyEnd);
joyWrap.addEventListener('pointercancel', joyEnd);

$('jump-btn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('shoot-btn').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); });
// Canvas'ı ekranın gerçek piksel yoğunluğuna göre boyutlandır (Retina/telefonlarda net görüntü).
// Oyun kodu CSS pikseliyle çalışmaya devam eder; ölçekleme setTransform ile yapılır.
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.onresize = () => {
    const oldHeight = height;
    resizeCanvas();
    if(!gameStarted || oldHeight === undefined) return;
    // Dünya ekranın altına hizalı; yükseklik değişince her şeyi aynı miktarda kaydır
    const dy = height - oldHeight;
    if(dy === 0) return;
    [platforms, items, enemies, projectiles, playerProjectiles, particles].forEach(list => list.forEach(o => o.y += dy));
    player.y += dy;
};
</script>
