<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>HIRHIZ - Sesli Edition</title>
    <link rel="stylesheet" href="css/style.css?v=12">
</head>
<body>

<div id="game-container">
    <div id="overlay-screen">
        <div id="intro-video"><canvas id="intro-canvas"></canvas></div>
        <h1 id="overlay-title">HIRHIZ</h1>
        <div class="story-note" id="overlay-note" data-i18n="note">"Bu HIRHIZ bir yüzükle çıkmıştı yollara..."</div>
        <p id="overlay-desc" data-i18n="desc">Kul Hakkı Torbalarını Topla!</p>
        <p id="best-line" class="best-line"></p>
        <div id="lang-picker">
            <button class="lang-btn" data-lang="tr">TR</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="fr">FR</button>
            <button class="lang-btn" data-lang="nl">NL</button>
            <button class="lang-btn" data-lang="de">DE</button>
            <button class="lang-btn" data-lang="ru">RU</button>
        </div>
        <button id="sound-btn" class="lang-btn" type="button"></button>
        <button id="howto-btn" class="lang-btn" type="button">❓ NASIL OYNANIR?</button>
        <button id="start-button" class="primary-btn" data-i18n="start">OYUNU BAŞLAT</button>
    </div>
    <div id="howto"><div id="howto-panel"></div></div>
    <div id="story"><canvas id="story-canvas"></canvas><button id="story-skip" type="button"></button></div>

    <div id="status" class="ui"><span data-i18n="treasure">Hazine</span>: <span id="score">0</span><span id="best-hud"></span></div>
    <div id="level-display" class="ui"><span data-i18n="level">Seviye</span>: <span id="current-level">1</span></div>
    <div id="kill-count" class="ui"><span data-i18n="kills">Leş</span>: <span id="kills">0</span> / <span id="target-kills">7</span></div>
    <div id="hearts" class="ui"></div>
    <button id="pause-btn" type="button" aria-label="pause">⏸</button>
    <button id="help-btn" type="button" aria-label="help">❓</button>

    <div id="ui-layer">
        <div id="joystick-wrapper"><div id="joystick-stick"></div></div>
        <!-- Oyun kolu gibi baklava dizilimi: üst KALKAN, sol FIRLAT, sağ BALYOZ, alt ZIPLA -->
        <div id="pad">
            <div class="btn pad-top shield-btn" id="shield-btn"><span class="pad-sym">△</span><span data-i18n="shield">KALKAN</span> <span class="key-hint">(S)</span></div>
            <div class="btn pad-left shoot-btn" id="shoot-btn"><span class="pad-sym">□</span><span data-i18n="shoot">RÜŞVET VER</span> <span class="key-hint">(Enter)</span></div>
            <div class="btn pad-right hammer-btn" id="hammer-btn"><span class="pad-sym">○</span><span data-i18n="hammer">BALYOZ</span> <span class="key-hint">(F)</span></div>
            <div class="btn pad-bottom jump-btn" id="jump-btn"><span class="pad-sym">✕</span><span data-i18n="jump">ZIPLA</span> <span class="key-hint">(Space)</span></div>
        </div>
    </div>
    <canvas id="gameCanvas"></canvas>
    <div id="rotate-hint"><div class="rotate-ico">📱↻</div><div data-i18n="rotate">Telefonu yan çevir</div></div>
</div>

<audio id="intro-music" loop><source src="intro_title.mp3" type="audio/mpeg"></audio>
<audio id="bg-music" loop><source src="chiptune_level1.mp3" type="audio/mpeg"></audio>
<audio id="sfx-explosion"><source src="explosion.wav" type="audio/wav"></audio>
<audio id="sfx-pickup"><source src="pickupCoin.wav" type="audio/wav"></audio>

<script src="js/i18n.js"></script>
<script src="js/core.js?v=12"></script>
<script src="js/audio.js?v=12"></script>
<script src="js/render.js?v=12"></script>
<script src="js/player.js?v=12"></script>
<script src="js/enemies.js?v=12"></script>
<script src="js/bosses.js?v=12"></script>
<script src="js/powerups.js?v=12"></script>
<script src="js/score.js?v=12"></script>
<script src="js/levels.js?v=12"></script>
<script src="js/chapters.js?v=12"></script>
<script src="js/bricks.js?v=12"></script>
<script src="js/flight.js?v=12"></script>
<script src="js/game.js?v=12"></script>
<script src="js/intro.js?v=12"></script>
<script src="js/howto.js?v=12"></script>
<script src="js/story.js?v=12"></script>
<script src="js/story_chapters.js?v=12"></script>
<script src="js/input.js?v=12"></script>
<script src="js/main.js?v=12"></script>
</body>
</html>
