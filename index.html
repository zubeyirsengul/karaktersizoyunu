<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OMURGASIZ - Sesli Edition</title>
    <style>
        :root { --bg: #064e3b; --gold: #fbbf24; --dollar: #22c55e; }
        body { margin: 0; overflow: hidden; background: var(--bg); font-family: sans-serif; touch-action: none; }
        #game-container { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        canvas { 
            display: block; 
            background: linear-gradient(to bottom, #143611, #064e3b); 
            z-index: 1; 
        }
        
        .ui { position: absolute; pointer-events: none; z-index: 20; color: white; }
        #status { top: 20px; left: 20px; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px #000; }
        #level-display { top: 20px; left: 50%; transform: translateX(-50%); font-size: 28px; font-weight: bold; color: var(--gold); }
        #kill-count { top: 60px; left: 20px; font-size: 18px; color: #ff4d4d; font-weight: bold; }
        #hearts { top: 88px; left: 18px; font-size: 26px; letter-spacing: 2px; }
        #pause-btn { position: absolute; top: 16px; right: 16px; z-index: 40; width: 48px; height: 48px; border-radius: 12px; border: 2px solid var(--gold); background: rgba(0,0,0,0.45); color: var(--gold); font-size: 22px; cursor: pointer; display: none; }
        
        #ui-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; }
        #joystick-wrapper { position: absolute; bottom: 50px; left: 50px; width: 120px; height: 120px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); pointer-events: auto; display: flex; justify-content: center; align-items: center; }
        #joystick-stick { width: 50px; height: 50px; background: var(--gold); border-radius: 50%; }
        
        .action-buttons { position: absolute; bottom: 50px; right: 50px; display: flex; gap: 20px; pointer-events: auto; }
        .btn { width: 100px; height: 100px; background: rgba(251,191,36,0.6); border: 4px solid var(--gold); border-radius: 50%; display: flex; flex-direction: column; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; color: white; text-shadow: 1px 1px 2px black; }
        .shoot-btn { background: rgba(34,197,94,0.6); border-color: #22c55e; }
        .hammer-btn { position: absolute; bottom: 170px; right: 50px; pointer-events: auto; background: rgba(239,68,68,0.6); border-color: #ef4444; }
        .shield-btn { position: absolute; bottom: 170px; right: 170px; pointer-events: auto; background: rgba(22,101,52,0.7); border-color: #fbbf24; }
        /* Dokunmatik cihazlarda klavye ipuçlarını gizle */
        @media (hover: none) and (pointer: coarse) { .key-hint { display: none; } }
        
        #overlay-screen { 
            position: absolute; 
            inset: 0; 
            background: rgba(0,0,0,0.95); 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            text-align: center; 
            color: white; 
        }
        #overlay-screen h1 { font-size: clamp(36px, 9vw, 80px); padding: 0 16px; margin: 0; color: var(--gold); text-shadow: 0 0 20px rgba(251,191,36,0.8); }
        .story-note { background: rgba(251,191,36,0.1); border: 1px solid var(--gold); padding: 15px 30px; border-radius: 10px; font-style: italic; margin: 20px 0; max-width: 80%; font-size: 20px; color: #fbbf24; }
        .primary-btn { background: var(--gold); border: none; padding: 20px 60px; font-size: 28px; font-weight: bold; border-radius: 15px; cursor: pointer; pointer-events: auto; color: #000; transition: transform 0.2s; }
        #lang-picker { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-bottom: 24px; }
        .lang-btn { background: transparent; color: var(--gold); border: 2px solid var(--gold); border-radius: 8px; padding: 8px 14px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .lang-btn.active { background: var(--gold); color: #000; }
        /* Açılış ekranı arka planında kodla çizilen canlı sahne (Kaçak Saray); yazılar okunsun diye üstüne hafif karartma */
        #intro-video { position: absolute; inset: 0; overflow: hidden; z-index: -1; pointer-events: none; }

        #sound-btn { margin-bottom: 20px; background: rgba(0,0,0,0.5); }
        .shake { animation: shake 0.5s both; }

function detectLang() {
    try { const saved = localStorage.getItem('lang'); if (LANGS[saved]) return saved; } catch (e) {}
    const nav = (navigator.language || 'tr').slice(0, 2).toLowerCase();
    return LANGS[nav] ? nav : 'tr';
}

const t = key => LANGS[lang][key];

function applyLang(newLang) {
    lang = newLang;
    try { localStorage.setItem('lang', lang); } catch (e) {}
    document.documentElement.lang = lang;
    document.title = t('title');
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll('.lang-btn[data-lang]').forEach(b => b.classList.toggle('active', b.dataset.lang === lang));
    updateSoundBtn();
}
document.querySelectorAll('.lang-btn[data-lang]').forEach(b => b.addEventListener('click', () => applyLang(b.dataset.lang)));

// Recep'in resminden sadece kafa alınır (gövdesi bacaklarla çakışmasın).

// clip = çene hattını izleyen kesim (soldaki ceket ve alttaki atkı dışarıda kalır).
const RECEP_HEAD = {
    x: 36, y: 8, w: 120, h: 162,
    neckX: 115,                 // bacakların bağlandığı nokta (çenenin altı)
    mouthX: 122, mouthY: 146,   // ağız açılma efekti
    handX: 150, handY: 156,     // balyozu tutan el
    clip: [[0,0],[194,0],[194,150],[150,152],[142,158],[132,163],[120,164],[108,168],[98,165],
           [88,160],[78,157],[68,154],[64,145],[63,132],[55,128],[0,128]]
};
let headCanvas = null;
function prepareHead() {
    const H = RECEP_HEAD, c = document.createElement('canvas');
    c.width = H.w; c.height = H.h;
    const x = c.getContext('2d');
    x.translate(-H.x, -H.y);
    x.beginPath();
    H.clip.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py));
    x.closePath();
    x.clip();
    x.drawImage(imgPlayer, 0, 0);
    headCanvas = c;
}
imgPlayer.onload = prepareHead;
if (imgPlayer.complete && imgPlayer.naturalWidth) prepareHead();

// TTS exponential backoff implementation
// Aynı anda tek konuşma; geç gelen ses anlamsız olacağı için en fazla 1 kısa tekrar
let speaking = false;
async function speak(text, voice = "Kore") {
    if (!apiKey || speaking) return;
    speaking = true;
    try {
        for (let attempt = 0; attempt < 2; attempt++) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                })
            });
            if (response.ok) {
                const result = await response.json();
                const pcmData = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (pcmData) {
                    const url = URL.createObjectURL(pcmToWav(pcmData, 24000));
                    const audio = new Audio(url);
                    audio.onended = () => URL.revokeObjectURL(url);
                    audio.play().catch(() => {});
                }
                return;
            }
            // Sadece geçici hatalarda (çok istek / sunucu) tekrar dene
            if (response.status !== 429 && response.status < 500) return;
            await new Promise(res => setTimeout(res, 1000));
        }
    } catch (e) {
        // Ağ hatası: sessizce geç
    } finally {
        speaking = false;
    }
}

function pcmToWav(b64, rate) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const head = new ArrayBuffer(44), v = new DataView(head);
    v.setUint32(0, 0x52494646, false); v.setUint32(4, 36+bin.length, true); v.setUint32(8, 0x57415645, false);
    v.setUint32(12, 0x666d7420, false); v.setUint16(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate*2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); v.setUint32(36, 0x64617461, false); v.setUint32(40, bin.length, true);
    return new Blob([head, bytes], { type: 'audio/wav' });
}

// Alttan yuvarlak, ucu yukarı sivrilen tek alev dili (taban: cx, baseY)
function flameTongue(ctx, cx, baseY, w, h, lean = 0) {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, baseY);
    ctx.bezierCurveTo(cx - w / 2, baseY - h * 0.5, cx + lean - w * 0.15, baseY - h * 0.7, cx + lean, baseY - h);
    ctx.bezierCurveTo(cx + lean + w * 0.15, baseY - h * 0.7, cx + w / 2, baseY - h * 0.5, cx + w / 2, baseY);
    ctx.quadraticCurveTo(cx, baseY + w * 0.35, cx - w / 2, baseY);
    ctx.fill();
}

const FIRE_COLORS = ["#dc2626", "#f97316", "#fde047"];

// ALEVİ'nin attığı alev: havadayken kuyruklu top, yere düşünce bir süre yanan ateş
function drawFire(ctx, p) {
    ctx.save();
    if (p.grounded) {
        ctx.globalAlpha = Math.min(1, p.life / 30);   // sönerken solar
        FIRE_COLORS.forEach((col, i) => {
            const sc = 1 - i * 0.3;
            ctx.fillStyle = col;
            for (let j = -1; j <= 1; j++) {
                flameTongue(ctx, p.x + j * 16 * sc, p.y, 26 * sc,
                    (34 + 10 * Math.sin(p.life * 0.4 + j * 2 + i)) * sc, Math.sin(p.life * 0.2 + j) * 4);
            }
        });
    } else {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2);   // kuyruk hareketin tersine uzar
        const flick = Math.sin(p.life * 0.6) * 6;
        FIRE_COLORS.forEach((col, i) => {
            const sc = 1 - i * 0.3;
            ctx.fillStyle = col;
            flameTongue(ctx, 0, 8 * sc, 30 * sc, (55 + flick) * sc);
        });
    }
    ctx.restore();
}

// --- BALYOZ ---
const SWING_FRAMES = 24, HAMMER_REACH = 190;
function hammer() {
    if(!gameStarted || player.isDying || paused || userPaused || levelCompleted || player.swing > 0 || player.shield) return;
    player.swing = SWING_FRAMES;
    player.swingHit = false;
}

// Animasyon ilerlemesine (0→1) göre balyozun açısı: geri kaldır → öne indir → toparlan
const HAMMER_IDLE = 0.45, HAMMER_BACK = -1.4, HAMMER_DOWN = 1.9;
function hammerAngle() {
    if(player.swing <= 0) return HAMMER_IDLE;
    const p = 1 - player.swing / SWING_FRAMES;
    const ease = v => v * v * (3 - 2 * v);
    if(p < 0.3) return HAMMER_IDLE + (HAMMER_BACK - HAMMER_IDLE) * ease(p / 0.3);
    if(p < 0.5) return HAMMER_BACK + (HAMMER_DOWN - HAMMER_BACK) * ease((p - 0.3) / 0.2);
    if(p < 0.75) return HAMMER_DOWN;
    return HAMMER_DOWN + (HAMMER_IDLE - HAMMER_DOWN) * ease((p - 0.75) / 0.25);
}

function updateHammer() {
    if(player.swing <= 0) return;
    player.swing--;
    // Balyoz yere indiği anda (ilerleme %50) önündeki polisi ez
    if(!player.swingHit && 1 - player.swing / SWING_FRAMES >= 0.5) {
        player.swingHit = true;
        const cx = player.x + player.w / 2;
        const minX = Math.min(cx, cx + player.dir * HAMMER_REACH), maxX = Math.max(cx, cx + player.dir * HAMMER_REACH);
        const headX = cx + player.dir * (HAMMER_REACH - 40), headY = player.y + player.h - 10;
        for(let i = 0; i < 8; i++) createParticle(headX, headY);   // toz
        enemies.forEach(en => {
            if(!en.dead && en.x < maxX && en.x + en.w > minX && en.y < player.y + player.h + 20 && en.y + en.h > player.y - 60) {
                killEnemy(en);
            }
        });
        if(boss && boss.x + 30 < maxX && boss.x + boss.w - 30 > minX) damageBoss(2);
    }
}

// --- SES EFEKTLERİ (Web Audio) ---
// Gerçek ses kayıtları: çığlıklar, canavar karşılamaları ve teyzeler (oyunun yapımcısının kendi sesi),
// darbeler (Independent.nu, CC0), FETÖ'nün burun çekme + tükürük sesi (tools/feto_ses.py ile üretildi)
const SFX_FILES = {
    cry: ['sfx/uufff.mp3'],                                // polis ölümü
    hit: [1, 2, 3, 4, 5].map(i => `sfx/hit${i}.mp3`),
    greet_alevi: ['sfx/yaali.mp3'],                         // canavarların karşılama sesleri
    greet_kurt: ['sfx/kro.mp3'],
    greet_feto: ['sfx/feto_greet.mp3'],
    granny: ['sfx/gotununkili.mp3'],                        // canavar ölünce gelen teyzeler
    // Recep'in replikleri (kayıt yoksa yapay sese, Gemini, düşer)
    voice_pickup: ['sfx/voice/gelsin.mp3', 'sfx/voice/kulhakki.mp3'],   // torba toplayınca
    voice_ouch: ['sfx/ahh.mp3']                                         // vurulunca ve ölünce
};
let audioCtx = null;
const sfxBuffers = Object.fromEntries(Object.keys(SFX_FILES).map(k => [k, []])), sfxLast = {};
function initAudio() {
    if (audioCtx) { if (audioCtx.resume) audioCtx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    audioCtx = new AC();
    for (const [kind, list] of Object.entries(SFX_FILES)) list.forEach((url, i) =>
        fetch(url).then(r => r.arrayBuffer()).then(b => audioCtx.decodeAudioData(b))
            .then(buf => { sfxBuffers[kind][i] = buf; }).catch(() => {}));
}
// Rastgele bir kayıt çalar (aynısı art arda gelmez); rate: perde/hız, pan: sol-sağ konum.
// Dönüş: çalan sesin süresi (saniye), çalamazsa 0
function playSfx(kind, { rate = 1, vol = 1, delay = 0, pan = 0 } = {}) {
    if (!audioCtx || !sfxBuffers[kind]) return 0;
    const list = sfxBuffers[kind].map((b, i) => [b, i]).filter(([b, i]) => b && (i !== sfxLast[kind] || sfxBuffers[kind].length < 2));
    if (!list.length) return 0;
    const [buf, idx] = list[Math.floor(Math.random() * list.length)];
    sfxLast[kind] = idx;
    const src = audioCtx.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = rate;
    const gain = audioCtx.createGain();
    gain.gain.value = vol;
    src.connect(gain);
    if (audioCtx.createStereoPanner) {
        const panner = audioCtx.createStereoPanner();
        panner.pan.value = Math.max(-1, Math.min(1, pan));
        gain.connect(panner); panner.connect(audioCtx.destination);
    } else gain.connect(audioCtx.destination);
    src.start(audioCtx.currentTime + delay);
    return buf.duration / rate;
}
// Düşman ölümü: önce darbe, hemen ardından çığlık. Polisin sesi daha kalın, ses ekrandaki konumuna göre sağdan/soldan gelir.
function enemyDeathSound(en) {
    const pan = (en.x + en.w / 2 - camX - width / 2) / (width / 2);
    playSfx('hit', { rate: 0.9 + Math.random() * 0.2, vol: 0.9, pan });
    const rate = en.kind === 'police' ? 0.76 + Math.random() * 0.08 : 0.92 + Math.random() * 0.2;
    playSfx('cry', { rate, vol: 0.85, delay: 0.05, pan });
}

// Ölen düşman yere yığılır ve kaybolur
const DEATH_FRAMES = 50;
function applyDeathPose(ctx, en) {
    const k = Math.min(1, en.deathT / 16);
    const px = en.x + en.w / 2, py = en.y + en.h;
    ctx.translate(px, py - en.w * 0.35 * k - Math.sin(k * Math.PI) * 18);
    ctx.rotate(en.fallDir * k * k * Math.PI / 2);
    ctx.translate(-px, -py);
    ctx.globalAlpha = Math.max(0, Math.min(1, (DEATH_FRAMES - en.deathT) / 15));
}

function killEnemy(en) {
    if(en.dead) return;
    en.dead = true;
    killedEnemies++;
    const isPolice = en.kind === 'police';
    // Devrilme animasyonu: oyuncudan uzağa doğru yere yığılır
    en.deathT = 0; en.lastSpeed = 0;
    en.fallDir = Math.sign(en.x + en.w / 2 - (player.x + player.w / 2)) || 1;
    enemyDeathSound(en);
    createParticle(en.x + en.w/2, en.y, isPolice ? t("policeCry") : t("hit"), isPolice ? "#60a5fa" : "white", 1.0);
    $('score').innerText = score += isPolice ? 3000 : 2000; $('kills').innerText = killedEnemies;
    if(killedEnemies === targetKills) {
        // Hedef tamamlanınca kapı açılır; içinden geçince bölüm sonu canavarı (1: ALEVİ, 2: KURT, 3: FETÖ)
        spawnGate();
    }
}

// --- BÖLÜM SONU KAPISI ---
// 7 polis ölünce oyuncunun önünde büyük bir kapı belirir ve açılır; içinden geçen bölüm sonu canavarıyla karşılaşır.
let gate = null, screenFlash = 0;
function spawnGate() {
    const x = Math.min(player.x + 700, WORLD_WIDTH - 1200);
    gate = { x, w: 190, h: 290, open: 0, passed: false };
    bossCheckpoint = { score, stage: 'gate' };      // ölünce kapıdan devam
    createParticle(player.x + player.w / 2, player.y - 30, t("doorOpen"), "#fde047", 2.5);
    playSfx('hit', { rate: 0.35, vol: 0.8 });       // ağır kapı gümbürtüsü
}
function updateGate() {
    if (screenFlash > 0) screenFlash = Math.max(0, screenFlash - 0.03);
    if (!gate) return;
    if (gate.open < 1) gate.open = Math.min(1, gate.open + 1 / 70);
    // Kapıdan geçince: beyaz parlama, canavar karşıda belirir
    if (!gate.passed && gate.open >= 1 && player.x + player.w / 2 > gate.x + gate.w / 2) {
        gate.passed = true;
        screenFlash = 1;
        spawnBoss(gate.x + gate.w + 520);
    }
}

// Kapı kemeri (yarım daire tepeli)
function archPath(ctx, l, r, bottom, top) {
    const rad = (r - l) / 2;
    ctx.beginPath();
    ctx.moveTo(l, bottom); ctx.lineTo(l, top + rad);
    ctx.arc((l + r) / 2, top + rad, rad, Math.PI, 0);
    ctx.lineTo(r, bottom); ctx.closePath();
}
function drawGate(ctx, g) {
    const gy = height - 60, x = g.x, w = g.w, h = g.h, il = x + 22, ir = x + w - 22, itop = gy - h + 26;
    // İçerisi: kapı açıldıkça parlayan ışık
    const glow = ctx.createRadialGradient(x + w / 2, gy - h / 2, 10, x + w / 2, gy - h / 2, h * 0.9);
    glow.addColorStop(0, `rgba(254,243,199,${0.5 * g.open})`); glow.addColorStop(1, "rgba(254,243,199,0)");
    ctx.fillStyle = glow; ctx.fillRect(x - h * 0.6, gy - h * 1.4, w + h * 1.2, h * 1.5);
    const inner = ctx.createLinearGradient(0, itop, 0, gy);
    inner.addColorStop(0, "#fffbeb"); inner.addColorStop(1, "#fbbf24");
    archPath(ctx, il, ir, gy, itop); ctx.fillStyle = inner; ctx.fill();
    // Kanatlar: menteşeden içe doğru açılır (genişlikleri daralır)
    ctx.save();
    archPath(ctx, il, ir, gy, itop); ctx.clip();
    const half = (ir - il) / 2, pw = half * (1 - g.open * 0.88);
    [[il, 1], [ir, -1]].forEach(([hx, s]) => {
        const l = s > 0 ? hx : hx - pw;
        const wood = ctx.createLinearGradient(l, 0, l + pw, 0);
        wood.addColorStop(0, "#7c2d12"); wood.addColorStop(1, "#451a03");
        ctx.fillStyle = wood; ctx.fillRect(l, itop, pw, gy - itop);
        ctx.fillStyle = "#fbbf24";                                     // altın çiviler
        for (let r = 0; r < 7; r++) for (let c = 0; c < 3; c++) {
            const cx = l + pw * (0.2 + c * 0.3), cy = itop + 40 + r * 34;
            if (pw > 12) { ctx.beginPath(); ctx.arc(cx, cy, 2.6 * (pw / half), 0, Math.PI * 2); ctx.fill(); }
        }
        if (pw > 20) {                                                 // halka tokmak
            ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(s > 0 ? l + pw - 12 : l + 12, gy - h * 0.45, 8, 0, Math.PI * 2); ctx.stroke();
        }
    });
    ctx.restore();
    // Taş çerçeve, kilit taşı, bayrak
    ctx.fillStyle = "#efe4cc"; ctx.strokeStyle = "#a8956d"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(x, gy); ctx.lineTo(x, gy - h + w / 2); ctx.arc(x + w / 2, gy - h + w / 2, w / 2, Math.PI, 0); ctx.lineTo(x + w, gy);
    ctx.lineTo(ir, gy); ctx.lineTo(ir, itop + (ir - il) / 2); ctx.arc(x + w / 2, itop + (ir - il) / 2, (ir - il) / 2, 0, Math.PI, true); ctx.lineTo(il, gy);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#d97706";
    ctx.beginPath(); ctx.moveTo(x + w / 2 - 14, gy - h - 2); ctx.lineTo(x + w / 2 + 14, gy - h - 2); ctx.lineTo(x + w / 2 + 9, gy - h + 26); ctx.lineTo(x + w / 2 - 9, gy - h + 26); ctx.closePath(); ctx.fill();
    drawTurkishFlag(ctx, x + w / 2, gy - h - 2, 0.9, performance.now() / 1000);
}
// Kapı ekran dışındaysa sağ kenarda yönünü gösteren ok
function drawGateHint(ctx) {
    if (!gate || gate.passed) return;
    const sx = gate.x + gate.w / 2 - camX;
    if (sx < width - 30) return;
    const y = height * 0.45, bob = Math.sin(performance.now() / 150) * 6;
    ctx.fillStyle = "#fde047"; ctx.strokeStyle = "#000"; ctx.lineWidth = 4;
    ctx.font = "bold 22px Arial"; ctx.textAlign = "right"; ctx.textBaseline = "middle";
    ctx.strokeText(t("gateHint"), width - 60 + bob, y); ctx.fillText(t("gateHint"), width - 60 + bob, y);
    ctx.beginPath(); ctx.moveTo(width - 50 + bob, y - 16); ctx.lineTo(width - 20 + bob, y); ctx.lineTo(width - 50 + bob, y + 16); ctx.closePath();
    ctx.fill(); ctx.stroke();
}

// Canavarın karşılama balonu (konuşurken)
function drawSpeech(ctx, b) {
    if (!(b.talk > 0) || !b.T.say || b.dying) return;
    const text = b.T.say, x = b.x + b.w / 2 + 30, y = b.y - (b.T.labelY || 35) - 60;
    ctx.font = "bold 22px Arial";
    const tw = ctx.measureText(text).width + 28;
    ctx.fillStyle = "#fff"; ctx.strokeStyle = "#111"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.roundRect(x - 10, y - 22, tw, 44, 14); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x + 4, y + 21); ctx.lineTo(x - 14, y + 44); ctx.lineTo(x + 22, y + 21); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + 4, y + 22); ctx.lineTo(x - 14, y + 44); ctx.lineTo(x + 22, y + 22); ctx.stroke();
    ctx.fillStyle = "#111"; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(text, x + 4, y + 1);
}

// --- BAŞÖRTÜLÜ TEYZELER ---
// Canavar ölünce iki yandan koşarak gelirler; terlik sallayıp zıplayarak kutlarlar.
let grannies = [];
const GRANNY_LOOKS = [
    { scarf: "#f8fafc", dots: "#60a5fa", cardigan: "#7f1d1d", skirt: "#1e3a8a" },
    { scarf: "#fde68a", dots: "#b45309", cardigan: "#14532d", skirt: "#3f3f46" },
    { scarf: "#fbcfe8", dots: "#be185d", cardigan: "#78350f", skirt: "#4c1d95" },
    { scarf: "#bbf7d0", dots: "#15803d", cardigan: "#1e3a8a", skirt: "#7f1d1d" },
    { scarf: "#e9d5ff", dots: "#7e22ce", cardigan: "#57534e", skirt: "#0f766e" },
    { scarf: "#fed7aa", dots: "#c2410c", cardigan: "#334155", skirt: "#713f12" }
];
function spawnGrannies(cx) {
    grannies = [];
    for (let i = 0; i < 6; i++) {
        const side = i % 2 ? 1 : -1, row = Math.floor(i / 2);
        grannies.push({
            x: side < 0 ? camX - 80 - row * 60 : camX + width + 80 + row * 60,
            tx: cx + side * (60 + row * 85), cx, dir: -side, phase: i * 1.3,
            state: 'run', look: GRANNY_LOOKS[i], glasses: i % 3 === 0, speed: 5.5 + row * 0.6
        });
    }
}
function updateGrannies() {
    grannies.forEach(g => {
        if (g.state === 'run') {
            const d = g.tx - g.x;
            g.dir = Math.sign(d) || g.dir;
            g.x += Math.sign(d) * Math.min(Math.abs(d), g.speed);
            g.phase += 0.35;
            if (Math.abs(d) < 2) { g.state = 'party'; g.dir = Math.sign(g.cx - g.x) || 1; }
        } else g.phase += 0.22;
    });
}
function drawGranny(ctx, g) {
    const gy = height - 60, L = g.look, party = g.state === 'party';
    const hop = party ? Math.abs(Math.sin(g.phase)) * 18 : Math.abs(Math.sin(g.phase)) * 4;
    ctx.save();
    ctx.translate(g.x, gy - hop);
    ctx.scale(g.dir, 1);
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    // Bacaklar (çorap) ve terlikler
    [-1, 1].forEach(s => {
        const a = party ? s * 0.15 : Math.sin(g.phase + (s > 0 ? 0 : Math.PI)) * 0.5;
        const fx = Math.sin(a) * 26 + s * 4, fy = -Math.cos(a) * 26 + 26;
        ctx.strokeStyle = "#b08968"; ctx.lineWidth = 8;
        ctx.beginPath(); ctx.moveTo(s * 5, -26); ctx.lineTo(fx, fy - 4); ctx.stroke();
        ctx.fillStyle = "#1c1917"; ctx.beginPath(); ctx.ellipse(fx + 4, fy - 2, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    });
    // Uzun etek (puanlı)
    ctx.fillStyle = L.skirt;
    ctx.beginPath(); ctx.moveTo(-17, -80); ctx.lineTo(19, -80); ctx.lineTo(28, -22); ctx.lineTo(-26, -22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.arc(-18 + (i % 3) * 18 + (i > 2 ? 3 : 0), -70 + Math.floor(i / 3) * 16, 2, 0, Math.PI * 2); ctx.fill(); }
    // Arka kol
    ctx.strokeStyle = L.cardigan; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(-6, -112); ctx.lineTo(-12 + Math.sin(g.phase) * 4, -86); ctx.stroke();
    // Hırka (hafif kambur)
    ctx.fillStyle = L.cardigan;
    ctx.beginPath(); ctx.moveTo(-16, -78); ctx.lineTo(-14, -112); ctx.quadraticCurveTo(2, -122, 18, -110); ctx.lineTo(20, -78); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#e7e5e4";
    [-104, -94, -84].forEach(y => { ctx.beginPath(); ctx.arc(9, y, 1.8, 0, Math.PI * 2); ctx.fill(); });
    // Kafa: başörtüsü, yüz, çenenin altında düğüm
    const fx = 6, fy = -134;
    ctx.fillStyle = L.scarf;
    ctx.beginPath(); ctx.ellipse(fx - 2, fy - 2, 19, 21, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx - 18, fy + 4); ctx.quadraticCurveTo(fx - 16, fy + 26, fx - 4, fy + 24); ctx.lineTo(fx - 12, fy + 6); ctx.closePath(); ctx.fill();   // arkaya sarkan uç
    ctx.fillStyle = L.dots;
    [[-10, -12], [0, -16], [-14, 2], [-6, -4], [-16, -8]].forEach(([dx, dy]) => { ctx.beginPath(); ctx.arc(fx + dx, fy + dy, 1.8, 0, Math.PI * 2); ctx.fill(); });
    ctx.fillStyle = "#f1c9a5";
    ctx.beginPath(); ctx.ellipse(fx + 4, fy + 3, 11, 13, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = L.scarf;                                           // alın bandı ve çene düğümü
    ctx.beginPath(); ctx.ellipse(fx + 3, fy - 9, 13, 5, 0, Math.PI, 0); ctx.fill();
    ctx.beginPath(); ctx.moveTo(fx + 2, fy + 15); ctx.lineTo(fx - 3, fy + 22); ctx.lineTo(fx + 4, fy + 20); ctx.lineTo(fx + 9, fy + 24); ctx.lineTo(fx + 7, fy + 15); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#7c5a3c"; ctx.lineWidth = 1.5;                   // gözler, kırışıklar
    [[0, 0], [9, 0]].forEach(([dx]) => { ctx.beginPath(); ctx.arc(fx + dx, fy, 2.4, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); });
    ctx.beginPath(); ctx.moveTo(fx + 13, fy + 2); ctx.lineTo(fx + 15, fy + 4); ctx.moveTo(fx - 4, fy + 6); ctx.lineTo(fx - 3, fy + 9); ctx.stroke();
    if (g.glasses) {
        ctx.strokeStyle = "#44403c"; ctx.lineWidth = 1.5;
        [[0], [9]].forEach(([dx]) => { ctx.beginPath(); ctx.arc(fx + dx, fy + 0.5, 4.2, 0, Math.PI * 2); ctx.stroke(); });
        ctx.beginPath(); ctx.moveTo(fx + 4, fy); ctx.lineTo(fx + 5, fy); ctx.stroke();
    }
    ctx.fillStyle = "#e0a98a"; ctx.beginPath(); ctx.arc(fx + 12, fy + 5, 2.4, 0, Math.PI * 2); ctx.fill();   // burun
    if (party) {                                                        // bağırarak kutlar
        ctx.fillStyle = "#4a1d0f"; ctx.beginPath(); ctx.ellipse(fx + 6, fy + 10, 4, 2 + Math.abs(Math.sin(g.phase * 2)) * 3, 0, 0, Math.PI * 2); ctx.fill();
    } else {
        ctx.strokeStyle = "#7c5a3c"; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(fx + 6, fy + 8, 3, 0.2, Math.PI - 0.2); ctx.stroke();
    }
    // Ön kol (başın önünde çizilir): koşarken sallanır, kutlarken havada terlik sallar
    const aa = party ? 2.5 + Math.sin(g.phase * 2) * 0.5 : 0.5 + Math.sin(g.phase) * 0.6;   // kutlarken kol öne-yukarı
    const hx = 10 + Math.sin(aa) * 36, hy = -110 + Math.cos(aa) * 36;
    ctx.strokeStyle = L.cardigan; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(10, -110); ctx.lineTo(hx, hy); ctx.stroke();
    if (party) {                                                       // terlik
        ctx.save(); ctx.translate(hx, hy); ctx.rotate(aa + Math.PI);
        ctx.fillStyle = "#a16207"; ctx.beginPath(); ctx.ellipse(0, -14, 7, 15, 0, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#f472b6"; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, -16, 6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke();
        ctx.restore();
    }
    ctx.fillStyle = "#f1c9a5"; ctx.beginPath(); ctx.arc(hx, hy, 4.5, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
}

function fireball(x, y, vx, vy) {
    projectiles.push({ type: 'fire', x, y, vx, vy, active: true, life: 400, angle: 0, grounded: false });
}

function bossAttack() {
    const b = boss;
    b.attacks++;
    const mx = b.x + b.w / 2, my = b.y + b.h * 0.3;
    if(b.attacks % 3 === 0) {
        // Her üçüncü saldırı: oyuncuya doğru üçlü alev
        const side = Math.sign(player.x + player.w / 2 - mx) || 1;
        for(let i = 0; i < 3; i++) fireball(mx, my, side * (6 + i * 2.5), -8 + i * 1.5);
    } else {
        // Etrafa alev yağmuru
        const n = 7;
        for(let i = 0; i < n; i++) {
            fireball(mx, b.y + 20, -9 + 18 * i / (n - 1) + (Math.random() - 0.5) * 2, -12 - Math.random() * 5);
        }
    }
}

function updateFire(p) {
    p.life--;
    if(!p.grounded) {
        p.vy += 0.35;
        const prevY = p.y;
        p.x += p.vx; p.y += p.vy;
        // Zemine/platforma düşünce orada yanmaya devam et
        for(const pl of platforms) {
            if(p.vy > 0 && p.x > pl.x && p.x < pl.x + pl.w && prevY <= pl.y && p.y >= pl.y) {
                p.grounded = true; p.y = pl.y; p.vx = p.vy = 0; p.life = 150;
                break;
            }
        }
    }
    if(player.isDying || !p.active) return;
    const hit = p.grounded
        // Yerdeki ateş: üstünden zıplanarak geçilebilir
        ? p.x > player.x - 5 && p.x < player.x + player.w + 5 && player.y + player.h > p.y - 30
        : p.x > player.x + 10 && p.x < player.x + player.w - 10 && p.y > player.y && p.y < player.y + player.h;
    if(hit) { if(!p.grounded && shieldBlocks(p)) blockProjectile(p); else die(); }
}

function damageBoss(n) {
    if(!boss || boss.dying || boss.hurt > 0) return;
    boss.hp = Math.max(0, boss.hp - n);
    boss.hurt = 30;   // kısa dokunulmazlık (yanıp söner)
    playSfx('hit', { rate: 0.8 + Math.random() * 0.2, vol: 0.7 });
    createParticle(boss.x + boss.w / 2, boss.y + 40, "-" + n, "#fde047", 0.8);
    if(boss.hp > 0) return;
    boss.dying = true;
    levelEnding = true;
    projectiles = projectiles.filter(p => p.type === 'bullet');   // canavarın saldırıları silinir
    $('score').innerText = score += 20000;
    $('sfx-explosion').currentTime = 0; $('sfx-explosion').play().catch(()=>{});
    for(let i = 0; i < 30; i++) createParticle(boss.x + Math.random() * boss.w, boss.y + Math.random() * boss.h);
    playSfx('hit', { rate: 0.6, vol: 1 });
    playSfx('cry', { rate: 0.55, vol: 1, delay: 0.08 });   // canavar: kalın, uzun çığlık
    // Başörtülü teyzeler koşarak gelip kutlar; ses bitince bölüm biter
    spawnGrannies(boss.x + boss.w / 2);
    const gd = playSfx('granny', { vol: 1, delay: 0.6 });
    setTimeout(completeLevel, Math.max(3000, (gd + 0.6) * 1000 + 1200));
}

function updateBoss() {
    const b = boss;
    if(!b) return;
    b.anim++;
    if(b.dying) { if(++b.deathT > 60) boss = null; return; }
    if(b.hurt > 0) b.hurt--;
    if(b.talk > 0) b.talk--;      // karşılama konuşması bitene kadar saldırmaz
    else b.T.update(b);

    // Temas: üstüne zıplayınca hasar, yandan değince ölüm
    if(!player.isDying && player.x + player.w - 30 > b.x + 40 && player.x + 30 < b.x + b.w - 40 &&
       player.y + player.h > b.y + 30 && player.y < b.y + b.h) {
        if(player.vy > 0 && player.y + player.h < b.y + b.T.stomp) { player.vy = -22; damageBoss(2); }
        else die();
    }
}

// ALEVİ: yavaşça yaklaşır, kollarını kaldırıp etrafa alev saçar
function updateAlevi(b) {
    const dist = (player.x + player.w / 2) - (b.x + b.w / 2);
    b.look = Math.sign(dist) || b.look;
    // Saldırı hazırlığında durur; değilse oyuncuya yavaşça yaklaşır (arenasından çıkmaz)
    if(b.charge <= 0 && Math.abs(dist) > 250) b.x += Math.sign(dist) * 1.3;
    b.x = Math.max(b.homeX - b.T.arena, Math.min(b.x, b.homeX + b.T.arena));

    if(!player.isDying && Math.abs(dist) < 1400 && b.charge <= 0 && ++b.timer > 110) { b.timer = 0; b.charge = 30; }
    if(b.charge > 0 && --b.charge === 0) bossAttack();
}

// KURT: koşarak yaklaşır; sırayla ATILMA (çömel → hızla koş) ve SIÇRAMA (zıpla → inişte şok dalgası)
function updateKurt(b) {
    const groundY = height - 60 - b.h;
    const dist = (player.x + player.w / 2) - (b.x + b.w / 2);
    b.look = Math.sign(dist) || b.look;
    switch(b.state) {
        case 'walk':
            b.dir = Math.sign(dist) || b.dir;
            if(Math.abs(dist) > 220) { b.x += b.dir * 2.2; b.run += 0.14; }
            if(!player.isDying && Math.abs(dist) < 1400 && ++b.timer > 80) {
                b.timer = 0;
                b.attacks++;
                b.next = b.attacks % 2 ? 'dash' : 'leap';
                b.state = 'crouch';
                b.stateT = b.next === 'dash' ? 40 : 28;   // hazırlık: oyuncuya kaçma süresi
                createParticle(b.x + b.w / 2, b.y - 50, b.next === 'dash' ? "GRRR!" : "AUUU!", "#e5e7eb", 1.0);
            }
            break;
        case 'crouch':
            if(--b.stateT <= 0) {
                b.dir = Math.sign(dist) || b.dir;
                if(b.next === 'dash') { b.state = 'dash'; b.stateT = 75; }
                else {
                    b.state = 'leap'; b.vy = -19;
                    const air = 2 * 19 / 0.9;   // havada kalma süresi (kare)
                    b.vx = Math.max(-12, Math.min(12, dist / air));
                }
            }
            break;
        case 'dash':
            b.x += b.dir * 13; b.run += 0.5;
            if(--b.stateT <= 0 || b.x <= b.homeX - b.T.arena || b.x >= b.homeX + b.T.arena) { b.state = 'walk'; b.timer = 20; }
            break;
        case 'leap':
            b.vy += 0.9; b.x += b.vx; b.y += b.vy;
            if(b.y >= groundY) {
                b.y = groundY; b.state = 'walk'; b.timer = 15;
                const cx = b.x + b.w / 2;
                [-1, 1].forEach(d => projectiles.push({ type: 'wave', x: cx + d * b.w * 0.3, y: height - 60, vx: d * 8, active: true, life: 85, angle: 0 }));
                for(let i = 0; i < 12; i++) createParticle(cx + (Math.random() - 0.5) * b.w, height - 70);
            }
            break;
    }
    if(b.state !== 'leap') b.y = groundY;
    b.x = Math.max(b.homeX - b.T.arena, Math.min(b.x, b.homeX + b.T.arena, WORLD_WIDTH - b.w));
    b.crouch += ((b.state === 'crouch' ? 1 : 0) - b.crouch) * 0.25;
}

// FETÖ: bastonlu yaşlı adam. Ağır ağır yaklaşır; avucundan 1 dolarlar savurur,
// her üçüncü saldırıda bastonunu havaya kaldırıp yere vurur ve iki yana şok dalgası gönderir.
function updateFeto(b) {
    b.y = height - 60 - b.h;
    const dist = (player.x + player.w / 2) - (b.x + b.w / 2);
    b.look = Math.sign(dist) || b.look;
    if(b.recover > 0) b.recover--;
    if(b.state === 'walk') {
        if(Math.abs(dist) > 260 && b.recover <= 0) { b.x += Math.sign(dist) * 1.4; b.run += 0.08; }
        if(!player.isDying && Math.abs(dist) < 1400 && ++b.timer > 85) {
            b.timer = 0;
            b.attacks++;
            b.next = b.attacks % 3 === 0 ? 'slam' : 'volley';
            b.state = 'crouch';
            b.stateT = b.next === 'slam' ? 34 : 30;
            createParticle(b.x + b.w / 2, b.y - 50, b.next === 'slam' ? "HOOOP!" : "AL!", "#fde047", 1.0);
        }
    } else if(b.state === 'crouch' && --b.stateT <= 0) {
        if(b.next === 'volley') dollarVolley(b);
        else {
            const cx = b.x + b.w / 2 + b.look * 70 * b.T.scale;   // bastonun yere değdiği yer
            [-1, 1].forEach(d => projectiles.push({ type: 'wave', x: cx + d * 30, y: height - 60, vx: d * 8, active: true, life: 85, angle: 0 }));
            for(let i = 0; i < 10; i++) createParticle(cx + (Math.random() - 0.5) * 80, height - 70);
            playSfx('hit', { rate: 0.5, vol: 0.8 });
            b.recover = 18;
        }
        b.state = 'walk';
    }
    b.x = Math.max(b.homeX - b.T.arena, Math.min(b.x, b.homeX + b.T.arena, WORLD_WIDTH - b.w));
    b.crouch += ((b.state === 'crouch' ? 1 : 0) - b.crouch) * 0.25;
}

function dollarVolley(b) {
    const mx = b.x + b.w / 2, my = b.y + 40;
    const side = Math.sign(player.x + player.w / 2 - mx) || 1;
    for(let i = 0; i < 6; i++) {
        projectiles.push({ type: 'dollar1', x: mx, y: my, vx: side * (2 + i * 1.6), vy: -10 - Math.random() * 3,
                           active: true, life: 420, angle: 0, phase: Math.random() * 6, landed: false });
    }
}

// 1 dolar: yükselip yaprak gibi sallanarak süzülür; yere düşünce zararsızdır
function updateOneDollar(p) {
    p.life--;
    if(!p.landed) {
        p.vy = Math.min(p.vy + 0.3, 2.2);
        p.vx *= 0.985;
        const sway = Math.sin(p.life * 0.08 + p.phase);
        p.x += sway * 1.2; p.y += p.vy; p.angle = sway * 0.6;
        if(p.y > height - 72) { p.y = height - 72; p.vx = 0; p.landed = true; p.life = Math.min(p.life, 90); }
    } else p.vx = 0;
    if(player.isDying || !p.active || p.landed) return;
    if(p.x > player.x + 15 && p.x < player.x + player.w - 15 && p.y > player.y && p.y < player.y + player.h) { if(shieldBlocks(p)) blockProjectile(p); else { p.active = false; die(); } }
}

// Şok dalgası zeminde ilerler; üstünden zıplanarak kaçılır
function updateWave(p) {
    p.x += p.vx;
    p.life--;
    if(player.isDying || !p.active) return;
    if(Math.abs(p.x - (player.x + player.w / 2)) < 40 && player.y + player.h > p.y - 45) die();
}

// --- CAN SİSTEMİ ---
// Vurulunca bir can gider, Recep kısa süre yanıp söner ve dokunulmaz olur; canlar bitince ölür.
function updateHearts() {
    $('hearts').textContent = '❤️'.repeat(Math.max(0, player.hp)) + '🖤'.repeat(Math.max(0, player.maxHp - player.hp));
}
function die() {
    if(player.isDying || levelCompleted || levelEnding || player.invuln > 0) return;
    player.hp--;
    updateHearts();
    if(player.hp <= 0) { killPlayer(); return; }
    player.invuln = 90;
    player.vy = -9;                                   // hafifçe havaya ve geriye savrulur
    player.vx = -player.dir * 9;
    player.knock = 12;
    playSfx('hit', { rate: 1.1, vol: 0.8 });
    createParticle(player.x + player.w / 2, player.y, "-1 ❤️", "#ef4444", 1.0);
    $('game-container').classList.remove('shake'); void $('game-container').offsetWidth;
    $('game-container').classList.add('shake');
    if(!playSfx('voice_ouch')) speak(t("ouch"), "Kore");
}

async function killPlayer() {
    // Bölüm bitmek üzereyken artık ölünmez
    if(player.isDying || levelCompleted || levelEnding) return;
    player.hp = 0; updateHearts();
    player.isDying = true;
    $('game-container').classList.add('shake');
    $('sfx-explosion').currentTime = 0; $('sfx-explosion').play().catch(()=>{});
    
    // Vurulunca GEBER yazısı çıkar
    createParticle(player.x + player.w/2, player.y + player.h/2, t("die"), "red", 2.0);
    
    if(!playSfx('voice_ouch')) speak(t("ouch"), "Kore");
    // Sayfayı yenilemek yerine bulunulan bölümü baştan başlat
    setTimeout(restartLevel, 2500);
}

function restartLevel() {
    // Kapıya ya da canavara ulaşıldıysa polisleri tekrar öldürmek gerekmez: oradan devam
    const cp = bossCheckpoint, start = levelStartScore;
    score = cp ? cp.score : start;
    $('score').innerText = score;
    createLevel();
    levelStartScore = start;
    if(cp) {
        killedEnemies = targetKills;
        $('kills').innerText = killedEnemies;
        if(cp.stage === 'gate') spawnGate(); else spawnBoss(player.x + 420);
    }
}

function completeLevel() {
    if(levelCompleted) return;
    levelCompleted = true;
    $('lang-picker').hidden = true; // Dil sadece başlangıç ekranında seçilir
    paused = true;

    if (currentLevel < MAX_LEVEL) {
        const n = currentLevel;
        $('overlay-title').innerText = t(`l${n}Title`);
        $('overlay-note').innerText = t(`l${n}Note`);
        $('start-button').innerText = t(`l${n}Btn`);
        $('start-button').onclick = () => goToLevel(n + 1);
    } else {
        $('overlay-title').innerText = t("winTitle");
        $('overlay-note').innerText = t("winNote");
        $('start-button').innerText = t("winBtn");
        $('start-button').onclick = () => location.reload();
    }
    $('overlay-screen').style.display = 'flex';
}

// --- BÖLÜMLER ---
// platforms: [x, zeminden yükseklik, genişlik, kalınlık]; fire: polislerin ateş aralığı (kare)
const LEVELS = {
    1: { target: 7, music: 'chiptune_level1.mp3', boss: 'alevi', speed: 1.5, fire: 170,
         platforms: [[600, 180, 200, 120], [1200, 250, 300, 50], [1800, 150, 150, 100], [2300, 350, 400, 50]] },
    2: { target: 7, music: 'bozkir_dortnal.mp3', boss: 'kurt', speed: 2.5, fire: 150,
         platforms: [[400, 150, 150, 40], [800, 300, 150, 40], [1200, 450, 200, 40], [1600, 300, 300, 40]] },
    3: { target: 7, music: 'chiptune_level3.mp3', boss: 'feto', speed: 3.2, fire: 125,
         platforms: [[500, 170, 180, 40], [850, 290, 180, 40], [1250, 400, 260, 40], [1700, 260, 200, 40], [2200, 180, 300, 40]] }
};
const MAX_LEVEL = 3;

function goToLevel(n) {
    currentLevel = n; targetKills = LEVELS[n].target;
    $('current-level').innerText = n; $('target-kills').innerText = targetKills;
    $('overlay-screen').style.display = 'none'; paused = false;
    const bgMusic = $('bg-music');
    bgMusic.src = LEVELS[n].music; bgMusic.play().catch(()=>{});
    createLevel();
}

function createLevel() {
    items = []; enemies = []; projectiles = []; playerProjectiles = []; particles = [];
    killedEnemies = 0; levelCompleted = false; levelEnding = false;
    boss = null; bossCheckpoint = null; gate = null; grannies = []; screenFlash = 0;
    levelStartScore = score;
    player.x = 100; player.y = 0; player.vx = 0; player.vy = 0; camX = 0;
    player.isDying = false; player.deathAngle = 0; player.opacity = 1; player.mouthOpen = 0; player.dir = 1;
    player.swing = 0; player.swingHit = false;
    player.hp = player.maxHp; player.invuln = 0; player.knock = 0; updateHearts();
    $('game-container').classList.remove('shake');
    $('kills').innerText = "0";

    platforms = [{x: 0, y: height-60, w: 40000, h: 500},
                 ...LEVELS[currentLevel].platforms.map(([x, up, w, h]) => ({ x, y: height - up, w, h }))];

    for(let i=0; i<40; i++) {
        items.push({ x: 800 + i * 700, y: height - 150 - (Math.random() * 250), collected: false });
    }

    for(let i=0; i<20; i++) {
        const homeX = 1500 + i * 1500;
        // Bütün düşmanlar 17/25 polisi; bölüm ilerledikçe daha sık ateş eder
        const w = 120, h = 200;
        enemies.push({
            kind: 'police',
            x: homeX, y: height - 60 - h, w, h,   // alt kenar zeminde
            timer: Math.floor(Math.random() * 60), interval: LEVELS[currentLevel].fire, dead: false,
            aim: 0, flash: 0,
            homeX: homeX,                          // Devriye merkezi
            dir: Math.random() < 0.5 ? -1 : 1,     // Yürüme yönü
            speed: LEVELS[currentLevel].speed,     // bölüm ilerledikçe hızlanır
            walkCycle: Math.random() * Math.PI * 2
        });
    }
}

function update() {
    if(!gameStarted || paused || userPaused) return;

    if(!player.isDying) {
        let moveDir = (keys.a ? -1 : (keys.d ? 1 : joyDir));
        player.shield = keys.s || shieldHeld;
        if(player.invuln > 0) player.invuln--;
        if(player.knock > 0) { player.knock--; player.vx *= 0.9; }   // vurulunca kısa süre geri savrulur
        else player.vx = moveDir ? moveDir * player.speed * (player.shield ? 0.5 : 1) : player.vx * 0.85;   // kalkanla yavaş yürür
        if(moveDir) player.dir = moveDir;
        // Adım hızı yürüme hızına bağlı: ayaklar yerde kaymaz
        if(player.grounded) player.legCycle += Math.abs(player.vx) * 0.06;

        player.vy += GRAVITY; 
        player.x += player.vx;
        player.y += player.vy;

        // Harita sınırları: zeminin dışına çıkılmasın
        player.x = Math.max(0, Math.min(player.x, WORLD_WIDTH - player.w));
        // Bir şekilde aşağı düşülürse öl
        if(player.y > height + 200) killPlayer();   // uçuruma düşmek can sormaz

        if(player.mouthOpen > 0) player.mouthOpen -= 0.05;
        updateHammer();

        player.grounded = false;
        for(let p of platforms) {
            if (player.x + player.w * 0.2 < p.x + p.w && player.x + player.w * 0.8 > p.x &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy + 10 && player.vy >= 0) {
                player.y = p.y - player.h; player.vy = 0; player.grounded = true;
            }
        }
    } else {
        player.y += 2; player.deathAngle += 0.05; player.opacity -= 0.01;
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= (1/60); });
    particles = particles.filter(p => p.life > 0);
    camX = player.x - width/2;

    items.forEach(it => {
        if(!it.collected && Math.hypot(player.x + player.w/2 - it.x, player.y + player.h/2 - it.y) < 100) {
            it.collected = true; 
            score += 5000; 
            $('score').innerText = score;
            $('sfx-pickup').currentTime = 0; $('sfx-pickup').play().catch(()=>{});
            player.mouthOpen = 1.0; 
            if(!playSfx('voice_pickup')) speak(t("voices")[Math.floor(Math.random()*t("voices").length)], "Kore");
            createParticle(it.x, it.y, t("pickup"), "#22c55e", 0.8);
        }
    });

    enemies.forEach(en => {
        if(en.dead) { if(en.deathT < DEATH_FRAMES) en.deathT++; return; }

        // --- Düşman hareketi ---
        const PATROL_RANGE = 250, CHASE_RANGE = 400, CHASE_DIST = 700;
        const enCenter = en.x + en.w / 2, plCenter = player.x + player.w / 2;
        const distToPlayer = plCenter - enCenter;
        let speed = en.speed;
        if(!player.isDying && Math.abs(distToPlayer) < CHASE_DIST) {
            // Oyuncu yakında: ona doğru yürü (ama bölgesinden fazla uzaklaşma)
            en.dir = Math.sign(distToPlayer) || en.dir;
            speed *= 1.4;
            if(Math.abs(en.x + en.dir * speed - en.homeX) > CHASE_RANGE) speed = 0;
            if(Math.abs(distToPlayer) < 20) speed = 0; // Tam üstündeyken titreme olmasın
        } else {
            // Devriye: bölge sınırına gelince geri dön
            if(en.x - en.homeX > PATROL_RANGE) en.dir = -1;
            else if(en.x - en.homeX < -PATROL_RANGE) en.dir = 1;
        }
        en.x += en.dir * speed;
        en.x = Math.max(0, Math.min(en.x, WORLD_WIDTH - en.w));
        en.walkCycle += speed * 0.08;   // Adım hızı yürüme hızına bağlı
        en.lastSpeed = speed;           // Çizimde "yürüyor mu / duruyor mu" için

        // Polis: oyuncu yakındaysa ve ona dönükse nişan alır, ardından ateş eder
        const toPlayer = (player.x + player.w / 2) - (en.x + en.w / 2);
        const near = !player.isDying && Math.abs(toPlayer) < 900;
        const facing = Math.sign(toPlayer) === en.dir;
        en.aim += ((near && facing ? 1 : 0) - en.aim) * 0.12;
        if(en.flash > 0) en.flash--;
        if(near && ++en.timer > en.interval && en.aim > 0.8) {
            en.timer = 0;
            en.flash = 6;
            projectiles.push({ type: 'bullet', x: en.x + en.w / 2 + en.dir * 60, y: en.y + 57,
                               vx: en.dir * 11, vy: 0, active: true, life: 140, angle: 0 });
            const pan = (en.x + en.w / 2 - camX - width / 2) / (width / 2);
            playGunshot(pan, Math.max(0.15, 0.6 - Math.abs(toPlayer) / 2000));
        }
        if(!player.isDying && player.x + 40 < en.x + en.w - 40 && player.x + player.w - 40 > en.x && player.y + player.h > en.y && player.y < en.y + en.h) {
            if(player.vy > 0 && player.y + player.h < en.y + 60) {
                player.vy = -18;
                killEnemy(en);   // üstüne zıplayınca ezilir
            } else die();
        }
    });

    playerProjectiles.forEach(p => {
        p.x += p.vx; p.vy += GRAVITY * 0.4; p.y += p.vy; p.angle += 0.2; p.life--;
        enemies.forEach(en => {
            if(!en.dead && p.active && p.x > en.x && p.x < en.x + en.w && p.y > en.y && p.y < en.y + en.h) {
                p.active = false;
                killEnemy(en);
            }
        });
        if(boss && !boss.dying && p.active && p.x > boss.x + 40 && p.x < boss.x + boss.w - 40 && p.y > boss.y && p.y < boss.y + boss.h) {
            p.active = false;
            damageBoss(1);
        }
    });
    playerProjectiles = playerProjectiles.filter(p => p.active && p.life > 0);

    projectiles.forEach(p => {
        p.x += p.vx; 
        if(p.type === 'fire') { updateFire(p); return; }
        if(p.type === 'wave') { updateWave(p); return; }
        if(p.type === 'dollar1') { updateOneDollar(p); return; }
        if(p.type === 'bullet') updateBullet(p);
    });
    projectiles = projectiles.filter(p => p.active && p.life > 0);
    updateBoss();
    updateGate();
    updateGrannies();
}

// --- BACAK ANİMASYONU (Recep ve polisler) ---
// Her bacak iki parçalı: kalça → diz → ayak bileği, ucunda ayakkabı.
// photoH: kafa resminin asıl yüksekliği (oran korunur); ratio: bacak boyu / kutu yüksekliği
const PLAYER_LEGS = {
    photoH: 1,
    ratio: 0.36, width: 13, swing: 0.65,          // bacak boyu, kalınlık, adım açısı
    front: "#475569", back: "#334155",            // füme takım pantolon (arka bacak daha koyu)
    shoe: "#111111"
};

// --- RECEP: fotoğraftan kafa + takım elbiseli gövde, kollar, bacaklar ---
// Koordinat: ayakların ortası (0,0), sağa bakar. Ön elde balyoz, arka elde "DİN" yazılı kalkan.
const RECEP_K = 0.45;                         // kafa fotoğrafının ölçeği
const RECEP_CHIN = 164 - RECEP_HEAD.y;        // fotoğrafta çenenin alt ucu (kafa kutusuna göre)

// Kalkan: altın kenarlı yeşil kalkan, üstünde DİN yazısı. dir: karakter aynalandıysa yazı ters dönmesin
function drawShield(ctx, x, y, s, dir = 1) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s * dir, s);
    ctx.beginPath();
    ctx.moveTo(-23, -29); ctx.lineTo(23, -29); ctx.lineTo(23, 4);
    ctx.quadraticCurveTo(22, 22, 0, 31); ctx.quadraticCurveTo(-22, 22, -23, 4);
    ctx.closePath();
    const g = ctx.createLinearGradient(-23, -29, 23, 31);
    g.addColorStop(0, "#166534"); g.addColorStop(1, "#052e16");
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = "#fbbf24"; ctx.lineWidth = 4; ctx.stroke();
    ctx.strokeStyle = "rgba(253,230,138,0.6)"; ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.moveTo(-18, -24); ctx.lineTo(18, -24); ctx.lineTo(18, 3);
    ctx.quadraticCurveTo(17, 18, 0, 25); ctx.quadraticCurveTo(-17, 18, -18, 3);
    ctx.closePath(); ctx.stroke();
    ctx.font = "bold 17px Georgia, serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.lineWidth = 3; ctx.strokeStyle = "#052e16"; ctx.strokeText("DİN", 0, 1);
    ctx.fillStyle = "#fde68a"; ctx.fillText("DİN", 0, 1);
    ctx.restore();
}

// o: { h, phase, moving, airborne, mouthOpen, hammerAngle, shield, dir }
function drawRecep(ctx, o) {
    const h = o.h, st = PLAYER_LEGS;
    const SUIT = "#334155", SUIT_D = "#1e293b", SKIN = "#e8b48f";
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const legs = drawLegs(ctx, 0, -h, h, 1, o.phase, o.moving, o.airborne, st);
    const top = -h + legs.drop;
    const hipY = top + h - h * st.ratio - st.width * 0.6;
    const shY = hipY - 50;

    // Arka kol: kalkan yanda asılı (kalkan kalkıkken en son, önde çizilir)
    const bsx = -10, bsy = shY + 8;
    if (!o.shield) {
        const sw = o.moving ? Math.sin(o.phase) * 5 : 0;
        const hx = bsx - 6 + sw, hy = bsy + 34;
        ctx.strokeStyle = SUIT_D; ctx.lineWidth = 11;
        ctx.beginPath(); ctx.moveTo(bsx, bsy); ctx.lineTo(bsx - 4 + sw / 2, bsy + 17); ctx.lineTo(hx, hy); ctx.stroke();
        drawShield(ctx, hx - 6, hy - 2, 0.72, o.dir);
        ctx.fillStyle = SKIN; ctx.beginPath(); ctx.arc(hx, hy - 10, 5.5, 0, Math.PI * 2); ctx.fill();
    }

    // Gövde: ceket, gömlek, kravat, düğmeler
    ctx.fillStyle = SUIT;
    ctx.beginPath();
    ctx.moveTo(-22, shY + 3); ctx.quadraticCurveTo(0, shY - 6, 24, shY + 3);
    ctx.lineTo(19, hipY + 4); ctx.lineTo(-17, hipY + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f8fafc";
    ctx.beginPath(); ctx.moveTo(-1, shY); ctx.lineTo(16, shY); ctx.lineTo(8, shY + 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#1e3a8a";
    ctx.beginPath(); ctx.moveTo(6, shY + 2); ctx.lineTo(10, shY + 2); ctx.lineTo(11, shY + 28); ctx.lineTo(8, shY + 33); ctx.lineTo(5, shY + 28); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = SUIT_D; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-1, shY); ctx.lineTo(8, shY + 24); ctx.lineTo(16, shY); ctx.stroke();
    ctx.fillStyle = "#0f172a";
    [36, 44].forEach(dy => { ctx.beginPath(); ctx.arc(9, shY + dy, 1.8, 0, Math.PI * 2); ctx.fill(); });

    // Kafa (fotoğraf): çene, yakanın hemen üstüne oturur
    const H = RECEP_HEAD, k = RECEP_K;
    ctx.save();
    ctx.translate(6 - (H.neckX - H.x) * k, shY + 8 - RECEP_CHIN * k);
    ctx.scale(k, k);
    if (headCanvas) ctx.drawImage(headCanvas, 0, 0);
    if (o.mouthOpen > 0.1) {
        const mx = H.mouthX - H.x, my = H.mouthY - H.y, m = o.mouthOpen;
        ctx.fillStyle = "black";
        ctx.beginPath(); ctx.ellipse(mx, my, 15 * m, 19 * m, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "white"; ctx.fillRect(mx - 5, my - 15 * m, 10, 5 * m);
    }
    ctx.restore();

    // Ön kol + balyoz: kol, balyozun açısına göre kalkar/iner
    const ang = o.hammerAngle;
    const armA = ang <= HAMMER_IDLE
        ? 0.5 + (HAMMER_IDLE - ang) / (HAMMER_IDLE - HAMMER_BACK) * 2.9    // geri kaldırırken kol yukarı
        : 0.5 + (ang - HAMMER_IDLE) / (HAMMER_DOWN - HAMMER_IDLE) * 0.8;   // indirirken kol öne
    const sx = 8, sy = shY + 7;
    const ex = sx + Math.sin(armA + 0.3) * 18, ey = sy + Math.cos(armA + 0.3) * 18;
    const hx = ex + Math.sin(armA - 0.3) * 18, hy = ey + Math.cos(armA - 0.3) * 18;
    ctx.strokeStyle = SUIT; ctx.lineWidth = 11;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
    drawHammer(ctx, hx, hy, ang);

    // Kalkan siper: arka kol öne uzanır, kalkan yüzü ve gövdeyi kapatır
    if (o.shield) {
        ctx.strokeStyle = SUIT_D; ctx.lineWidth = 11;
        ctx.beginPath(); ctx.moveTo(bsx, bsy); ctx.lineTo(10, bsy + 14); ctx.lineTo(26, shY + 4); ctx.stroke();
        drawShield(ctx, 32, shY - 6, 1.3, o.dir);
    }
}

// --- KALKAN İLE KORUNMA ---
// Kalkan kalkıkken oyuncunun baktığı yönden gelen mermi, alev ve dolarlar durur.
function shieldBlocks(p) {
    if (!player.shield || player.isDying) return false;
    // Hızlı gidenlerde (mermi) yönüne, yavaş düşenlerde (dolar, alev) konumuna bakılır
    if (Math.abs(p.vx || 0) > 2) return p.vx * player.dir < 0;
    return (p.x - (player.x + player.w / 2)) * player.dir > -5;
}
function blockProjectile(p) {
    p.active = false;
    for (let i = 0; i < 6; i++) {
        particles.push({ x: p.x, y: p.y, vx: -player.dir * (2 + Math.random() * 4), vy: (Math.random() - 0.5) * 6,
                         life: 0.35, maxLife: 0.35, size: 3 + Math.random() * 3, text: null, color: "#fde047" });
    }
    playSfx('hit', { rate: 1.8, vol: 0.45 });
}

// --- POLİS MERMİSİ ---
function updateBullet(p) {
    p.life--;
    if (player.isDying || !p.active) return;
    if (p.x > player.x + 20 && p.x < player.x + player.w - 20 && p.y > player.y && p.y < player.y + player.h) {
        if (shieldBlocks(p)) blockProjectile(p); else { p.active = false; die(); }
    }
}
function drawBullet(ctx, p) {
    const d = Math.sign(p.vx) || 1;
    const g = ctx.createLinearGradient(p.x - d * 36, p.y, p.x, p.y);
    g.addColorStop(0, "rgba(253,224,71,0)"); g.addColorStop(1, "rgba(253,224,71,0.85)");
    ctx.strokeStyle = g; ctx.lineWidth = 3; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(p.x - d * 36, p.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    ctx.fillStyle = "#facc15";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 6, 3, 0, 0, Math.PI * 2); ctx.fill();
}

// Silah sesi: Web Audio ile üretilen kısa, boğuk patlama (dosya gerekmez)
let gunBuffer = null;
function playGunshot(pan = 0, vol = 0.5) {
    if (!audioCtx) return;
    if (!gunBuffer) {
        const n = Math.floor(audioCtx.sampleRate * 0.28);
        gunBuffer = audioCtx.createBuffer(1, n, audioCtx.sampleRate);
        const d = gunBuffer.getChannelData(0);
        for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 5);
    }
    const src = audioCtx.createBufferSource(); src.buffer = gunBuffer;
    const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
    const g = audioCtx.createGain(); g.gain.value = vol;
    src.connect(lp); lp.connect(g);
    if (audioCtx.createStereoPanner) {
        const pn = audioCtx.createStereoPanner(); pn.pan.value = Math.max(-1, Math.min(1, pan));
        g.connect(pn); pn.connect(audioCtx.destination);
    } else g.connect(audioCtx.destination);
    src.start();
}

// Faza göre bir bacağın açıları: a = uyluk açısı (0 = dik, + = ileri), bend = diz bükümü
function legPose(phase, moving, airborne, swing) {
    if (airborne) return [{ a: 0.75, bend: 1.4 }, { a: -0.3, bend: 0.6 }];  // havada: bacaklar kırık
    if (!moving)  return [{ a: 0.08, bend: 0.06 }, { a: -0.08, bend: 0.06 }]; // ayakta duruş
    return [0, Math.PI].map(off => {
        const p = phase + off;
        // Öne doğru savrulurken (cos > 0) diz bükülür ve ayak yerden kalkar
        return { a: swing * Math.sin(p), bend: 0.12 + 1.1 * Math.max(0, Math.cos(p)) };
    });
}

function legJoints(hipX, hipY, len, leg) {
    const half = len / 2;
    const kx = hipX + Math.sin(leg.a) * half, ky = hipY + Math.cos(leg.a) * half;
    const s = leg.a - leg.bend;  // baldır uyluktan geriye kırılır (diz öne bakar)
    return { kx, ky, fx: kx + Math.sin(s) * half, fy: ky + Math.cos(s) * half, toe: Math.max(-0.5, Math.min(0.4, -s * 0.5)) };
}

function drawLeg(ctx, hipX, hipY, j, width, color, shoe) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(j.kx, j.ky);
    ctx.lineTo(j.fx, j.fy);
    ctx.stroke();
    // Ayakkabı: öne uzanan yuvarlak burun, kalkan ayakta hafif eğik
    ctx.save();
    ctx.translate(j.fx, j.fy);
    ctx.rotate(j.toe);
    ctx.fillStyle = shoe;
    ctx.beginPath();
    ctx.ellipse(width * 0.45, width * 0.2, width * 1.0, width * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Kutunun (top-center = cx, topY; yükseklik h) alt kısmına bacakları çizer.
// Dönüş: { k: fotoğrafın asıl boyutuna göre ölçeği, drop: gövdenin adımlarla inip kalkma miktarı }
function drawLegs(ctx, cx, topY, h, dir, phase, moving, airborne, style) {
    const legSpace = h * style.ratio;
    const k = (h - legSpace) / style.photoH;        // fotoğraf kalan alana orantılı sığar
    const hipY = h - legSpace - style.width * 0.6;  // kalça çenenin hemen arkasında
    const len = h - style.width * 0.7 - hipY;       // ayakkabı tabanı tam zemine değsin
    const pose = legPose(phase, moving, airborne, style.swing);
    const hips = [3, -3];
    const joints = pose.map((leg, i) => legJoints(hips[i], hipY, len, leg));

    // Yerdeyken en alttaki ayak zemine bassın: gövde buna göre iner (doğal sallanma)
    const drop = airborne ? 0 : (hipY + len) - Math.max(joints[0].fy, joints[1].fy);

    ctx.save();
    ctx.translate(cx, topY + drop);
    ctx.scale(dir, 1);
    drawLeg(ctx, hips[1], hipY, joints[1], style.width, style.back, style.shoe);   // arka bacak önce
    drawLeg(ctx, hips[0], hipY, joints[0], style.width, style.front, style.shoe);
    ctx.restore();
    return { k, drop };
}

// Balyoz, oyuncunun merkezine göre piksel koordinatında (hx, hy) eldeki noktadan çizilir
function drawHammer(ctx, hx, hy, angle) {
    const L = 130;
    ctx.save();
    ctx.translate(hx, hy);            // el
    ctx.scale(0.94, 0.94);
    ctx.rotate(angle);
    // Sap
    ctx.fillStyle = "#8b5a2b";
    ctx.strokeStyle = "#5c3a1a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-5, -L, 10, L + 12, 4); ctx.fill(); ctx.stroke();
    // Demir baş
    const g = ctx.createLinearGradient(0, -L - 18, 0, -L + 18);
    g.addColorStop(0, "#9ca3af"); g.addColorStop(0.5, "#4b5563"); g.addColorStop(1, "#1f2937");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#111827";
    ctx.beginPath(); ctx.roundRect(-24, -L - 16, 48, 32, 5); ctx.fill(); ctx.stroke();
    // Sapı tutan yumruk
    ctx.fillStyle = "#e8b48f";
    ctx.strokeStyle = "#7c4a2d";
    ctx.beginPath(); ctx.arc(0, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
}

function drawBoss(ctx, b) {
    b.T.draw(ctx, b);
    if(!b.dying) {
        const name = t(b.T.nameKey);
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";
        ctx.lineWidth = 5; ctx.strokeStyle = "#000";
        const ly = b.y - (b.T.labelY || 35);   // isim, canavarın başının üstünde
        ctx.strokeText(name, b.x + b.w / 2, ly);
        ctx.fillStyle = "#fde047";
        ctx.fillText(name, b.x + b.w / 2, ly);
    }
    drawSpeech(ctx, b);
}

// Canavar ölürken küçülür, vurulunca yanıp söner (orijin: ayakların ortası)
function bossBaseTransform(ctx, b, lift = 0) {
    ctx.translate(b.x + b.w / 2, b.y + b.h - lift);
    const shrink = (b.dying ? Math.max(0, 1 - b.deathT / 60) : 1) * ((b.T && b.T.scale) || 1);
    ctx.scale(shrink, shrink);
    if(b.hurt > 0 && Math.floor(b.hurt / 4) % 2 === 0) ctx.globalAlpha = 0.45;
}

// ALEVİ: alevden bir adam. Bacakları, kaslı gövdesi, yumrukları ve insan yüzü var; saçı alev alev yanar.
// Saldırıdan önce kollarını havaya kaldırır, yumruklarındaki alevler büyür ve ağzını açar.
function drawAlevi(ctx, b) {
    const t0 = b.anim, W = b.T.dw, H = b.T.dh;
    const talk = b.talk > 0 ? Math.abs(Math.sin(b.anim * 0.45)) : 0;               // konuşma
    const charge = Math.max(b.charge > 0 ? 1 - b.charge / 30 : 0, talk * 0.5);   // saldırı hazırlığı 0→1
    const flick = i => Math.sin(t0 * 0.25 + i * 1.7);
    const step = Math.sin(t0 * 0.09);                      // ağır adımlar
    ctx.save();
    bossBaseTransform(ctx, b);

    // Arkadaki sıcak hale
    const halo = ctx.createRadialGradient(0, -H * 0.55, 20, 0, -H * 0.55, H * 0.65);
    halo.addColorStop(0, "rgba(251,146,60,0.45)"); halo.addColorStop(1, "rgba(251,146,60,0)");
    ctx.fillStyle = halo;
    ctx.fillRect(-H * 0.65, -H * 1.2, H * 1.3, H * 1.3);

    ctx.shadowColor = "#f97316"; ctx.shadowBlur = 30;
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    const hipY = -H * 0.4, shY = -H * 0.7;

    // Bacaklar: kalça → diz → ayak; ayaklarda küçük alevler
    [-1, 1].forEach(s => {
        const hx = s * W * 0.11, fx = s * W * 0.14 + s * step * 10, kx = (hx + fx) / 2 + 6, ky = hipY * 0.48 - Math.max(0, s * step) * 8;
        ctx.strokeStyle = "#c2410c"; ctx.lineWidth = 36;
        ctx.beginPath(); ctx.moveTo(hx, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, -12); ctx.stroke();
        ctx.strokeStyle = "#fb923c"; ctx.lineWidth = 14;
        ctx.beginPath(); ctx.moveTo(hx, hipY + 8); ctx.lineTo(kx, ky); ctx.lineTo(fx, -16); ctx.stroke();
        ctx.fillStyle = "#7f1d1d";
        ctx.beginPath(); ctx.ellipse(fx + s * 4, -8, 26, 11, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fde047"; flameTongue(ctx, fx + s * 4, -10, 22, 26 + 8 * flick(s * 3), flick(s) * 6);
    });

    // Gövde: geniş omuzlar, dar bel; kas çizgileri
    const body = ctx.createLinearGradient(0, shY, 0, hipY);
    body.addColorStop(0, "#f97316"); body.addColorStop(1, "#b91c1c");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.moveTo(-W * 0.3, shY);
    ctx.quadraticCurveTo(0, shY - 14, W * 0.3, shY);
    ctx.quadraticCurveTo(W * 0.26, (shY + hipY) / 2, W * 0.15, hipY);
    ctx.lineTo(-W * 0.15, hipY);
    ctx.quadraticCurveTo(-W * 0.26, (shY + hipY) / 2, -W * 0.3, shY);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur = 0;
    const core = ctx.createRadialGradient(0, -H * 0.6, 4, 0, -H * 0.6, W * 0.22);
    core.addColorStop(0, "rgba(254,240,138,0.9)"); core.addColorStop(1, "rgba(254,240,138,0)");
    ctx.fillStyle = core;
    ctx.beginPath(); ctx.arc(0, -H * 0.6, W * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(127,29,29,0.75)"; ctx.lineWidth = 4;
    ctx.beginPath();                                                   // göğüs kasları
    ctx.moveTo(-W * 0.2, shY + 22); ctx.quadraticCurveTo(-W * 0.1, shY + 52, 0, shY + 40);
    ctx.quadraticCurveTo(W * 0.1, shY + 52, W * 0.2, shY + 22);
    ctx.moveTo(0, shY + 40); ctx.lineTo(0, hipY - 8);                  // karın
    for (let r = 0; r < 3; r++) { const y = shY + 64 + r * 18; ctx.moveTo(-W * 0.08, y); ctx.lineTo(W * 0.08, y); }
    ctx.stroke();
    // Kemer
    ctx.fillStyle = "#450a0a"; ctx.fillRect(-W * 0.16, hipY - 10, W * 0.32, 14);
    ctx.fillStyle = "#fbbf24"; ctx.fillRect(-10, hipY - 9, 20, 12);

    // Kollar: omuz → dirsek → yumruk. Saldırıdan önce yukarı kalkar.
    ctx.shadowColor = "#f97316"; ctx.shadowBlur = 25;
    [-1, 1].forEach(s => {
        const sx = s * W * 0.3, sy = shY + 10;
        const a1 = 0.3 + charge * 2.3 + Math.sin(t0 * 0.06 + s) * 0.05;  // aşağıdan dışa doğru açı
        const a2 = a1 - 0.45 * (1 - charge);
        const ex = sx + s * Math.sin(a1) * 66, ey = sy + Math.cos(a1) * 66;
        const hx = ex + s * Math.sin(a2) * 60, hy = ey + Math.cos(a2) * 60;
        ctx.strokeStyle = "#ea580c"; ctx.lineWidth = 28;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.strokeStyle = "#fdba74"; ctx.lineWidth = 9;
        ctx.beginPath(); ctx.moveTo(sx, sy + 4); ctx.lineTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.fillStyle = "#c2410c";
        ctx.beginPath(); ctx.arc(hx, hy, 17, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#f97316"; flameTongue(ctx, hx, hy, 30 + charge * 22, 40 + charge * 60 + 8 * flick(s), flick(s + 2) * 8);
        ctx.fillStyle = "#fde047"; flameTongue(ctx, hx, hy, 14 + charge * 10, 22 + charge * 36, flick(s + 4) * 5);
    });

    // Boyun + alev saçlar (yüzün arkasında)
    const fy = -H * 0.8;
    ctx.fillStyle = "#ea580c"; ctx.fillRect(-18, fy + 30, 36, shY - fy - 26);
    [["#b91c1c", 1], ["#f97316", 0.8], ["#fde047", 0.55]].forEach(([col, f], li) => {
        ctx.fillStyle = col;
        for (let i = -3; i <= 3; i++) flameTongue(ctx, i * 12, fy - 26, 26 * f, (52 + 14 * flick(i + li)) * f, flick(i * 2 + li) * 10);
    });
    ctx.shadowBlur = 0;

    // Yüz: insan yüzü, akkor gibi parlayan ten
    const skin = ctx.createRadialGradient(0, fy - 4, 6, 0, fy, 48);
    skin.addColorStop(0, "#fed7aa"); skin.addColorStop(1, "#f97316");
    ctx.fillStyle = skin;
    [-1, 1].forEach(s => { ctx.beginPath(); ctx.ellipse(s * 39, fy + 2, 8, 13, 0, 0, Math.PI * 2); ctx.fill(); });   // kulaklar
    ctx.beginPath(); ctx.ellipse(0, fy, 38, 46, 0, 0, Math.PI * 2); ctx.fill();
    [-1, 1].forEach(s => {
        const ex = s * 15, ey = fy - 6;
        ctx.fillStyle = "#fffbeb";
        ctx.beginPath(); ctx.ellipse(ex, ey, 10, 7, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1c1917";
        ctx.beginPath(); ctx.arc(ex + b.look * 4, ey + 1, 4.5, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#7f1d1d"; ctx.lineWidth = 6; ctx.lineCap = "round";        // çatık kaşlar
        ctx.beginPath(); ctx.moveTo(s * 28, ey - 17); ctx.lineTo(s * 5, ey - 9); ctx.stroke();
    });
    ctx.strokeStyle = "#9a3412"; ctx.lineWidth = 3;                                    // burun
    ctx.beginPath(); ctx.moveTo(b.look * 2, fy - 4); ctx.lineTo(b.look * 7, fy + 12); ctx.lineTo(0, fy + 15); ctx.stroke();
    // Ağız: normalde somurtur, saldırırken bağırır
    const my = fy + 28;
    if (charge > 0.05) {
        const mh = 4 + charge * 14;
        ctx.fillStyle = "#450a0a";
        ctx.beginPath(); ctx.ellipse(0, my, 15, mh, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fffbeb"; ctx.fillRect(-11, my - mh + 1, 22, Math.min(5, mh * 0.5));
    } else {
        ctx.strokeStyle = "#7f1d1d"; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.moveTo(-14, my + 3); ctx.quadraticCurveTo(0, my - 5, 14, my + 3); ctx.stroke();
    }
    ctx.restore();
}

// KURT: iki ayağı üstünde kambur duran, kıllı bir insan (sağa bakar, sola dönünce aynalanır).
// Kurt bacakları (parmak ucunda basar, bilek yerden yüksek), yırtık kot şort, pençeli uzun kollar,
// gür saçlı, sakallı insan yüzü.
function drawKurt(ctx, b) {
    const W = b.T.dw, H = b.T.dh, c = b.crouch, air = b.state === 'leap';   // tasarım boyutu
    const talk = b.talk > 0 && Math.sin(b.anim * 0.45) > 0;   // konuşurken çene açılıp kapanır
    const angry = b.state === 'crouch' || b.state === 'dash' || talk;
    const moving = b.state === 'dash' || (b.state === 'walk' && Math.abs((player.x + player.w / 2) - (b.x + b.w / 2)) > 220);
    const run = b.run, dash = b.state === 'dash';
    const FUR = "#6b6259", FUR_D = "#4a433d", FUR_L = "#b8afa6";
    ctx.save();
    bossBaseTransform(ctx, b);
    ctx.scale(b.dir, 1);
    ctx.lineCap = "round"; ctx.lineJoin = "round";

    const lean = dash ? 46 : moving ? 24 : 12;                          // öne eğilme
    const hipX = -12, hipY = -H * 0.42 + c * 34 + (moving ? -Math.abs(Math.sin(run)) * 6 : 0);
    const S = { x: hipX + 24 + lean, y: -H * 0.76 + c * 40 };           // omuz
    const L = 70;                                                       // uyluk = baldır

    // Bacak: kalça → diz (öne kırık) → bilek (yerden yüksek) → pati
    const leg = (s, col) => {
        const p = run + (s > 0 ? 0 : Math.PI);
        let fx, fy;
        if (air) { fx = hipX + (s > 0 ? 44 : -18); fy = hipY + 110; }
        else if (moving) { fx = hipX + Math.sin(p) * (dash ? 62 : 40); fy = -Math.max(0, Math.cos(p)) * 26; }
        else { fx = hipX + s * 16; fy = 0; }
        const ax = fx - 24, ay = fy - 36;
        const dx = ax - hipX, dy = ay - hipY, d = Math.hypot(dx, dy) || 1;
        const bend = Math.sqrt(Math.max(0, L * L - (d / 2) ** 2));
        const kx = (hipX + ax) / 2 + (dy / d) * bend, ky = (hipY + ay) / 2 - (dx / d) * bend;
        ctx.strokeStyle = col;
        ctx.lineWidth = 30; ctx.beginPath(); ctx.moveTo(hipX, hipY); ctx.lineTo(kx, ky); ctx.stroke();
        ctx.lineWidth = 19; ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(ax, ay); ctx.stroke();
        ctx.lineWidth = 15; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(fx + 12, fy - 5); ctx.stroke();
        ctx.fillStyle = "#e7e5e4";                                      // ayak pençeleri
        for (let k = 0; k < 3; k++) {
            ctx.beginPath(); ctx.moveTo(fx + 14 + k * 4, fy - 9 + k * 3); ctx.lineTo(fx + 30 + k * 2, fy - 2 + k * 2); ctx.lineTo(fx + 14 + k * 4, fy - 1 + k * 2); ctx.closePath(); ctx.fill();
        }
    };

    // Kol: omuz → dirsek → pençeli el. Yürürken bacakların tersine sallanır,
    // hazırlıkta pençeler öne kalkar, atılmada geride, sıçramada havada.
    const arm = (s, col) => {
        const p = run + (s > 0 ? Math.PI : 0);
        let a1;
        if (air) a1 = 2.6 + s * 0.15;
        else if (b.state === 'crouch') a1 = 1.7 + s * 0.2;
        else if (dash) a1 = -0.9 + Math.sin(p * 2) * 0.3;
        else if (moving) a1 = 0.3 + Math.sin(p) * 0.6;
        else a1 = 0.35 + s * 0.1 + Math.sin(b.anim * 0.05) * 0.05;
        const a2 = a1 + 0.6;
        const sx = S.x + 4, sy = S.y + 10;
        const ex = sx + Math.sin(a1) * 66, ey = sy + Math.cos(a1) * 66;
        const hx = ex + Math.sin(a2) * 60, hy = ey + Math.cos(a2) * 60;
        ctx.strokeStyle = col;
        ctx.lineWidth = 24; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.lineWidth = 18; ctx.beginPath(); ctx.moveTo(ex, ey); ctx.lineTo(hx, hy); ctx.stroke();
        ctx.fillStyle = col; ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = "#f5f5f4"; ctx.lineWidth = 3.5;
        for (let k = -1; k <= 1; k++) {
            const a = a2 + k * 0.4;
            ctx.beginPath(); ctx.moveTo(hx + Math.sin(a) * 9, hy + Math.cos(a) * 9); ctx.lineTo(hx + Math.sin(a) * 27, hy + Math.cos(a) * 27); ctx.stroke();
        }
    };

    arm(-1, FUR_D);                     // uzaktaki kol ve bacak (koyu) önce
    leg(-1, FUR_D);

    // Kuyruk: kalçanın arkasından gür, sallanan
    const tw = Math.sin(b.anim * 0.15) * 10;
    ctx.fillStyle = FUR;
    ctx.beginPath();
    ctx.moveTo(hipX - 26, hipY - 16);
    ctx.quadraticCurveTo(hipX - 80, hipY - 10 + tw, hipX - 96, hipY + 50 + tw);
    ctx.quadraticCurveTo(hipX - 60, hipY + 20 + tw, hipX - 20, hipY + 10);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = FUR_L;
    ctx.beginPath(); ctx.ellipse(hipX - 94, hipY + 46 + tw, 7, 12, 0.5, 0, Math.PI * 2); ctx.fill();

    // Gövde: kambur sırt, geniş göğüs
    ctx.fillStyle = FUR;
    ctx.beginPath();
    ctx.moveTo(hipX - 36, hipY + 8);
    ctx.quadraticCurveTo(hipX - 44, (hipY + S.y) / 2, S.x - 40, S.y - 14);
    ctx.quadraticCurveTo(S.x, S.y - 34, S.x + 40, S.y + 6);
    ctx.quadraticCurveTo(S.x + 30, (hipY + S.y) / 2 + 20, hipX + 34, hipY + 4);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = FUR_L;                                              // açık renk göğüs ve karın
    ctx.beginPath(); ctx.ellipse((hipX + S.x) / 2 + 18, (hipY + S.y) / 2 + 6, 24, (hipY - S.y) * 0.42, -0.25, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(74,67,61,0.7)"; ctx.lineWidth = 3;          // kas çizgileri
    ctx.beginPath();
    ctx.moveTo(S.x - 6, S.y + 26); ctx.quadraticCurveTo(S.x + 14, S.y + 40, S.x + 30, S.y + 22);
    for (let r = 0; r < 3; r++) { const y = S.y + 54 + r * 17; ctx.moveTo((hipX + S.x) / 2 + 6, y); ctx.lineTo((hipX + S.x) / 2 + 28, y - 3); }
    ctx.stroke();
    ctx.fillStyle = FUR_D;                                              // sırttaki diken tüyler
    for (let i = 0; i < 7; i++) {
        const k = i / 6, x = hipX - 38 + (S.x - 40 - hipX + 38) * k, y = hipY + (S.y - 16 - hipY) * k;
        ctx.beginPath(); ctx.moveTo(x - 4, y + 10); ctx.lineTo(x - 22, y - 8 - i); ctx.lineTo(x + 10, y + 2); ctx.closePath(); ctx.fill();
    }

    leg(1, FUR);                        // yakındaki bacak

    // Yırtık kot şort (kalan son insanlık izi)
    ctx.fillStyle = "#1d4ed8";
    ctx.beginPath();
    ctx.moveTo(hipX - 40, hipY - 20); ctx.lineTo(hipX + 38, hipY - 22); ctx.lineTo(hipX + 44, hipY + 26);
    for (let i = 0; i <= 6; i++) ctx.lineTo(hipX + 44 - i * 14, hipY + 26 + (i % 2 ? 14 : 0));
    ctx.lineTo(hipX - 44, hipY + 22);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#93c5fd"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(hipX - 6, hipY - 18); ctx.lineTo(hipX - 2, hipY + 18); ctx.moveTo(hipX + 20, hipY + 4); ctx.lineTo(hipX + 32, hipY + 12); ctx.stroke();
    ctx.fillStyle = "#422006"; ctx.fillRect(hipX - 40, hipY - 22, 80, 7);   // kemer

    // Boyun ve yele
    const hx = S.x + 40, hy = S.y - 30 + c * 10;
    ctx.fillStyle = FUR;
    ctx.beginPath(); ctx.moveTo(S.x - 30, S.y); ctx.lineTo(hx - 24, hy - 20); ctx.lineTo(hx + 10, hy + 24); ctx.lineTo(S.x + 34, S.y + 20); ctx.closePath(); ctx.fill();
    ctx.fillStyle = FUR_D;
    for (let i = 0; i < 5; i++) {
        const x = S.x - 26 + i * 12, y = S.y - 10 - i * 6;
        ctx.beginPath(); ctx.moveTo(x - 6, y + 10); ctx.lineTo(x - 16, y - 14); ctx.lineTo(x + 8, y + 4); ctx.closePath(); ctx.fill();
    }

    // Kıllı insan kafası (sağa bakar; orijin kafanın merkezi): gür saç, favori ve sakal, insan yüzü
    ctx.save();
    ctx.translate(hx - 10, hy + 4);
    const SKIN = "#c99a6e", SKIN_D = "#9c6f4a";
    ctx.fillStyle = FUR_D;                                              // arkadaki gür, dağınık saç
    ctx.beginPath(); ctx.ellipse(-10, -6, 42, 44, 0, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 8; i++) {
        const a = -2.6 + i * 0.42, r = 44;
        ctx.beginPath(); ctx.moveTo(-10 + Math.cos(a) * (r - 14), -6 + Math.sin(a) * (r - 14));
        ctx.lineTo(-10 + Math.cos(a + 0.12) * (r + 16), -6 + Math.sin(a + 0.12) * (r + 16));
        ctx.lineTo(-10 + Math.cos(a + 0.3) * (r - 10), -6 + Math.sin(a + 0.3) * (r - 10)); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = SKIN;                                               // yüz
    ctx.beginPath(); ctx.ellipse(10, 6, 30, 36, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(-16, 4, 7, 11, 0, 0, Math.PI * 2); ctx.fill();   // kulak
    ctx.strokeStyle = SKIN_D; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(-16, 4, 4, -1.2, 1.4); ctx.stroke();
    ctx.fillStyle = FUR;                                                // favoriler + yanaklara kadar sakal
    ctx.beginPath();
    ctx.moveTo(-8, -6); ctx.lineTo(-4, 26); ctx.quadraticCurveTo(10, 50, 30, 44);
    ctx.lineTo(40, 30); ctx.lineTo(36, 26); ctx.quadraticCurveTo(22, 36, 12, 26); ctx.lineTo(6, 4);
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle = FUR_D; ctx.lineWidth = 2;                         // sakal kılları
    for (let i = 0; i < 9; i++) { const x = -4 + i * 4.5, y = 28 + Math.sin(i) * 6; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 2, y + 9); ctx.stroke(); }
    ctx.fillStyle = FUR_D;                                              // alına düşen perçemler
    ctx.beginPath(); ctx.moveTo(-12, -30); ctx.lineTo(34, -32); ctx.lineTo(28, -20); ctx.lineTo(22, -26); ctx.lineTo(16, -16); ctx.lineTo(8, -24); ctx.lineTo(0, -14); ctx.lineTo(-6, -22); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = "#2a2522"; ctx.lineWidth = 6; ctx.lineCap = "round";   // gür, birleşik kaş
    ctx.beginPath(); ctx.moveTo(6, angry ? -14 : -12); ctx.lineTo(22, angry ? -6 : -10); ctx.lineTo(38, angry ? -13 : -11); ctx.stroke();
    ctx.fillStyle = "#fff";                                             // göz: saldırıda sarı-kırmızı parlar
    ctx.beginPath(); ctx.ellipse(27, -2, 7, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = angry ? "#ef4444" : "#ca8a04";
    if (angry) { ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 12; }
    ctx.beginPath(); ctx.arc(29, -2, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#111"; ctx.beginPath(); ctx.arc(29.5, -2, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = SKIN; ctx.strokeStyle = SKIN_D; ctx.lineWidth = 2;  // burun
    ctx.beginPath(); ctx.moveTo(36, 0); ctx.quadraticCurveTo(48, 14, 42, 18); ctx.lineTo(34, 16); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = FUR_D;                                              // bıyık
    ctx.beginPath(); ctx.ellipse(32, 22, 11, 4, 0.15, 0, Math.PI * 2); ctx.fill();
    if (angry) {                                                        // hırlayan ağız, sivri dişler
        ctx.fillStyle = "#5b1010";
        ctx.beginPath(); ctx.ellipse(30, 30, 10, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#fff";
        [[23, 26], [35, 26]].forEach(([x, y]) => { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + 4, y); ctx.lineTo(x + 2, y + 7); ctx.closePath(); ctx.fill(); });
    } else {
        ctx.strokeStyle = "#5b3a24"; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(24, 30); ctx.lineTo(37, 29); ctx.stroke();
    }
    ctx.restore();

    arm(1, FUR);                        // yakındaki kol en önde
    ctx.restore();
}

// Şok dalgası: zeminde ilerleyen toz ve taş kabarması
function drawWave(ctx, p) {
    const fade = Math.min(1, p.life / 20);
    ctx.save();
    ctx.globalAlpha = 0.85 * fade;
    ctx.fillStyle = "#a16207";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 34, 40 * fade, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#d6d3d1";
    for(let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.arc(p.x + i * 14 - Math.sign(p.vx) * 4, p.y - 22 * fade - Math.abs(i) * -8, 6, 0, Math.PI * 2); ctx.fill();
    }
