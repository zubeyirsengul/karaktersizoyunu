}

// Recep'in resminden sadece kafa alınır (gövdesi bacaklarla çakışmasın).
// Koordinatlar recep.jpg (194x259) piksellerinde: x,y,w,h = kafanın kutusu;
// clip = çene hattını izleyen kesim (soldaki ceket ve alttaki atkı dışarıda kalır).
const RECEP_HEAD = {
    x: 36, y: 8, w: 120, h: 162,
    neckX: 115,                 // bacakların bağlandığı nokta (çenenin altı)
    mouthX: 122, mouthY: 146,   // ağız açılma efekti
    handX: 150, handY: 156,     // balyozu tutan el
    clip: [[0,0],[194,0],[194,150],[150,152],[142,158],[132,163],[120,164],[108,168],[98,165],
           [88,160],[78,157],[68,154],[64,145],[63,132],[55,128],[0,128]]
};
let headCanvas = null;
function prepareHead() {
    const H = RECEP_HEAD, c = document.createElement('canvas');
    c.width = H.w; c.height = H.h;
    const x = c.getContext('2d');
    x.translate(-H.x, -H.y);
    x.beginPath();
    H.clip.forEach(([px, py], i) => i ? x.lineTo(px, py) : x.moveTo(px, py));
    x.closePath();
    x.clip();
    x.drawImage(imgPlayer, 0, 0);
    headCanvas = c;
}

// Fotoğrafın şeffaf kenarlarını bul ki karakter kutusuna tam otursun (havada durmasın, kaymasın).
// Dosya bilgisayardan (file://) açıldığında tarayıcı piksel okumaya izin vermeyebilir: o zaman resmin tamamı kullanılır.
function opaqueBounds(img) {
    const full = { sx: 0, sy: 0, sw: img.naturalWidth || img.width, sh: img.naturalHeight || img.height };
    try {
        const c = document.createElement('canvas');
        c.width = full.sw; c.height = full.sh;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        const d = x.getImageData(0, 0, c.width, c.height).data;
        let top = -1, bot = -1, left = c.width, right = -1;
        for (let y = 0; y < c.height; y++) {
            for (let X = 0; X < c.width; X++) {
                if (d[(y * c.width + X) * 4 + 3] > 40) {
                    if (top < 0) top = y;
                    bot = y;
                    if (X < left) left = X;
                    if (X > right) right = X;
                }
            }
        }
        return top < 0 ? full : { sx: left, sy: top, sw: right - left + 1, sh: bot - top + 1 };
    } catch (e) {
        return full;
    }
}
// Halk fotoğrafı JPG (şeffaflık yok): kenarlardan başlayıp arka plan rengine yakın pikselleri siler.
// Piksel okumaya izin verilmezse (file://) orijinal resim kullanılır.
function removeBackground(img, tolerance = 14) {
    try {
        const c = document.createElement('canvas');
        const W = c.width = img.naturalWidth, H = c.height = img.naturalHeight;
        const x = c.getContext('2d');
        x.drawImage(img, 0, 0);
        const data = x.getImageData(0, 0, W, H), d = data.data;
        const bg = [d[0], d[1], d[2]];   // sol üst köşe = arka plan rengi
        // Arka plan nötr gri: rengi bg'ye yakın VE renksiz olan pikseller (koyu saç / mor şort korunur)
        const isBg = i => {
            const r = d[i], g = d[i+1], bl = d[i+2];
            return Math.abs(r - bg[0]) < tolerance && Math.abs(g - bg[1]) < tolerance && Math.abs(bl - bg[2]) < tolerance &&
                   Math.max(r, g, bl) - Math.min(r, g, bl) <= 5;
        };
        const seen = new Uint8Array(W * H), stack = [];
        for (let X = 0; X < W; X++) stack.push(X, (H - 1) * W + X);
        for (let Y = 0; Y < H; Y++) stack.push(Y * W, Y * W + W - 1);
        while (stack.length) {
            const p = stack.pop();
            if (seen[p]) continue;
            seen[p] = 1;
            if (!isBg(p * 4)) continue;
            d[p * 4 + 3] = 0;
            const px = p % W;
            if (px > 0) stack.push(p - 1);
            if (px < W - 1) stack.push(p + 1);
            if (p >= W) stack.push(p - W);
            if (p < W * (H - 1)) stack.push(p + W);
        }
        x.putImageData(data, 0, 0);
        return c;
    } catch (e) {
        return img;
    }
}

// TTS exponential backoff implementation
// Aynı anda tek konuşma; geç gelen ses anlamsız olacağı için en fazla 1 kısa tekrar
let speaking = false;
async function speak(text, voice = "Kore") {
    if (!apiKey || speaking) return;
    speaking = true;
    try {
        for (let attempt = 0; attempt < 2; attempt++) {
            const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-tts:generateContent?key=${encodeURIComponent(apiKey)}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: [{ text: text }] }],
                    generationConfig: {
                        responseModalities: ["AUDIO"],
                        speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: voice } } }
                    }
                })
            });
            if (response.ok) {
                const result = await response.json();
                const pcmData = result?.candidates?.[0]?.content?.parts?.[0]?.inlineData?.data;
                if (pcmData) {
                    const url = URL.createObjectURL(pcmToWav(pcmData, 24000));
                    const audio = new Audio(url);
                    audio.onended = () => URL.revokeObjectURL(url);
                    audio.play().catch(() => {});
                }
                return;
            }
            // Sadece geçici hatalarda (çok istek / sunucu) tekrar dene
            if (response.status !== 429 && response.status < 500) return;
            await new Promise(res => setTimeout(res, 1000));
        }
    } catch (e) {
        // Ağ hatası: sessizce geç
    } finally {
        speaking = false;
    }
}

function pcmToWav(b64, rate) {
    const bin = atob(b64), bytes = new Uint8Array(bin.length);
    for (let i=0; i<bin.length; i++) bytes[i] = bin.charCodeAt(i);
    const head = new ArrayBuffer(44), v = new DataView(head);
    v.setUint32(0, 0x52494646, false); v.setUint32(4, 36+bin.length, true); v.setUint32(8, 0x57415645, false);
    v.setUint32(12, 0x666d7420, false); v.setUint16(16, 16, true); v.setUint16(20, 1, true);
    v.setUint16(22, 1, true); v.setUint32(24, rate, true); v.setUint32(28, rate*2, true);
    v.setUint16(32, 2, true); v.setUint16(34, 16, true); v.setUint32(36, 0x64617461, false); v.setUint32(40, bin.length, true);
    return new Blob([head, bytes], { type: 'audio/wav' });
}

function drawKulHakkiBag(ctx, x, y, size, angle = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#d4b483"; 
    ctx.beginPath();
    ctx.moveTo(-size/2, size/2);
    ctx.quadraticCurveTo(-size/1.5, -size/2, 0, -size/1.8);
    ctx.quadraticCurveTo(size/1.5, -size/2, size/2, size/2);
    ctx.closePath();
    ctx.fill();
    ctx.fillStyle = "#c2a373";
    ctx.fillRect(-size/6, -size/1.6, size/3, size/10);

}

function drawCashRegister(ctx, x, y, size, angle = 0) {
    const k = size / 55;
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.scale(k, k);
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#1f2937";
    // Para çekmecesi
    ctx.fillStyle = "#374151";
    ctx.beginPath(); ctx.roundRect(-30, 8, 60, 18, 3); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#9ca3af";
    ctx.fillRect(-9, 15, 18, 4);
    // Eğik tuş paneli
    ctx.fillStyle = "#d1d5db";
    ctx.beginPath();
    ctx.moveTo(-28, 8); ctx.lineTo(28, 8); ctx.lineTo(21, -14); ctx.lineTo(-21, -14);
    ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#4b5563";
    for (let r = 0; r < 3; r++)
        for (let c = 0; c < 4; c++) ctx.fillRect(-17 + c * 9, -10 + r * 6, 6, 4);
    // Ekran
    ctx.fillStyle = "#6b7280";
    ctx.fillRect(-4, -18, 8, 4);
    ctx.fillStyle = "#111827";
    ctx.beginPath(); ctx.roundRect(-16, -32, 32, 15, 2); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#22c55e";
    ctx.font = "bold 10px monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("₺999", 0, -24);
    ctx.restore();
}

// Alttan yuvarlak, ucu yukarı sivrilen tek alev dili (taban: cx, baseY)
function flameTongue(ctx, cx, baseY, w, h, lean = 0) {
    ctx.beginPath();
    ctx.moveTo(cx - w / 2, baseY);
    ctx.bezierCurveTo(cx - w / 2, baseY - h * 0.5, cx + lean - w * 0.15, baseY - h * 0.7, cx + lean, baseY - h);
    ctx.bezierCurveTo(cx + lean + w * 0.15, baseY - h * 0.7, cx + w / 2, baseY - h * 0.5, cx + w / 2, baseY);
    ctx.quadraticCurveTo(cx, baseY + w * 0.35, cx - w / 2, baseY);
    ctx.fill();
}

const FIRE_COLORS = ["#dc2626", "#f97316", "#fde047"];

// ALEVİ'nin attığı alev: havadayken kuyruklu top, yere düşünce bir süre yanan ateş
function drawFire(ctx, p) {
    ctx.save();
    if (p.grounded) {
        ctx.globalAlpha = Math.min(1, p.life / 30);   // sönerken solar
        FIRE_COLORS.forEach((col, i) => {
            const sc = 1 - i * 0.3;
            ctx.fillStyle = col;
            for (let j = -1; j <= 1; j++) {
                flameTongue(ctx, p.x + j * 16 * sc, p.y, 26 * sc,
                    (34 + 10 * Math.sin(p.life * 0.4 + j * 2 + i)) * sc, Math.sin(p.life * 0.2 + j) * 4);
            }
        });
    } else {
        ctx.translate(p.x, p.y);
        ctx.rotate(Math.atan2(p.vy, p.vx) - Math.PI / 2);   // kuyruk hareketin tersine uzar
        const flick = Math.sin(p.life * 0.6) * 6;
        FIRE_COLORS.forEach((col, i) => {
            const sc = 1 - i * 0.3;
            ctx.fillStyle = col;
            flameTongue(ctx, 0, 8 * sc, 30 * sc, (55 + flick) * sc);
        });
    }
    ctx.restore();
}

function drawDollarBill(ctx, x, y, size, angle) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(angle);
    ctx.fillStyle = "#22c55e"; 
    ctx.fillRect(-size, -size/2, size*2, size);
    ctx.strokeStyle = "#14532d";
    ctx.lineWidth = 1;
    ctx.strokeRect(-size, -size/2, size*2, size);
    ctx.fillStyle = "#f0fdf4";
    ctx.beginPath();
    ctx.ellipse(0, 0, size * 0.6, size * 0.4, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = "#166534";
    ctx.font = `bold ${size}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("$", 0, 0);
    ctx.restore();
}

function shoot() {

// --- BALYOZ ---
const SWING_FRAMES = 24, HAMMER_REACH = 190;
function hammer() {
    if(!gameStarted || player.isDying || paused || levelCompleted || player.swing > 0) return;
    player.swing = SWING_FRAMES;
    player.swingHit = false;
}

// Animasyon ilerlemesine (0→1) göre balyozun açısı: geri kaldır → öne indir → toparlan
const HAMMER_IDLE = 0.45, HAMMER_BACK = -1.4, HAMMER_DOWN = 1.9;
function hammerAngle() {
    if(player.swing <= 0) return HAMMER_IDLE;
    const p = 1 - player.swing / SWING_FRAMES;
    const ease = v => v * v * (3 - 2 * v);
    if(p < 0.3) return HAMMER_IDLE + (HAMMER_BACK - HAMMER_IDLE) * ease(p / 0.3);
    if(p < 0.5) return HAMMER_BACK + (HAMMER_DOWN - HAMMER_BACK) * ease((p - 0.3) / 0.2);
    if(p < 0.75) return HAMMER_DOWN;
    return HAMMER_DOWN + (HAMMER_IDLE - HAMMER_DOWN) * ease((p - 0.75) / 0.25);
}

function updateHammer() {
    if(player.swing <= 0) return;
    player.swing--;
    // Balyoz yere indiği anda (ilerleme %50) önündeki halkı ez
    if(!player.swingHit && 1 - player.swing / SWING_FRAMES >= 0.5) {
        player.swingHit = true;
        const cx = player.x + player.w / 2;
        const minX = Math.min(cx, cx + player.dir * HAMMER_REACH), maxX = Math.max(cx, cx + player.dir * HAMMER_REACH);
        const headX = cx + player.dir * (HAMMER_REACH - 40), headY = player.y + player.h - 10;
        for(let i = 0; i < 8; i++) createParticle(headX, headY);   // toz
        enemies.forEach(en => {
            if(!en.dead && en.x < maxX && en.x + en.w > minX && en.y < player.y + player.h + 20 && en.y + en.h > player.y - 60) {
                killEnemy(en);
            }
        });
        if(boss && boss.x + 30 < maxX && boss.x + boss.w - 30 > minX) damageBoss(2);
    }
}

function killEnemy(en) {
    if(en.dead) return;
    en.dead = true;
    killedEnemies++;
    createParticle(en.x + en.w/2, en.y, t("hit"), "white", 1.0);
    speak(t("enemyCry"), "Aoede");
    $('score').innerText = score += 2000; $('kills').innerText = killedEnemies;
    if(killedEnemies === targetKills) {
        // Hedef tamamlanınca bölüm sonu canavarı gelir (1: ALEVİ, 2: KURT)
        spawnBoss(player.x + 420);
    }
}

// --- BÖLÜM SONU CANAVARLARI ---
// Her canavar: boyut, can, arena genişliği, isim, üstüne basılabilen derinlik, hareket ve çizim
const BOSS_TYPES = {
    alevi: { w: 260, h: 340, hp: 12, arena: 700, nameKey: "bossName", stomp: 110, update: updateAlevi, draw: drawAlevi },
    kurt:  { w: 300, h: 190, hp: 16, arena: 900, nameKey: "kurtName", stomp: 70,  update: updateKurt,  draw: drawKurt }
};
function spawnBoss(x) {
    const kind = currentLevel === 1 ? 'alevi' : 'kurt';
    const T = BOSS_TYPES[kind], w = T.w, h = T.h;
    x = Math.min(x, WORLD_WIDTH - w - 100);
    boss = { kind, T, x, y: height - 60 - h, w, h, homeX: x, hp: T.hp, dir: -1, look: -1,
             timer: 0, charge: 0, attacks: 0, hurt: 0, anim: 0, dying: false, deathT: 0,
             state: 'walk', stateT: 0, vx: 0, vy: 0, run: 0, crouch: 0 };
    enemies = enemies.filter(en => en.dead || Math.abs(en.x - x) > 1500);   // arenada halk kalmasın
    bossCheckpoint = { score };
    createParticle(player.x + player.w / 2, player.y - 30, t("bossIntro"), "#f97316", 2.5);
}

function fireball(x, y, vx, vy) {
    projectiles.push({ type: 'fire', x, y, vx, vy, active: true, life: 400, angle: 0, grounded: false });
}

function bossAttack() {
    const b = boss;
    b.attacks++;
    const mx = b.x + b.w / 2, my = b.y + b.h * 0.3;
    if(b.attacks % 3 === 0) {
        // Her üçüncü saldırı: oyuncuya doğru üçlü alev
        const side = Math.sign(player.x + player.w / 2 - mx) || 1;
        for(let i = 0; i < 3; i++) fireball(mx, my, side * (6 + i * 2.5), -8 + i * 1.5);
    } else {
        // Etrafa alev yağmuru
        const n = 7;
        for(let i = 0; i < n; i++) {
            fireball(mx, b.y + 20, -9 + 18 * i / (n - 1) + (Math.random() - 0.5) * 2, -12 - Math.random() * 5);
        }
    }
}

function updateFire(p) {
    p.life--;
    if(!p.grounded) {
        p.vy += 0.35;
        const prevY = p.y;
        p.x += p.vx; p.y += p.vy;
        // Zemine/platforma düşünce orada yanmaya devam et
        for(const pl of platforms) {
            if(p.vy > 0 && p.x > pl.x && p.x < pl.x + pl.w && prevY <= pl.y && p.y >= pl.y) {
                p.grounded = true; p.y = pl.y; p.vx = p.vy = 0; p.life = 150;
                break;
            }
        }
    }
    if(player.isDying || !p.active) return;
    const hit = p.grounded
        // Yerdeki ateş: üstünden zıplanarak geçilebilir
        ? p.x > player.x - 5 && p.x < player.x + player.w + 5 && player.y + player.h > p.y - 30
        : p.x > player.x + 10 && p.x < player.x + player.w - 10 && p.y > player.y && p.y < player.y + player.h;
    if(hit) die();
}

function damageBoss(n) {
    if(!boss || boss.dying || boss.hurt > 0) return;
    boss.hp = Math.max(0, boss.hp - n);
    boss.hurt = 30;   // kısa dokunulmazlık (yanıp söner)
    createParticle(boss.x + boss.w / 2, boss.y + 40, "-" + n, "#fde047", 0.8);
    if(boss.hp > 0) return;
    boss.dying = true;
    levelEnding = true;
    projectiles = projectiles.filter(p => p.type === 'register');   // canavarın saldırıları silinir
    $('score').innerText = score += 20000;
    $('sfx-explosion').currentTime = 0; $('sfx-explosion').play().catch(()=>{});
    for(let i = 0; i < 30; i++) createParticle(boss.x + Math.random() * boss.w, boss.y + Math.random() * boss.h);
    speak(t("enemyCry"), "Aoede");
    setTimeout(completeLevel, 1800);
}

function updateBoss() {
    const b = boss;
    if(!b) return;
    b.anim++;
    if(b.dying) { if(++b.deathT > 60) boss = null; return; }
    if(b.hurt > 0) b.hurt--;
    b.T.update(b);

    // Temas: üstüne zıplayınca hasar, yandan değince ölüm
    if(!player.isDying && player.x + player.w - 30 > b.x + 40 && player.x + 30 < b.x + b.w - 40 &&
       player.y + player.h > b.y + 30 && player.y < b.y + b.h) {
        if(player.vy > 0 && player.y + player.h < b.y + b.T.stomp) { player.vy = -22; damageBoss(2); }
        else die();
    }
}

// ALEVİ: yavaşça yaklaşır, kollarını kaldırıp etrafa alev saçar
function updateAlevi(b) {
    const dist = (player.x + player.w / 2) - (b.x + b.w / 2);
    b.look = Math.sign(dist) || b.look;
    // Saldırı hazırlığında durur; değilse oyuncuya yavaşça yaklaşır (arenasından çıkmaz)
    if(b.charge <= 0 && Math.abs(dist) > 250) b.x += Math.sign(dist) * 1.3;
    b.x = Math.max(b.homeX - b.T.arena, Math.min(b.x, b.homeX + b.T.arena));

    if(!player.isDying && Math.abs(dist) < 1400 && b.charge <= 0 && ++b.timer > 110) { b.timer = 0; b.charge = 30; }
    if(b.charge > 0 && --b.charge === 0) bossAttack();
}

// KURT: koşarak yaklaşır; sırayla ATILMA (çömel → hızla koş) ve SIÇRAMA (zıpla → inişte şok dalgası)
function updateKurt(b) {
    const groundY = height - 60 - b.h;
    const dist = (player.x + player.w / 2) - (b.x + b.w / 2);
    b.look = Math.sign(dist) || b.look;
    switch(b.state) {
        case 'walk':
            b.dir = Math.sign(dist) || b.dir;
            if(Math.abs(dist) > 220) { b.x += b.dir * 2.2; b.run += 0.14; }
            if(!player.isDying && Math.abs(dist) < 1400 && ++b.timer > 80) {
                b.timer = 0;
                b.attacks++;
                b.next = b.attacks % 2 ? 'dash' : 'leap';
                b.state = 'crouch';
                b.stateT = b.next === 'dash' ? 40 : 28;   // hazırlık: oyuncuya kaçma süresi
                createParticle(b.x + b.w / 2, b.y - 50, b.next === 'dash' ? "GRRR!" : "AUUU!", "#e5e7eb", 1.0);
            }
            break;
        case 'crouch':
            if(--b.stateT <= 0) {
                b.dir = Math.sign(dist) || b.dir;
                if(b.next === 'dash') { b.state = 'dash'; b.stateT = 75; }
                else {
                    b.state = 'leap'; b.vy = -19;
                    const air = 2 * 19 / 0.9;   // havada kalma süresi (kare)
                    b.vx = Math.max(-12, Math.min(12, dist / air));
                }
            }
            break;
        case 'dash':
            b.x += b.dir * 13; b.run += 0.5;
            if(--b.stateT <= 0 || b.x <= b.homeX - b.T.arena || b.x >= b.homeX + b.T.arena) { b.state = 'walk'; b.timer = 20; }
            break;
        case 'leap':
            b.vy += 0.9; b.x += b.vx; b.y += b.vy;
            if(b.y >= groundY) {
                b.y = groundY; b.state = 'walk'; b.timer = 15;
                const cx = b.x + b.w / 2;
                [-1, 1].forEach(d => projectiles.push({ type: 'wave', x: cx + d * b.w * 0.3, y: height - 60, vx: d * 8, active: true, life: 85, angle: 0 }));
                for(let i = 0; i < 12; i++) createParticle(cx + (Math.random() - 0.5) * b.w, height - 70);
            }
            break;
    }
    if(b.state !== 'leap') b.y = groundY;
    b.x = Math.max(b.homeX - b.T.arena, Math.min(b.x, b.homeX + b.T.arena, WORLD_WIDTH - b.w));
    b.crouch += ((b.state === 'crouch' ? 1 : 0) - b.crouch) * 0.25;
}

// Şok dalgası zeminde ilerler; üstünden zıplanarak kaçılır
function updateWave(p) {
    p.x += p.vx;
    p.life--;
    if(player.isDying || !p.active) return;
    if(Math.abs(p.x - (player.x + player.w / 2)) < 40 && player.y + player.h > p.y - 45) die();
}

async function die() {
    // Bölüm bitmek üzereyken artık ölünmez
    if(player.isDying || levelCompleted || levelEnding) return;
    player.isDying = true;
    $('game-container').classList.add('shake');
    $('sfx-explosion').currentTime = 0; $('sfx-explosion').play().catch(()=>{});
    
    // Halk başarılı vuruş yaptığında GEBER yazısı çıkar
    createParticle(player.x + player.w/2, player.y + player.h/2, t("die"), "red", 2.0);
    
    speak(t("ouch"), "Kore");
    // Sayfayı yenilemek yerine bulunulan bölümü baştan başlat
    setTimeout(restartLevel, 2500);
}

function restartLevel() {
    // Canavara ulaşıldıysa halkları tekrar öldürmek gerekmez: doğrudan canavardan devam
    const cp = bossCheckpoint, start = levelStartScore;
    score = cp ? cp.score : start;
    $('score').innerText = score;
    createLevel();
    levelStartScore = start;
    if(cp) {
        killedEnemies = targetKills;
        $('kills').innerText = killedEnemies;
        spawnBoss(player.x + 420);
    }
}

function completeLevel() {
    if(levelCompleted) return;
    levelCompleted = true;
    $('lang-picker').hidden = true; // Dil sadece başlangıç ekranında seçilir
    paused = true;
    
    if (currentLevel === 1) {
        $('overlay-title').innerText = t("l1Title");
        $('overlay-note').innerText = t("l1Note");
        $('start-button').innerText = t("l1Btn");
        $('start-button').onclick = () => {
            currentLevel = 2; targetKills = 6;
            $('current-level').innerText = "2"; $('target-kills').innerText = "6";
            $('overlay-screen').style.display = 'none'; paused = false;
            createLevel();
        };
    } else {
        $('overlay-title').innerText = t("winTitle");
        $('overlay-note').innerText = t("winNote");
        $('start-button').innerText = t("winBtn");
        $('start-button').onclick = () => location.reload();
    }
    $('overlay-screen').style.display = 'flex';
}

function createLevel() {
    items = []; enemies = []; projectiles = []; playerProjectiles = []; particles = [];
    killedEnemies = 0; levelCompleted = false; levelEnding = false;
    boss = null; bossCheckpoint = null;
    levelStartScore = score;
    player.x = 100; player.y = 0; player.vx = 0; player.vy = 0; camX = 0;
    player.isDying = false; player.deathAngle = 0; player.opacity = 1; player.mouthOpen = 0; player.dir = 1;
    player.swing = 0; player.swingHit = false;
    $('game-container').classList.remove('shake');
    $('kills').innerText = "0";

    if (currentLevel === 1) {
        platforms = [
            {x: 0, y: height-60, w: 40000, h: 500},
            {x: 600, y: height-180, w: 200, h: 120},
            {x: 1200, y: height-250, w: 300, h: 50}, 
            {x: 1800, y: height-150, w: 150, h: 100},
            {x: 2300, y: height-350, w: 400, h: 50}
        ];
    } else {
        platforms = [
            {x: 0, y: height-60, w: 40000, h: 500},
            {x: 400, y: height-150, w: 150, h: 40},
            {x: 800, y: height-300, w: 150, h: 40},
            {x: 1200, y: height-450, w: 200, h: 40},
            {x: 1600, y: height-300, w: 300, h: 40}
        ];
    }

    for(let i=0; i<40; i++) {
        items.push({ x: 800 + i * 700, y: height - 150 - (Math.random() * 250), collected: false });
    }

    for(let i=0; i<20; i++) {
        const homeX = 1500 + i * 1500;
        enemies.push({
            x: homeX, y: height - 60 - 210, w: 160, h: 210,   // alt kenar zeminde
            timer: 0, interval: 200, dead: false,
            homeX: homeX,                          // Devriye merkezi
            dir: Math.random() < 0.5 ? -1 : 1,     // Yürüme yönü
            speed: currentLevel === 1 ? 1.5 : 2.5, // 2. bölümde daha hızlı
            walkCycle: Math.random() * Math.PI * 2
        });
    }
}

function update() {
    if(!gameStarted || paused) return;

    if(!player.isDying) {
        let moveDir = (keys.a ? -1 : (keys.d ? 1 : joyDir));
        player.vx = moveDir ? moveDir * player.speed : player.vx * 0.85;
        if(moveDir) player.dir = moveDir;
        // Adım hızı yürüme hızına bağlı: ayaklar yerde kaymaz
        if(player.grounded) player.legCycle += Math.abs(player.vx) * 0.06;

        player.vy += GRAVITY; 
        player.x += player.vx;
        player.y += player.vy;

        // Harita sınırları: zeminin dışına çıkılmasın
        player.x = Math.max(0, Math.min(player.x, WORLD_WIDTH - player.w));
        // Bir şekilde aşağı düşülürse öl
        if(player.y > height + 200) die();

        if(player.mouthOpen > 0) player.mouthOpen -= 0.05;
        updateHammer();

        player.grounded = false;
        for(let p of platforms) {
            if (player.x + player.w * 0.2 < p.x + p.w && player.x + player.w * 0.8 > p.x &&
                player.y + player.h > p.y && player.y + player.h < p.y + p.h + player.vy + 10 && player.vy >= 0) {
                player.y = p.y - player.h; player.vy = 0; player.grounded = true;
            }
        }
    } else {
        player.y += 2; player.deathAngle += 0.05; player.opacity -= 0.01;
    }

    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= (1/60); });
    particles = particles.filter(p => p.life > 0);
    camX = player.x - width/2;

    items.forEach(it => {
        if(!it.collected && Math.hypot(player.x + player.w/2 - it.x, player.y + player.h/2 - it.y) < 100) {
            it.collected = true; 
            score += 5000; 
            $('score').innerText = score;
            $('sfx-pickup').currentTime = 0; $('sfx-pickup').play();
            player.mouthOpen = 1.0; 
            speak(t("voices")[Math.floor(Math.random()*t("voices").length)], "Kore");
            createParticle(it.x, it.y, t("pickup"), "#22c55e", 0.8);
        }
    });

    enemies.forEach(en => {
        if(en.dead) return;

        // --- Düşman hareketi ---
        const PATROL_RANGE = 250, CHASE_RANGE = 400, CHASE_DIST = 700;
        const enCenter = en.x + en.w / 2, plCenter = player.x + player.w / 2;
        const distToPlayer = plCenter - enCenter;
        let speed = en.speed;
        if(!player.isDying && Math.abs(distToPlayer) < CHASE_DIST) {
            // Oyuncu yakında: ona doğru yürü (ama bölgesinden fazla uzaklaşma)
            en.dir = Math.sign(distToPlayer) || en.dir;
            speed *= 1.4;
            if(Math.abs(en.x + en.dir * speed - en.homeX) > CHASE_RANGE) speed = 0;
            if(Math.abs(distToPlayer) < 20) speed = 0; // Tam üstündeyken titreme olmasın
        } else {
            // Devriye: bölge sınırına gelince geri dön
            if(en.x - en.homeX > PATROL_RANGE) en.dir = -1;
            else if(en.x - en.homeX < -PATROL_RANGE) en.dir = 1;
        }
        en.x += en.dir * speed;
        en.x = Math.max(0, Math.min(en.x, WORLD_WIDTH - en.w));
        en.walkCycle += speed * 0.08;   // Adım hızı yürüme hızına bağlı
        en.lastSpeed = speed;           // Çizimde "yürüyor mu / duruyor mu" için

        if(Math.abs(en.x - player.x) < 1200 && ++en.timer > en.interval) {
            en.timer = 0;
            // Yazarkasaların menzili (life) kahramanın mermisinin (150) iki katı: 300
            projectiles.push({ type: 'register', 
                x: en.x, 
                y: en.y + 60, 
                vx: (player.x < en.x ? -10 : 10), 
                vy: -12, // Başlangıç yukarı hızı (yer çekimi etkisi için)
                active: true, 
                life: 300, 
                angle: 0 
            });
        }
        if(!player.isDying && player.x + 40 < en.x + en.w - 40 && player.x + player.w - 40 > en.x && player.y + player.h > en.y && player.y < en.y + en.h) {
            if(player.vy > 0 && player.y + player.h < en.y + 60) {
                player.vy = -18;
                killEnemy(en);   // üstüne zıplayınca ezilir
            } else die();
        }
    });

    playerProjectiles.forEach(p => {
        p.x += p.vx; p.vy += GRAVITY * 0.4; p.y += p.vy; p.angle += 0.2; p.life--;
        enemies.forEach(en => {
            if(!en.dead && p.active && p.x > en.x && p.x < en.x + en.w && p.y > en.y && p.y < en.y + en.h) {
                p.active = false;
                killEnemy(en);
            }
        });
        if(boss && !boss.dying && p.active && p.x > boss.x + 40 && p.x < boss.x + boss.w - 40 && p.y > boss.y && p.y < boss.y + boss.h) {
            p.active = false;
            damageBoss(1);
        }
    });
    playerProjectiles = playerProjectiles.filter(p => p.active && p.life > 0);

    projectiles.forEach(p => {
        p.x += p.vx; 
        if(p.type === 'fire') { updateFire(p); return; }
        if(p.type === 'wave') { updateWave(p); return; }
        p.vy += 0.25; // Yazarkasaya eklenen yer çekimi (gravity)
        p.y += p.vy;
        p.angle += 0.1;
        p.life--;
        if(!player.isDying && p.active && Math.hypot(p.x - (player.x + player.w/2), p.y - (player.h/2 + player.y)) < 80) {
            p.active = false;
            die();
        }
    });
    projectiles = projectiles.filter(p => p.active && p.life > 0);
    updateBoss();
}

// --- BACAK ANİMASYONU (Recep) ---
// Her bacak iki parçalı: kalça → diz → ayak bileği, ucunda ayakkabı.
// photoH: kafa resminin asıl yüksekliği (oran korunur); ratio: bacak boyu / kutu yüksekliği
const PLAYER_LEGS = {
    photoH: RECEP_HEAD.h,
    ratio: 0.333, width: 14, swing: 0.65,         // bacak boyu, kalınlık, adım açısı
    front: "#475569", back: "#334155",            // füme takım pantolon (arka bacak daha koyu)
    shoe: "#111111"
};

// Faza göre bir bacağın açıları: a = uyluk açısı (0 = dik, + = ileri), bend = diz bükümü
function legPose(phase, moving, airborne, swing) {
    if (airborne) return [{ a: 0.75, bend: 1.4 }, { a: -0.3, bend: 0.6 }];  // havada: bacaklar kırık
    if (!moving)  return [{ a: 0.08, bend: 0.06 }, { a: -0.08, bend: 0.06 }]; // ayakta duruş
    return [0, Math.PI].map(off => {
        const p = phase + off;
        // Öne doğru savrulurken (cos > 0) diz bükülür ve ayak yerden kalkar
        return { a: swing * Math.sin(p), bend: 0.12 + 1.1 * Math.max(0, Math.cos(p)) };
    });
}

function legJoints(hipX, hipY, len, leg) {
    const half = len / 2;
    const kx = hipX + Math.sin(leg.a) * half, ky = hipY + Math.cos(leg.a) * half;
    const s = leg.a - leg.bend;  // baldır uyluktan geriye kırılır (diz öne bakar)
    return { kx, ky, fx: kx + Math.sin(s) * half, fy: ky + Math.cos(s) * half, toe: Math.max(-0.5, Math.min(0.4, -s * 0.5)) };
}

function drawLeg(ctx, hipX, hipY, j, width, color, shoe) {
    ctx.strokeStyle = color;
    ctx.lineWidth = width;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.beginPath();
    ctx.moveTo(hipX, hipY);
    ctx.lineTo(j.kx, j.ky);
    ctx.lineTo(j.fx, j.fy);
    ctx.stroke();
    // Ayakkabı: öne uzanan yuvarlak burun, kalkan ayakta hafif eğik
    ctx.save();
    ctx.translate(j.fx, j.fy);
    ctx.rotate(j.toe);
    ctx.fillStyle = shoe;
    ctx.beginPath();
    ctx.ellipse(width * 0.45, width * 0.2, width * 1.0, width * 0.5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
}

// Kutunun (top-center = cx, topY; yükseklik h) alt kısmına bacakları çizer.
// Dönüş: { k: fotoğrafın asıl boyutuna göre ölçeği, drop: gövdenin adımlarla inip kalkma miktarı }
function drawLegs(ctx, cx, topY, h, dir, phase, moving, airborne, style) {
    const legSpace = h * style.ratio;
    const k = (h - legSpace) / style.photoH;        // fotoğraf kalan alana orantılı sığar
    const hipY = h - legSpace - style.width * 0.6;  // kalça çenenin hemen arkasında
    const len = h - style.width * 0.7 - hipY;       // ayakkabı tabanı tam zemine değsin
    const pose = legPose(phase, moving, airborne, style.swing);
    const hips = [3, -3];
    const joints = pose.map((leg, i) => legJoints(hips[i], hipY, len, leg));

    // Yerdeyken en alttaki ayak zemine bassın: gövde buna göre iner (doğal sallanma)
    const drop = airborne ? 0 : (hipY + len) - Math.max(joints[0].fy, joints[1].fy);

    ctx.save();
    ctx.translate(cx, topY + drop);
    ctx.scale(dir, 1);
    drawLeg(ctx, hips[1], hipY, joints[1], style.width, style.back, style.shoe);   // arka bacak önce
    drawLeg(ctx, hips[0], hipY, joints[0], style.width, style.front, style.shoe);
    ctx.restore();
    return { k, drop };
}

// Balyoz, oyuncunun merkezine göre piksel koordinatında (hx, hy) eldeki noktadan çizilir
function drawHammer(ctx, hx, hy, angle) {
    const L = 130;
    ctx.save();
    ctx.translate(hx, hy);            // el
    ctx.scale(0.94, 0.94);
    ctx.rotate(angle);
    // Sap
    ctx.fillStyle = "#8b5a2b";
    ctx.strokeStyle = "#5c3a1a";
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.roundRect(-5, -L, 10, L + 12, 4); ctx.fill(); ctx.stroke();
    // Demir baş
    const g = ctx.createLinearGradient(0, -L - 18, 0, -L + 18);
    g.addColorStop(0, "#9ca3af"); g.addColorStop(0.5, "#4b5563"); g.addColorStop(1, "#1f2937");
    ctx.fillStyle = g;
    ctx.strokeStyle = "#111827";
    ctx.beginPath(); ctx.roundRect(-24, -L - 16, 48, 32, 5); ctx.fill(); ctx.stroke();
    // Sapı tutan yumruk
    ctx.fillStyle = "#e8b48f";
    ctx.strokeStyle = "#7c4a2d";
    ctx.beginPath(); ctx.arc(0, -4, 10, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
    ctx.restore();
}

function drawBoss(ctx, b) {
    b.T.draw(ctx, b);
    if(!b.dying) {
        const name = t(b.T.nameKey);
        ctx.font = "bold 34px Arial";
        ctx.textAlign = "center";
        ctx.lineWidth = 5; ctx.strokeStyle = "#000";
        ctx.strokeText(name, b.x + b.w / 2, b.y - 35);
        ctx.fillStyle = "#fde047";
        ctx.fillText(name, b.x + b.w / 2, b.y - 35);
    }
}

// Canavar ölürken küçülür, vurulunca yanıp söner (orijin: ayakların ortası)
function bossBaseTransform(ctx, b, lift = 0) {
    ctx.translate(b.x + b.w / 2, b.y + b.h - lift);
    const shrink = b.dying ? Math.max(0, 1 - b.deathT / 60) : 1;
    ctx.scale(shrink, shrink);
    if(b.hurt > 0 && Math.floor(b.hurt / 4) % 2 === 0) ctx.globalAlpha = 0.45;
}

function drawAlevi(ctx, b) {
    const t0 = b.anim, W = b.w, H = b.h;
    const charge = b.charge > 0 ? 1 - b.charge / 30 : 0;   // saldırı hazırlığı 0→1
    ctx.save();
    bossBaseTransform(ctx, b, W * 0.17);   // alevin yuvarlak altı zemine otursun

    ctx.shadowColor = "#f97316";
    ctx.shadowBlur = 40;
    // Kollar: saldırıdan önce havaya kalkar
    [-1, 1].forEach(side => {
        ctx.save();
        ctx.translate(side * W * 0.36, -H * 0.42);
        ctx.rotate(side * (1.1 - charge * 0.9 + Math.sin(t0 * 0.1 + side) * 0.1));
        ctx.fillStyle = "#ea580c"; flameTongue(ctx, 0, 0, W * 0.24, H * 0.38);
        ctx.fillStyle = "#fde047"; flameTongue(ctx, 0, 0, W * 0.11, H * 0.24);
        ctx.restore();
    });
    // Gövde: içten dışa sarı → kırmızı alev katmanları ve titreyen taç
    [["#b91c1c", 1.0], ["#ea580c", 0.8], ["#f59e0b", 0.6], ["#fde047", 0.38]].forEach(([col, f], li) => {
        ctx.fillStyle = col;
        flameTongue(ctx, 0, 0, W * f, H * f * (0.95 + 0.05 * Math.sin(t0 * 0.2 + li)), Math.sin(t0 * 0.07 + li) * 10 * f);
        for(const i of [-2, -1, 1, 2]) {
            flameTongue(ctx, i * W * f * 0.2, -H * 0.05, W * f * 0.35,
                H * f * (0.55 + 0.12 * Math.sin(t0 * 0.25 + i * 1.7 + li)), Math.sin(t0 * 0.1 + i) * 12);
        }
    });
    ctx.shadowBlur = 0;

    // Yüz
    const fy = -H * 0.45, ex = W * 0.14;
    [-1, 1].forEach(side => {
        ctx.fillStyle = "#fffbeb";
        ctx.beginPath(); ctx.ellipse(side * ex, fy, 17, 13, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#111";
        ctx.beginPath(); ctx.arc(side * ex + b.look * 6, fy + 2, 6, 0, Math.PI * 2); ctx.fill();
        // Çatık kaşlar
        ctx.strokeStyle = "#7f1d1d"; ctx.lineWidth = 7; ctx.lineCap = "round";
        ctx.beginPath(); ctx.moveTo(side * (ex + 22), fy - 26); ctx.lineTo(side * (ex - 14), fy - 13); ctx.stroke();
    });
    // Ağız: saldırırken açılır, dişler zikzak
    const mh = 10 + charge * 26, my = fy + 48;
    ctx.fillStyle = "#450a0a";
    ctx.beginPath(); ctx.ellipse(0, my, 38, mh, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#fffbeb";
    ctx.beginPath();
    ctx.moveTo(-32, my - mh * 0.4);
    for(let i = 0; i <= 8; i++) ctx.lineTo(-32 + i * 8, my - mh * 0.4 + (i % 2 ? 10 : 0));
    ctx.lineTo(32, my - mh * 0.75); ctx.lineTo(-32, my - mh * 0.75);
    ctx.closePath(); ctx.fill();
    ctx.restore();
}

// KURT: yandan görünen gri kurt (sağa bakar, sola dönünce aynalanır)
function drawKurt(ctx, b) {
    const W = b.w, H = b.h, c = b.crouch, air = b.state === 'leap';
    const angry = b.state === 'crouch' || b.state === 'dash';
    const moving = b.state === 'dash' || (b.state === 'walk' && Math.abs((player.x + player.w / 2) - (b.x + W / 2)) > 220);
    ctx.save();
    bossBaseTransform(ctx, b);
    ctx.scale(b.dir, 1);

    const bodyY = -H * 0.5 + c * 24;   // gövde merkezi (çömelince alçalır)
    const hipY = bodyY + 12;

    // Bacak: kalça → diz → pati; koşarken ileri-geri salınır, havada uzanır
    const leg = (hx, phase, col) => {
        const len = -hipY - 6;   // patiler zemine değsin
        let a = 0;
        if(air) a = hx > 0 ? -0.8 : 0.8;
        else if(moving) a = Math.sin(b.run + phase) * 0.55;
        const kx = hx + Math.sin(a) * len * 0.5, ky = hipY + Math.cos(a) * len * 0.5;
        const a2 = a * 0.3 + (hx > 0 ? 0.15 : -0.25);   // arka bacak dizi geriye kırılır
        const fx = kx + Math.sin(a2) * len * 0.5, fy = ky + Math.cos(a2) * len * 0.5;
        ctx.strokeStyle = col; ctx.lineWidth = 18; ctx.lineCap = "round"; ctx.lineJoin = "round";
        ctx.beginPath(); ctx.moveTo(hx, hipY); ctx.lineTo(kx, ky); ctx.lineTo(fx, fy); ctx.stroke();
        ctx.fillStyle = "#374151";
        ctx.beginPath(); ctx.ellipse(fx + 6, fy, 14, 8, 0, 0, Math.PI * 2); ctx.fill();
    };
    // Uzaktaki bacaklar (koyu) önce
    leg(-W * 0.26, Math.PI, "#4b5563");
    leg(W * 0.22, 0, "#4b5563");

    // Kuyruk: gür, hafif sallanır
    const tw = Math.sin(b.anim * 0.15) * 10;
    ctx.fillStyle = "#6b7280";
    ctx.beginPath();
    ctx.moveTo(-W * 0.32, bodyY - 18);
    ctx.quadraticCurveTo(-W * 0.52, bodyY - 30 + tw, -W * 0.56, bodyY - 75 + tw);
    ctx.quadraticCurveTo(-W * 0.44, bodyY - 30 + tw, -W * 0.3, bodyY + 8);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#d1d5db";
    ctx.beginPath(); ctx.ellipse(-W * 0.55, bodyY - 70 + tw, 7, 12, -0.4, 0, Math.PI * 2); ctx.fill();

    // Gövde + açık renk karın + sırttaki diken tüyler
    ctx.fillStyle = "#6b7280";
    ctx.beginPath(); ctx.ellipse(0, bodyY, W * 0.36, H * 0.2, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#9ca3af";
    ctx.beginPath(); ctx.ellipse(W * 0.02, bodyY + H * 0.09, W * 0.27, H * 0.09, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#4b5563";
    for(let i = -4; i <= 4; i++) {
        const x = i * W * 0.07, y = bodyY - H * 0.19 + Math.abs(i) * 2;
        ctx.beginPath(); ctx.moveTo(x - 10, y + 6); ctx.lineTo(x + 2, y - 12); ctx.lineTo(x + 10, y + 6); ctx.closePath(); ctx.fill();
    }

    // Yakındaki bacaklar (açık)
    leg(-W * 0.2, 0, "#6b7280");
    leg(W * 0.28, Math.PI, "#6b7280");

    // Boyun + kafa
    const hx = W * 0.36, hy = bodyY - H * 0.24 + c * 14;
    ctx.fillStyle = "#6b7280";
    ctx.beginPath();
    ctx.moveTo(W * 0.18, bodyY - H * 0.14); ctx.lineTo(hx - 10, hy - 26); ctx.lineTo(hx + 20, hy + 20); ctx.lineTo(W * 0.3, bodyY + H * 0.1);
    ctx.closePath(); ctx.fill();
    // Kulaklar
    ctx.fillStyle = "#4b5563";
    ctx.beginPath(); ctx.moveTo(hx - 30, hy - 20); ctx.lineTo(hx - 22, hy - 62); ctx.lineTo(hx - 4, hy - 26); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#6b7280";
    ctx.beginPath(); ctx.moveTo(hx - 8, hy - 24); ctx.lineTo(hx + 4, hy - 64); ctx.lineTo(hx + 18, hy - 22); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#f9a8d4";
    ctx.beginPath(); ctx.moveTo(hx - 2, hy - 26); ctx.lineTo(hx + 4, hy - 52); ctx.lineTo(hx + 12, hy - 25); ctx.closePath(); ctx.fill();
    // Kafa
    ctx.fillStyle = "#6b7280";
    ctx.beginPath(); ctx.ellipse(hx, hy, 42, 34, 0, 0, Math.PI * 2); ctx.fill();
    // Alt çene: saldırırken açılır
    const jaw = angry ? 0.45 : 0.08;
    ctx.save();
    ctx.translate(hx + 18, hy + 10);
    ctx.rotate(jaw);
    ctx.fillStyle = "#7f1d1d";
    ctx.beginPath(); ctx.moveTo(0, -6); ctx.lineTo(66, -4); ctx.lineTo(0, 8); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#9ca3af";
    ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(66, -2); ctx.lineTo(60, 8); ctx.lineTo(0, 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";
    for(let i = 0; i < 4; i++) { ctx.beginPath(); ctx.moveTo(14 + i * 13, -3); ctx.lineTo(20 + i * 13, -3); ctx.lineTo(17 + i * 13, -11); ctx.closePath(); ctx.fill(); }
    ctx.restore();
    // Burun (üst çene)
    ctx.fillStyle = "#9ca3af";
    ctx.beginPath(); ctx.moveTo(hx + 10, hy - 18); ctx.lineTo(hx + 88, hy + 2); ctx.lineTo(hx + 86, hy + 12); ctx.lineTo(hx + 12, hy + 14); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#fff";
    for(let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(hx + 22 + i * 13, hy + 13); ctx.lineTo(hx + 29 + i * 13, hy + 13); ctx.lineTo(hx + 25 + i * 13, hy + 22); ctx.closePath(); ctx.fill(); }
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(hx + 86, hy + 3, 7, 0, Math.PI * 2); ctx.fill();
    // Göz: hazırlık/atılmada kırmızı parlar
    ctx.fillStyle = angry ? "#ef4444" : "#facc15";
    if(angry) { ctx.shadowColor = "#ef4444"; ctx.shadowBlur = 15; }
    ctx.beginPath(); ctx.ellipse(hx + 14, hy - 10, 9, 7, 0, 0, Math.PI * 2); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#111";
    ctx.beginPath(); ctx.arc(hx + 17, hy - 10, 3.5, 0, Math.PI * 2); ctx.fill();
    // Çatık kaş
    ctx.strokeStyle = "#1f2937"; ctx.lineWidth = 5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(hx, hy - 24); ctx.lineTo(hx + 28, hy - 14); ctx.stroke();
    ctx.restore();
}

// Şok dalgası: zeminde ilerleyen toz ve taş kabarması
function drawWave(ctx, p) {
    const fade = Math.min(1, p.life / 20);
    ctx.save();
    ctx.globalAlpha = 0.85 * fade;
    ctx.fillStyle = "#a16207";
    ctx.beginPath(); ctx.ellipse(p.x, p.y, 34, 40 * fade, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = "#d6d3d1";
    for(let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.arc(p.x + i * 14 - Math.sign(p.vx) * 4, p.y - 22 * fade - Math.abs(i) * -8, 6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
}

// Ekranın üstünde canavarın can barı
function drawBossBar(ctx, b) {
    const w = Math.min(500, width - 40), x = (width - w) / 2, y = 95;
    ctx.fillStyle = "rgba(0,0,0,0.6)";
    ctx.fillRect(x - 4, y - 4, w + 8, 26);
    ctx.fillStyle = "#dc2626";
    ctx.fillRect(x, y, w * b.hp / b.T.hp, 18);
    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(t(b.T.nameKey) + "  " + b.hp + " / " + b.T.hp, width / 2, y + 9);
    ctx.textBaseline = "alphabetic";
}

function draw() {
    ctx.clearRect(0,0,width,height);
    ctx.save();
    ctx.translate(-camX, 0);

    platforms.forEach(p => {
        ctx.fillStyle = "#2d1b0d"; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = "#1e4d16"; ctx.fillRect(p.x, p.y, p.w, 15);
    });

    items.forEach(it => { if(!it.collected) drawKulHakkiBag(ctx, it.x, it.y, 80); });
    enemies.forEach(en => {
        if(en.dead) return;
        // Halk'ın fotoğrafı boydan (kendi ayakları var), o yüzden ek bacak yok:
        // yürürken ayakların üstünde sağa-sola salınır, her adımda hafif yükselir.
        const moving = en.lastSpeed > 0;
        const p = en.walkCycle;
        const sway = moving ? Math.sin(p) * 0.07 + en.dir * 0.03 : 0;  // salınım + yürüme yönüne hafif eğilme
        const bob  = moving ? -Math.abs(Math.cos(p)) * 6 : 0;          // adım ortasında yükselme
        // Kırpılmış fotoğraf kutu yüksekliğine oranını koruyarak sığar, ayaklar zeminde
        const c = enemyCrop || { sx: 0, sy: 0, sw: imgEnemy.naturalWidth, sh: imgEnemy.naturalHeight };
        if(!c.sw) return;   // resim henüz yüklenmedi
        const dh = en.h, dw = Math.min(en.w, dh * c.sw / c.sh);
        ctx.save();
        ctx.translate(en.x + en.w / 2, en.y + en.h);   // dönme noktası: ayakların ortası
        ctx.rotate(sway);
        if(en.dir === -1) ctx.scale(-1, 1);        // yürüdüğü yöne baksın
        ctx.drawImage(enemySprite, c.sx, c.sy, c.sw, c.sh, -dw / 2, -dh + bob, dw, dh);
        ctx.restore();
    });
    if(boss) drawBoss(ctx, boss);

    ctx.save();
    ctx.translate(player.x + player.w/2, player.y + player.h/2);
    ctx.globalAlpha = player.opacity;
    if(player.isDying) ctx.rotate(player.deathAngle);
    if(player.dir === -1 && !player.isDying) ctx.scale(-1, 1);

    const playerMoving = player.grounded && Math.abs(player.vx) > 1;
    const body = drawLegs(ctx, 0, -player.h/2, player.h, 1, player.legCycle, playerMoving, !player.grounded, PLAYER_LEGS);

    // Kafa, kaynak resim pikselleriyle çizilir; boyun noktası bacakların tam üstüne gelir
    const H = RECEP_HEAD, k = body.k, top = -player.h/2 + body.drop;
    ctx.save();
    ctx.translate(-(H.neckX - H.x) * k, top);
    ctx.scale(k, k);
    if(headCanvas) ctx.drawImage(headCanvas, 0, 0);
    if(player.mouthOpen > 0.1) {
        const mx = H.mouthX - H.x, my = H.mouthY - H.y, m = player.mouthOpen;
        ctx.fillStyle = "black";
        ctx.beginPath();
        ctx.ellipse(mx, my, 15 * m, 19 * m, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "white";
        ctx.fillRect(mx - 5, my - 15 * m, 10, 5 * m);
    }
    ctx.restore();
    drawHammer(ctx, (H.handX - H.neckX) * k, top + (H.handY - H.y) * k, hammerAngle());
    ctx.restore();

    playerProjectiles.forEach(p => {
        drawDollarBill(ctx, p.x, p.y, 20, p.angle);
    });
    
    projectiles.forEach(p => {
        if(p.type === 'fire') drawFire(ctx, p);
        else if(p.type === 'wave') drawWave(ctx, p);
        else drawCashRegister(ctx, p.x, p.y, 55, p.angle);
    });

    particles.forEach(p => {
        ctx.globalAlpha = p.life / (p.maxLife || 1);
        if(p.text) {
            ctx.fillStyle = p.color;
            ctx.font = "bold 40px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.text, p.x, p.y);
        } else {
            ctx.fillStyle = "white";
            ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill();
        }
    });

    ctx.restore();
    ctx.globalAlpha = 1;
    if(boss && !boss.dying) drawBossBar(ctx, boss);
}

// Sabit adımlı döngü: oyun mantığı her ekranda saniyede 60 kez çalışır
// (120 Hz ekranlarda oyun hızlanmaz, 30 Hz'de yavaşlamaz)
const STEP = 1000 / 60;
let lastTime = null, accumulator = 0;
function loop(now) {
    if(lastTime === null) lastTime = now;
    // Sekme arka plandayken biriken süreyi sınırla (geri dönünce ışınlanma olmasın)
    accumulator += Math.min(now - lastTime, 250);
    lastTime = now;
    while(accumulator >= STEP) { update(); accumulator -= STEP; }
    draw();
    requestAnimationFrame(loop);
}

window.onkeydown = e => { 
    let k = e.key.toLowerCase();
    if(k==='a') keys.a=true; if(k==='d') keys.d=true; 
    if(e.key===' ') jump(); if(e.key==='Enter') shoot(); if(k==='f' && !e.repeat) hammer(); 
};
window.onkeyup = e => { 
    let k = e.key.toLowerCase();
    if(k==='a') keys.a=false; if(k==='d') keys.d=false; 
};

// --- AÇILIŞ VİDEOSU (YouTube gömme oynatıcı) ---
// Tarayıcılar sesli otomatik oynatmaya izin vermez: video sessiz başlar,
// açılış ekranına ilk dokunuşta ya da SESİ AÇ butonuyla ses açılır.
const INTRO_VIDEO_ID = '4bhL8RSmYEA';
let introPlayer = null;
function updateSoundBtn() {
    const b = document.getElementById('sound-btn');
    if (b) b.textContent = t(b.dataset.on ? 'soundOff' : 'soundOn');
}
function setIntroSound(on) {
    const b = $('sound-btn');
    if (!b) return;
    b.dataset.on = on ? '1' : '';
    updateSoundBtn();
    if (!introPlayer || !introPlayer.unMute) return;   // oynatıcı hazır olunca onReady uygular
    if (on) { introPlayer.unMute(); introPlayer.setVolume(100); introPlayer.playVideo(); }
    else introPlayer.mute();
}
function removeIntro() {
    try { if (introPlayer && introPlayer.destroy) introPlayer.destroy(); } catch (e) {}
    introPlayer = null;
    ['intro-video', 'sound-btn'].forEach(id => { const el = $(id); if (el) el.remove(); });
}
window.onYouTubeIframeAPIReady = () => {
    if (!$('yt-player')) return;   // oyun çoktan başladıysa
    introPlayer = new YT.Player('yt-player', {
        videoId: INTRO_VIDEO_ID,
        playerVars: { autoplay: 1, mute: 1, controls: 0, loop: 1, playlist: INTRO_VIDEO_ID,
                      playsinline: 1, rel: 0, disablekb: 1, fs: 0, iv_load_policy: 3 },
        events: {
            onReady: e => { e.target.mute(); e.target.playVideo(); if ($('sound-btn') && $('sound-btn').dataset.on) setIntroSound(true); },
            onError: removeIntro     // video açılamazsa eski koyu arka plan kalır
        }
    });
};
(() => {
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.async = true;
    document.head.appendChild(tag);
})();
$('sound-btn').addEventListener('click', () => setIntroSound(!$('sound-btn').dataset.on));
$('overlay-screen').addEventListener('pointerdown', e => {
    const b = $('sound-btn');
    if (!b || b.dataset.touched || e.target === b) return;
    b.dataset.touched = '1';
    setIntroSound(true);
});

$('start-button').onclick = () => {
    removeIntro();
    $('overlay-screen').style.display = 'none';
    gameStarted = true;
    resizeCanvas();
    createLevel();
    requestAnimationFrame(loop);
    const bgMusic = $('bg-music');
    bgMusic.volume = 0.1; bgMusic.play().catch(()=>{});
};

// --- JOYSTICK ---
let joyDir = 0, joyPointer = null;
const joyWrap = $('joystick-wrapper'), joyStick = $('joystick-stick');
const JOY_MAX = 35, JOY_DEADZONE = 10;

function joyMove(e) {
    const r = joyWrap.getBoundingClientRect();
    let dx = e.clientX - (r.left + r.width / 2);
    let dy = e.clientY - (r.top + r.height / 2);
    const dist = Math.hypot(dx, dy);
    if (dist > JOY_MAX) { dx = dx / dist * JOY_MAX; dy = dy / dist * JOY_MAX; }
    joyStick.style.transform = `translate(${dx}px, ${dy}px)`;
    joyDir = Math.abs(dx) < JOY_DEADZONE ? 0 : Math.sign(dx);
}
function joyEnd(e) {
    if (e.pointerId !== joyPointer) return;
    joyPointer = null; joyDir = 0;
    joyStick.style.transform = '';
}
joyWrap.addEventListener('pointerdown', e => {
    e.preventDefault();
    joyPointer = e.pointerId;
    joyWrap.setPointerCapture(e.pointerId);
    joyMove(e);
});
joyWrap.addEventListener('pointermove', e => { if (e.pointerId === joyPointer) joyMove(e); });
joyWrap.addEventListener('pointerup', joyEnd);
joyWrap.addEventListener('pointercancel', joyEnd);

$('jump-btn').addEventListener('pointerdown', e => { e.preventDefault(); jump(); });
$('shoot-btn').addEventListener('pointerdown', e => { e.preventDefault(); shoot(); });
$('hammer-btn').addEventListener('pointerdown', e => { e.preventDefault(); hammer(); });
// Canvas'ı ekranın gerçek piksel yoğunluğuna göre boyutlandır (Retina/telefonlarda net görüntü).
// Oyun kodu CSS pikseliyle çalışmaya devam eder; ölçekleme setTransform ile yapılır.
function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

window.onresize = () => {
    const oldHeight = height;
    resizeCanvas();
    if(!gameStarted || oldHeight === undefined) return;
    // Dünya ekranın altına hizalı; yükseklik değişince her şeyi aynı miktarda kaydır
    const dy = height - oldHeight;
    if(dy === 0) return;
    [platforms, items, enemies, projectiles, playerProjectiles, particles].forEach(list => list.forEach(o => o.y += dy));
    player.y += dy;
    if(boss) boss.y += dy;
};
